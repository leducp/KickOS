site_name: KickOS
docs_dir: docs
site_dir: build/docs-site
use_directory_urls: false
theme:
  name: material
  features: [navigation.tabs, navigation.tabs.sticky, navigation.sections, navigation.top, navigation.indexes, search.highlight, content.code.copy]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences
