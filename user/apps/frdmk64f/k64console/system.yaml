# The ceiling keeps every writer below the driver's priority.

version: 1
stdout: /svc/console
ends: main

tasks:
  - name: k64uartirq
    driver: k64uartirq
    devices: [/dev/uart0]
    accepts: [coarse_gate, device_not_isolated]
    lines: { rxtx: /dev/uart0/rxtx }
    serves: /svc/console
    priority: 12

  - name: main
    entry: kickos_main
    priority: 2
    ceiling: 11
