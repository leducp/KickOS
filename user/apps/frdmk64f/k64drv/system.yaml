version: 1
stdout: kernel
ends: k64drv

tasks:
  - name: k64drv
    entry: k64drv_main
    priority: 10
    ceiling: 10
    devices: [/dev/lptmr0]
    lines: { irq: /dev/lptmr0/irq }
    accepts: [coarse_gate, device_not_isolated]
