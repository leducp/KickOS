#
# The DSPI0 slot witness: `holder` owns DSPI0's window on the local engine, `main` waits for its
# end on the init's report and then probes the slot from a task of its own.

version: 1
stdout: kernel
ends: main

tasks:
  - name: holder
    entry: k64dspi_holder_main
    priority: 9
    ceiling: 9
    devices: [/dev/dspi0]
    accepts: [coarse_gate, device_not_isolated]
    authority: [pinmux]

  - name: main
    entry: k64dspi_watch_main
    priority: 5
    ceiling: 5
    watches: [holder]
    authority: [tasks]
