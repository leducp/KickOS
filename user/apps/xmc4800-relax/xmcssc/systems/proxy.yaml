# The packaged xmcssc serving the SSC bus over USIC0 channel 1, then the client using its endpoint.

version: 1
stdout: kernel
ends: client

tasks:
  - name: xmcssc
    driver: xmcssc
    devices: [/dev/usic0/ch1]
    accepts: [coarse_gate] # USIC0 is one gate, and the kernel's console is its channel 0
    lines: { irq: /dev/usic0/sr1 }
    core: 0
    serves: /svc/spi0
    priority: 12

  - name: client
    entry: xmcssc_main
    priority: 9
    ceiling: 9
    uses: [/svc/spi0]
