# The ceiling keeps every writer below the driver's priority.

version: 1
stdout: /svc/console
ends: main

tasks:
  - name: xmcuartirq
    driver: xmcuartirq
    devices: [/dev/usic0/ch0]
    lines: { irq: /dev/usic0/sr0 }
    serves: /svc/console
    priority: 12

  - name: main
    entry: kickos_main
    priority: 2
    ceiling: 11
