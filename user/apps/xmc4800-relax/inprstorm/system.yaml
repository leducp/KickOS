# The entry holds the channel window and storms below the heartbeat thread it spawns.

version: 1
stdout: kernel
ends: never

tasks:
  - name: inprstorm
    entry: inprstorm_main
    priority: 2
    ceiling: 2
    devices: [/dev/usic0/ch1]
