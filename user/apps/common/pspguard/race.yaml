#
# The board's default composition with irq added to main's authority, for the line the waker
# parks on.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 20
    authority: [memory, system, irq, tasks]
