# Main holds every authority, as root does: KOS_SYS_WITNESS_UACCESS refuses any other caller.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    entry: kickos_main
    priority: 2
    ceiling: 2
    authority: [memory, pinmux, pstate, irq, system, console, tasks, bus_master, bootloader]
