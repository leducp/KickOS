#
# The packaged simcon serving stdout, then main, which calls the endpoint simcon serves through a
# use holding `read` and `control`, and through its stdout seat, which holds `write` alone.

version: 1
stdout: /svc/console
ends: main

tasks:
  - name: simcon
    driver: simcon
    serves: /svc/console
    priority: 12

  - name: main
    program: simconabi_main
    priority: 2
    ceiling: 2
    uses: [{ path: /svc/console, rights: [read, control] }]
    authority: [memory, system, tasks]
