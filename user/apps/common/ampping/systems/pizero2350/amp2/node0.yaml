version: 1
board: pizero2350
stdout: kernel
ends: main
heap: 16384

shared:
  - name: /shm/ampbook
    size: 256
    cache: cached
    partition: true

tasks:
  - name: main
    entry: ampping_main
    stack: 8192
    priority: 5
    ceiling: 5
    authority: [system]
    devices: [/dev/uart0]
    uses: [/amp/3]
    maps: { /shm/ampbook: rw }
