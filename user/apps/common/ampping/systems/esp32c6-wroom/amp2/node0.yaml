version: 1
board: esp32c6-wroom
stdout: kernel
ends: main
heap: 0
accepts: [no_protection, no_privilege_split]

shared:
  - name: /shm/ampbook
    size: 256
    cache: cached
    partition: true

tasks:
  - name: main
    entry: ampping_main
    stack: 8192
    priority: 5
    ceiling: 5
    authority: [system]
    devices: [/dev/timg0]
    uses: [/amp/3]
    maps: { /shm/ampbook: rw }
