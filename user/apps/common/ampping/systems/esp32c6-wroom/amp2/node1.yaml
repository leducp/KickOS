version: 1
board: esp32c6-wroom
stdout: kernel
ends: never
heap: 0
accepts: [no_protection, no_privilege_split]

shared:
  - name: /shm/ampbook
    size: 256
    cache: cached
    partition: true

tasks:
  - name: serve
    entry: ampserve_main
    stack: 8192
    priority: 5
    ceiling: 5
    devices: [/dev/timg1]
    serves: /amp/3
    maps: { /shm/ampbook: rw }
