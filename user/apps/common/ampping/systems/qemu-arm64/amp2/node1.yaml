version: 1
board: qemu-arm64
stdout: kernel
ends: never
heap: 16384

shared:
  - name: /shm/ampbook
    size: 256
    cache: uncached
    partition: true

tasks:
  - name: serve
    entry: ampserve_main
    stack: 16384
    priority: 5
    ceiling: 5
    serves: /amp/3
    maps: { /shm/ampbook: rw }
