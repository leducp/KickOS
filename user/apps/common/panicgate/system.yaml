# Case 6: main, and the peer, a program of its own holding no authority, which main creates.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: panicgate6
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks]

  - name: pgtask
    program: panicgate_peer
    priority: 2
    ceiling: 2
    start: on_request
    budgets: { threads: 1 }
