version: 1
board: qemu-arm64
stdout: kernel
ends: never
heap: 16384

tasks:
  - name: main
    program: main
    stack: 8192
    priority: 5
    ceiling: 5

  # Node 1's standard output, each message written whole on this node's console.
  - name: relay
    program: amprelay
    stack: 8192
    priority: 5
    ceiling: 5
    serves: /amp/6
    budgets: { threads: 1 }
