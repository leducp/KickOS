#
# The test as main, and its peer, a program of its own, which main creates to see a task's
# constructors and unwinding in a space of its own.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: cxxtest
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks]

  - name: peer
    program: cxxtest_peer
    priority: 3
    ceiling: 10
    start: on_request
    budgets: { threads: 1 }
