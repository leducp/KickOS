#
# The blinker as the task's entry, holding GPIOB, whose PTB22 the kernel's diagnostic LED
# spends, and `pinmux` to mux its own pin.

version: 1
board: frdmk64f
stdout: kernel
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: main
    entry: gpioblink_main
    stack: 8192
    priority: 10
    ceiling: 10
    devices: [/dev/gpio/1]
    accepts: [coarse_gate, device_not_isolated]
    authority: [pinmux]
