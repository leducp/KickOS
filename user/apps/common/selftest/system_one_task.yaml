#
# The suite on a chip that holds one task: main alone, as in system.yaml.

version: 1
stdout: kernel
ends: main
heap: 0

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, pinmux, irq, console, tasks, bus_master, bootloader]
    # Every arena block of every arm is reserved at start, and a block is never freed.
    budgets: { ram_blocks: 48 }
