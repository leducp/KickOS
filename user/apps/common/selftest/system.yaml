#
# The suite as main, holding the authority its arms drive and spawning above itself. No arm
# allocates from the libc heap, and the 64 KiB parts' arena has no room for one.
# system_small.yaml is the same suite with main's figures of the variants CMakeLists.txt
# names for it.

version: 1
stdout: kernel
ends: main
heap: 0

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, pinmux, irq, console, tasks, bus_master, bootloader]
    # Every arena block of every arm is reserved at start, and a block is never freed.
    budgets: { ram_blocks: 48, endpoints: 3, notifications: 7, irq_bindings: 7 }
    caps: { width: 16 }

  # Started by the arms, never by the init: each runs the role its argv names.
  - name: peer0
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer1
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer2
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  # On core 0 alone, a task narrower than the machine.
  - name: peer3
    program: stpeer
    priority: 10
    ceiling: 12
    core: 0
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }
