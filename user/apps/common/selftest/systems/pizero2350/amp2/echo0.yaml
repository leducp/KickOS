# ampecho on node 0: the peer the suite calls, echoing on the first port the partition names
# this node, the others served by a task that answers nothing.

version: 1
stdout: kernel
ends: never
# The least heap that holds newlib's stdout buffer, so a printed line leaves in one write.
heap: 1048

shared:
  - name: /shm/share
    size: 0x4000
    cache: cached
    partition: true

tasks:
  - name: echo
    program: main
    priority: 5
    ceiling: 5
    authority: [realtime]
    serves: /amp/2
    maps: { /shm/share: rw }

  # Node 1's standard output, each message written whole on this node's console.
  - name: relay
    program: amprelay
    priority: 5
    ceiling: 5
    serves: /amp/6
    budgets: { threads: 1 }
