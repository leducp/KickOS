# ampecho on node 1: the peer the suite calls, echoing on the first port the partition names
# this node, the others served by a task that never receives.

version: 1
stdout: kernel
ends: never
heap: 0

shared:
  - name: /shm/share
    size: 0x4000
    cache: cached
    partition: true

tasks:
  - name: echo
    program: main
    priority: 5
    ceiling: 5
    authority: [realtime]
    serves: /amp/3
    maps: { /shm/share: rw }

  - name: spare4
    program: ampecho_spare
    priority: 4
    ceiling: 4
    serves: /amp/4
