#
# The suite on the shared image's node 0, whose peers run no kernel, serving the port the
# partition names it and using the ports it names node 1.

version: 1
stdout: kernel
ends: main
heap: 0

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, pinmux, irq, console, tasks, bus_master, bootloader]
    serves: /amp/2
    uses: [/amp/0, /amp/3]
    # Every arena block of every arm is reserved at start, and a block is never freed.
    budgets: { ram_blocks: 48, endpoints: 7, notifications: 7, irq_bindings: 7 }
    caps: { width: 16 }

  # Started by the arms, never by the init: each runs the role its argv names.
  - name: peer0
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer1
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer2
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  # On core 0 alone, a task narrower than the machine.
  - name: peer3
    program: stpeer
    priority: 10
    ceiling: 12
    core: 0
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }
