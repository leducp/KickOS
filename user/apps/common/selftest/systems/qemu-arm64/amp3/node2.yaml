#
# The suite on node 2, serving the first port the partition names it and using every port it
# names another node.

version: 1
stdout: kernel
ends: main
heap: 0

shared:
  - name: /shm/share
    size: 0x100000
    cache: cached
    partition: true

tasks:
  - name: main
    entry: selftest_main
    priority: 2
    ceiling: 31
    authority: [memory, system, pinmux, irq, console, tasks, bus_master]
    serves: /amp/5
    uses: [/amp/2, /amp/3, /amp/4]
    maps: { /shm/share: rw }
