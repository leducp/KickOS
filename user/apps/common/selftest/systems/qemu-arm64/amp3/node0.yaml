#
# The suite on node 0, serving the first port the partition names it and using every port it
# names another node.

version: 1
stdout: kernel
ends: main
heap: 0

shared:
  - name: /shm/share
    size: 0x100000
    cache: cached
    partition: true

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, pinmux, irq, console, tasks, bus_master, bootloader]
    serves: /amp/2
    uses: [/amp/3, /amp/4, /amp/5]
    maps: { /shm/share: rw }
    # Every arena block of every arm is reserved at start, and a block is never freed.
    budgets: { ram_blocks: 48, endpoints: 9, notifications: 7, irq_bindings: 7 }
    caps: { width: 16 }

  # Started by the arms, never by the init: each runs the role its argv names.
  - name: peer0
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer1
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer2
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  # On core 0 alone, a task narrower than the machine.
  - name: peer3
    program: stpeer
    priority: 10
    ceiling: 12
    core: 0
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }
