# ampecho on node 2: the peer the suite calls, echoing on the first port the partition names
# this node, the others served by a task that never receives.

version: 1
stdout: kernel
ends: never
heap: 0

shared:
  - name: /shm/share
    size: 0x100000
    cache: cached
    partition: true

tasks:
  - name: echo
    entry: ampecho_main
    priority: 5
    ceiling: 5
    serves: /amp/5
    maps: { /shm/share: rw }
