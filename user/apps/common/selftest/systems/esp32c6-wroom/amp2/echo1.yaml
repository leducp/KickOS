#
# ampecho on node 1: the peer the suite calls, echoing on the first port the partition names
# this node; port 4 is served by a task that answers nothing, and port 7 by one an arm ends.

version: 1
stdout: /amp/6
ends: never
# The least heap that holds newlib's stdout buffer, so a printed line leaves in one write.
heap: 1032

shared:
  - name: /shm/share
    size: 0x4000
    cache: cached
    partition: true

tasks:
  - name: echo
    program: main
    budgets: { threads: 1 }
    priority: 5
    ceiling: 5
    serves: /amp/3
    maps: { /shm/share: rw }

  - name: spare4
    program: ampecho_spare
    budgets: { threads: 1 }
    priority: 4
    ceiling: 4
    serves: /amp/4

  - name: mortal
    program: ampecho_mortal
    budgets: { threads: 1 }
    priority: 5
    ceiling: 5
    serves: /amp/7
    maps: { /shm/share: rw }
    restart: { max: 1 }
