# The suite with the packaged xmcuartirq serving stdout.

version: 1
stdout: /svc/console
ends: main
heap: 0

tasks:
  - name: console
    driver: xmcuartirq
    devices: [/dev/usic0/ch0]
    lines: { irq: /dev/usic0/sr0 }
    core: 0
    serves: /svc/console
    priority: 30

  - name: main
    program: main
    priority: 2
    ceiling: 30
    authority: [memory, system, pinmux, irq, console, tasks, bus_master, bootloader]
    # Its budgets and caps are those of the variant's selftest composition (CMakeLists.txt).

  # Started by the arms, never by the init: each runs the role its argv names.
  - name: peer0
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer1
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  - name: peer2
    program: stpeer
    priority: 10
    ceiling: 12
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }

  # On core 0 alone, a task narrower than the machine.
  - name: peer3
    program: stpeer
    priority: 10
    ceiling: 12
    core: 0
    start: on_request
    authority: [memory, tasks, irq]
    budgets: { threads: 4 }
