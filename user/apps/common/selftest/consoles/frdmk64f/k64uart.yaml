# The suite with the packaged k64uart serving stdout.

version: 1
stdout: /svc/console
ends: main
heap: 0

tasks:
  - name: console
    driver: k64uart
    devices: [/dev/uart0]
    accepts: [coarse_gate, device_not_isolated]
    serves: /svc/console
    priority: 30

  - name: main
    entry: selftest_main
    priority: 2
    ceiling: 30
    authority: [memory, system, pinmux, irq, console, tasks, bus_master]
