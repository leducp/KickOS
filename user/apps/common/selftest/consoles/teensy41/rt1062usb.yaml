# The suite with the packaged rt1062usb serving stdout over the board's own USB device.

version: 1
stdout: /svc/console
ends: main
heap: 0

tasks:
  - name: console
    driver: rt1062usb
    devices: [/dev/usb1]
    lines: { irq: /dev/usb1/irq }
    core: 0
    serves: /svc/console
    priority: 30

  - name: main
    entry: selftest_main
    priority: 2
    ceiling: 30
    authority: [memory, system, pinmux, irq, console, tasks]
