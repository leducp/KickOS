# The suite with the packaged rxsci serving stdout.

version: 1
stdout: /svc/console
ends: main
heap: 0

tasks:
  - name: console
    driver: rxsci
    devices: [/dev/sci6]
    lines: { txi: /dev/sci6/txi, rxi: /dev/sci6/rxi }
    core: 0
    serves: /svc/console
    priority: 30

  - name: main
    entry: selftest_main
    priority: 2
    ceiling: 30
    authority: [memory, system, pinmux, irq, console, tasks]
