#
# Irq beside the default's authority, for the lines the bench raises past KICKOS_IRQ_FREE_BASE,
# claimed at run time, and bootloader for the terminal outcome, and the peer program's two tasks,
# which main creates for the cross-task rows.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks, irq, bootloader]
    budgets: { threads: @BENCH_MAIN_THREADS@ }

  # Two tasks over one program, started by main's cross-task rows.
  - name: xa
    program: bench_peer
    priority: 4
    ceiling: 4
    start: on_request
    budgets: { threads: 1 }

  - name: xb
    program: bench_peer
    priority: 4
    ceiling: 4
    start: on_request
    budgets: { threads: 1 }
