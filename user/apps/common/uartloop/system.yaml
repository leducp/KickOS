#
# The packaged simuart over the sim's loopback line, restarted once, and main, its client.

version: 1
stdout: kernel
ends: main

tasks:
  - name: simuart
    driver: simuart
    lines: { irq: /dev/uart/irq }
    core: 0
    serves: /svc/simuart
    priority: 12
    restart: { max: 1 }

  - name: main
    program: uartloop
    priority: 10
    ceiling: 10
    uses: [/svc/simuart]
    authority: [memory, system]
