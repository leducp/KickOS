#
# The rounds as main, and the peer, a program of its own, which main creates once per round.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: taskleave
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks]

  - name: peer
    program: taskleave_peer
    priority: 10
    ceiling: 10
    start: on_request
    budgets: { threads: 2 }
