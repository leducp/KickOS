#
# The packaged simcon serving stdout with one restart, and main, which prints through each of its
# two instances and runs above the first while it serves.

version: 1
stdout: /svc/console
ends: main

tasks:
  - name: simcon
    driver: simcon
    serves: /svc/console
    priority: 12
    restart: { max: 1 }

  - name: main
    program: conrestart
    priority: 2
    ceiling: 13
    uses: [{ path: /svc/console, rights: [write] }]
    watches: [simcon]
    authority: [memory, system, tasks]
