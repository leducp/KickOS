#
# The packaged simcon serving stdout with one restart, and main, which prints through each of its
# two instances.

version: 1
stdout: /svc/console
ends: main

tasks:
  - name: simcon
    driver: simcon
    serves: /svc/console
    priority: 12
    restart: { max: 1 }

  - name: main
    entry: conrestart_main
    priority: 2
    ceiling: 10
    uses: [/svc/console]
    watches: [simcon]
    authority: [memory, system, tasks]
