#
# The default's authority plus bootloader, which the terminal outcome needs, and the peer, a
# program of its own, which the window leg's handoff creates as its waiter.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks, bootloader]
    budgets: { threads: @MUTEXBENCH_THREADS@ }

  - name: peer
    program: mutexbench_peer
    priority: 5
    ceiling: 5
    start: on_request
    budgets: { threads: 1 }
