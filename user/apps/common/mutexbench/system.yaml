# The default's authority, with the threads the load runs.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks]
    budgets: { threads: @MUTEXBENCH_THREADS@ }
