#
# Main holds console and tasks, to publish the console through the sink driver it creates; stdout
# stays the kernel's, which the witness needs.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    program: main
    priority: 2
    ceiling: 12
    authority: [memory, console, tasks]

  # Created by main, whose creator capability its declared console is published through.
  - name: sink
    driver: appsink
    serves: /svc/console
    priority: 12
    start: on_request
