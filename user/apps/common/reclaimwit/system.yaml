# Main holds console and tasks, to publish the console to a driver task of its own; stdout stays
# the kernel's, which the witness needs.

version: 1
stdout: kernel
ends: main

tasks:
  - name: main
    entry: kickos_main
    priority: 2
    ceiling: 12
    authority: [memory, console, tasks]
