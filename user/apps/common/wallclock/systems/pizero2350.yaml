#
# The board's default composition with the packaged rpusb serving stdout, the USB CDC
# console the marks go out through.

version: 1
board: pizero2350
stdout: /svc/console
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: rpusb
    driver: rpusb
    devices: [/dev/usbctrl]
    lines: { irq: /dev/usbctrl/irq }
    core: 0
    serves: /svc/console
    priority: 12

  - name: main
    entry: kickos_main
    stack: 8192
    priority: 2
    ceiling: 2
    authority: [memory, system, tasks]
