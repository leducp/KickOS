# The board's default composition with packaged driver `xmcssc` serving a service.

version: 1
board: xmc4800-relax
stdout: kernel
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: main
    entry: kickos_main
    stack: 4096
    priority: 2
    ceiling: 2
    authority: [memory, system, tasks]

  - name: xmcssc
    driver: xmcssc
    devices: [/dev/usic0/ch1]
    accepts: [coarse_gate] # USIC0 is one gate, and the kernel's console is its channel 0
    lines: { irq: /dev/usic0/sr1 }
    core: 0
    serves: /svc/xmcssc
    priority: 12
