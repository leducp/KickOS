# The board's default composition with packaged driver `testtraps` serving a service.

version: 1
board: qemu-arm64
stdout: kernel
ends: main
heap: 65536

tasks:
  - name: main
    entry: kickos_main
    stack: 20480
    priority: 2
    authority: [memory, system, tasks]

  - name: testtraps
    driver: testtraps
    serves: /svc/testtraps
    priority: 12
