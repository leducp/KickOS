# The board's default composition with packaged driver `testfails` serving a service.

version: 1
board: qemu-riscv
stdout: kernel
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: main
    entry: kickos_main
    stack: 8192
    priority: 2
    authority: [memory, system, tasks]

  - name: testfails
    driver: testfails
    serves: /svc/testfails
    priority: 12
