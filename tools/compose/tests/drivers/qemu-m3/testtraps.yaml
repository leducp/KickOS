# The board's default composition with packaged driver `testtraps` serving a service.

version: 1
board: qemu-m3
stdout: kernel
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: main
    program: main
    stack: 8192
    priority: 2
    ceiling: 31
    authority: [memory, system, tasks]

  - name: testtraps
    driver: testtraps
    serves: /svc/testtraps
    priority: 12
