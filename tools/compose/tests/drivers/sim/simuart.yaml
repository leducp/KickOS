# The board's default composition with packaged driver `simuart` serving a service.

version: 1
board: sim
stdout: kernel
ends: main
heap: 16384

tasks:
  - name: main
    entry: kickos_main
    stack: 65536
    priority: 2
    ceiling: 2
    authority: [memory, system, tasks]

  - name: simuart
    driver: simuart
    lines: { irq: /dev/uart/irq }
    core: 0
    serves: /svc/simuart
    priority: 12
