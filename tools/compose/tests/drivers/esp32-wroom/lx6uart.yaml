# The board's default composition with packaged driver `lx6uart` serving the console.

version: 1
board: esp32-wroom
stdout: /svc/console
ends: main
heap: 16384
accepts: [no_protection, no_privilege_split]

tasks:
  - name: lx6uart
    driver: lx6uart
    devices: [/dev/uart0]
    lines: { uart0: /dev/uart0/uart0 }
    core: 0
    serves: /svc/console
    priority: 12

  - name: main
    entry: kickos_main
    stack: 4096
    priority: 2
    authority: [memory, system, tasks]
