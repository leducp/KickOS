# The board's default composition with packaged driver `f4uartirq` serving the console.

version: 1
board: blackpill
stdout: /svc/console
ends: main
heap: 8192
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: f4uartirq
    driver: f4uartirq
    devices: [/dev/usart2]
    lines: { global: /dev/usart2/global }
    core: 0
    serves: /svc/console
    priority: 12

  - name: main
    entry: kickos_main
    stack: 4096
    priority: 2
    ceiling: 2
    authority: [memory, system, tasks]
