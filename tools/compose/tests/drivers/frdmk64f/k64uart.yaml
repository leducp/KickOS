# The board's default composition with packaged driver `k64uart` serving the console.

version: 1
board: frdmk64f
stdout: /svc/console
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: k64uart
    driver: k64uart
    devices: [/dev/uart0]
    accepts: [coarse_gate, device_not_isolated]
    serves: /svc/console
    priority: 12

  - name: main
    entry: kickos_main
    stack: 8192
    priority: 2
    ceiling: 2
    authority: [memory, system, tasks]
