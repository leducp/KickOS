# The board's default composition with packaged driver `k64uartirq` serving the console.

version: 1
board: frdmk64f
stdout: /svc/console
ends: main
heap: 16384
accepts: [no_protection] # for the -flat build alone

tasks:
  - name: k64uartirq
    driver: k64uartirq
    devices: [/dev/uart0]
    accepts: [coarse_gate, device_not_isolated]
    lines: { rxtx: /dev/uart0/rxtx, err: /dev/uart0/err }
    core: 0
    serves: /svc/console
    priority: 12

  - name: main
    program: main
    stack: 8192
    priority: 2
    ceiling: 2
    authority: [memory, system, tasks]
