#
# The nRF51822's 256 KiB / 32 KiB variant, as QEMU's `microbit` machine models it.

version: 1
chip: nrf51
manual: "QEMU 11.1 `microbit` machine (hw/arm/nrf51_soc.c), nRF51822 QFAC"
arch: armv6m
# The Cortex-M0 has no MPU, and no unprivileged mode: every thread runs privileged.
protection: { unit: none, privilege: false }
data_cache: false

interrupts: { count: 32 }

devices: {}

memory:
  flash: { base: 0x00000000, size: 0x40000, link: { region: FLASH, access: rx } }
  sram: { base: 0x20000000, size: 0x8000, arena: true, link: { region: RAM, access: rwx } }
