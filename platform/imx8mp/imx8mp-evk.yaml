#
# QEMU `imx8mp-evk`. The console is UART1, the one the machine backs (chip_imx8mp.cc).
# Which UART carries the real EVK's debug header no source in the tree states, nor its pads.

version: 1
board: imx8mp-evk
chip: imx8mp

# -m bounds the EVK's 6 GiB DDR window, mapped lazily; the link carves 64 MiB of it.
emulator: { qemu: qemu-system-aarch64, machine: imx8mp-evk, options: [-m, 512M] }

console:
  device: /dev/uart1

# The span of the board's DDR the A53 image is linked into.
memory:
  dram: { base: 0x40000000, size: 0x4000000, cluster: a53, ref: "IMX8MPRM 2.2 Cortex-A53 Memory Map" }
