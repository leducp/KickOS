#
# Values from the tree's chip_imx8mp.cc and the i.MX 8M Plus Reference Manual (IMX8MPRM
# rev 3): the A53 and Cortex-M7 memory maps (ch. 2), the A53 and CM7 interrupt summaries
# (ch. 7). The tree builds no M7 image, so the M7's values are the RM's alone, but for its
# memory type, which arch/arm/common/arch_mpu_nocache_support_default.cc states for PMSAv7.
# The A53's memory type is arch_aspace_memtype_support in arch/arm64/armv8a/aspace_armv8a.cc.

version: 1
chip: imx8mp

# One file, two clusters, each its own architecture, protection unit, interrupt controller
# and kernel image, conversing over an AMP window. A composition is per cluster and names
# which one it composes. The clusters' caches are not coherent with each other, so memory
# both reach is shared uncached or with cache maintenance by its users.
clusters_coherent: false
cores:
  a53:
    arch: armv8a
    count: [1, 4]
    smp: true
    protection: { unit: mmu, page: 0x1000, covers_devices: true, memory_type: true }
    # The RM numbers every interrupt source once, for both clusters. The GIC's shared IDs
    # start at 32, so source n is ID 32 + n here.
    line_offset: 32
  m7:
    arch: armv7m
    count: [1, 1]
    protection: { unit: pmsav7, covers_devices: true, memory_type: true }
    line_offset: 0 # the NVIC takes source n as IRQ n

# The RDC assigns each peripheral and memory region to a domain, one domain per cluster, and
# the bus enforces it whatever either kernel's own unit says. So a device a composition gives
# the M7 is programmed into the RDC as the M7's by the node that owns the RDC, from the
# partition's assignment.
partition_gate: { kind: rdc, device: rdc }

devices:
  uart1: { window: [0x30860000, 0x1000] } # the A53 kernel's console

  # SAI5 and SAI6 raise the SAME source, 90: their eight interrupts are ORed onto one line.
  # Whoever holds the line hears both devices, so one holder takes the line and both.
  sai5: { window: [0x30C50000, 0x1000], lines: { shared: 90 } }
  sai6: { window: [0x30C60000, 0x1000], lines: { shared: 90 } }

  # Bus masters: each moves data to and from memory by physical address, which neither
  # cluster's unit sees.
  sdma1: { window: [0x30BD0000, 0x1000], bus_master: true }
  enet1: { window: [0x30BE0000, 0x1000], bus_master: true }

  # The A53-M7 messaging unit, one side per cluster, each side interrupting its own cluster:
  # a line that exists for one cluster only. The AMP doorbell, so kernel-owned.
  mu1_a: { window: [0x30AA0000, 0x1000], owner: kernel, cluster: a53, lines: { to_a53: 88 } }
  mu1_b: { window: [0x30AB0000, 0x1000], owner: kernel, cluster: m7, lines: { to_m7: 97 } }

  rdc: { window: [0x303D0000, 0x1000], owner: kernel }
  csu: { window: [0x303E0000, 0x1000], owner: kernel } # secure access policy per peripheral
  # The RM gives only the 1 MiB GIC block at 0x38800000; the split is the GIC-500's.
  gicd: { window: [0x38800000, 0x10000], owner: kernel, cluster: a53 }
  # Every A53's frame pair, released or not: a peer's banked state lives in them.
  gicr: { window: [0x38880000, 0x80000], owner: kernel, cluster: a53 }
  # No line: its ID is PPI 30, and a line here is a source number the GIC adds 32 to.
  timer: { owner: kernel, cluster: a53, sysreg: true }

# The same RAM sits at a different address in each cluster's map, so a window names its
# address per cluster.
memory:
  ocram: { size: 0x90000, at: { a53: 0x00900000, m7: 0x20200000 } }
  dtcm: { size: 0x20000, at: { a53: 0x00800000, m7: 0x20000000 }, arena: true }
