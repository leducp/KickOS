# QEMU RV32 `virt`. The kernel console is RISC-V semihosting (chip_virt_rv32.cc).

version: 1
board: qemu-riscv
chip: virt_rv32

emulator: { qemu: qemu-system-riscv32, machine: virt, options: [-bios, none] }

console:
  semihosting: true
