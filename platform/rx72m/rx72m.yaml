# The RX72M CPU Card (RTK0EMXDE0C00000BJ). Values from its user's manual r12uz0098ej0110, the
# console's Table 5-4 (CN6/CN7, the "Renesas Motor Workbench" serial) and LED6's Table 5-9, and
# docs/reference/boards.md.

version: 1
board: rx72m
chip: rx72m

# SCI6 on the Renesas Motor Workbench serial header (board Table 5-4).
console:
  device: /dev/sci6
  pins: { txd: PB1, rxd: PB0 }

leds:
  led6: { pin: P80, active: low } # the CPU Card's user LED (board Table 5-9)
