#
# Values from UM1724 and docs/reference/boards.md. LD2 is PB13 on this Nucleo, where most
# Nucleo-64 boards wire it to PA5 (UM1724).

version: 1
board: f302nucleo
chip: stm32f302

console:
  device: /dev/usart2
  pins: { tx: PA2, rx: PA3 } # the ST-LINK virtual COM port

# LD2 is PB13 on the F302R8, not the PA5 of other Nucleo-64 boards.
leds:
  ld2: { pin: PB13, active: high, owner: kernel } # green, the kernel's diagnostic LED
