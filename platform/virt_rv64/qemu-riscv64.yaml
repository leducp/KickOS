#
# QEMU RV64 `virt`. The console is the ns16550a the kernel drives (chip_virt_rv64.cc).

version: 1
board: qemu-riscv64
chip: virt_rv64

# With no firmware every hart -smp makes enters _start, and the park in startup.S holds all but
# the boot hart.
emulator: { qemu: qemu-system-riscv64, machine: virt, options: [-bios, none] }

console:
  device: /dev/uart0
