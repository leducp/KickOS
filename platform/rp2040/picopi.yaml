# Values from the Raspberry Pi Pico datasheet, docs/reference/boards.md and docs/flashing.md.
# The Pico W's LED hangs off its wireless chip instead, so this file is the Pico's alone.

version: 1
board: picopi
chip: rp2040

console:
  device: /dev/uart0
  pins: { tx: GPIO0, rx: GPIO1 }

leds:
  led: { pin: GPIO25, active: high, owner: kernel } # the kernel's diagnostic LED

# The Pico's QSPI flash, a W25Q16JV.
memory:
  xip_flash:
    base: 0x10000000
    size: 0x200000
    link: { region: FLASH, access: rx }
    ref: "Raspberry Pi Pico Datasheet, p.3-4; XIP base: RP2040 Datasheet 2.2.2 Detail, p.24"
