#
# Values from the ESP32 TRM v5.8; the link regions are those arch/xtensa/chip/esp32/esp32.ld
# places the image in.

version: 1
chip: esp32
manual: "ESP32 Technical Reference Manual, Version 5.8"
arch: lx6
# Every thread runs at the kernel's one privilege level, and the PID-keyed MPU of chapter 4 is
# not driven.
protection: { unit: none, privilege: false }
# The two 32 KiB caches serve external memory alone.
data_cache: false
# The ROM loads the image at its boot offset by the header's flash mode before any code sets
# the SPI pins, and reads a QIO header there unreliably (`load:0xffffffff,len:-1`, then an
# RTC-WDT reset loop).
esptool_image: [--flash-mode, dio]
c: { line_enum: kernel_line }
cores: { count: [1, 2], smp: true }

interrupts: { count: { value: 32, ref: "8.3.2 CPU Interrupt, p.178" } }

devices:
  # A line is the kernel's logical line, not the matrix source the device raises. The console
  # line stays clear of the block an app may inject into, from KICKOS_IRQ_FREE_BASE.
  uart0:
    window: [0x3FF40000, 0x1000]
    ref: "Table 3.3-6 Peripheral Address Mapping, p.72"
    lines: { uart0: { number: 30, symbol: CONSOLE_TX_LINE } }
  # The window also holds every pad's GPIO matrix routing and the kernel's LED pin, GPIO2.
  gpio: { window: [0x3FF44000, 0x1000], ref: "Table 3.3-6 Peripheral Address Mapping, p.72" }

  dport: { window: [0x3FF00000, 0x1000], owner: kernel, ref: "Table 3.3-6 Peripheral Address Mapping, p.72" }
  rtc_cntl: { window: [0x3FF48000, 0x1000], owner: kernel, ref: "Table 3.3-6 Peripheral Address Mapping, p.72" }
  # Pad functions, set through kos_pinmux_set only.
  io_mux: { window: [0x3FF49000, 0x1000], owner: kernel, ref: "Table 3.3-6 Peripheral Address Mapping, p.72" }
  # TIMG0 T0 is the monotonic clock, and both groups' watchdogs are disabled at boot.
  timg0: { window: [0x3FF5F000, 0x1000], owner: kernel, ref: "Table 3.3-6 Peripheral Address Mapping, p.73" }
  timg1: { window: [0x3FF60000, 0x1000], owner: kernel, ref: "Table 3.3-6 Peripheral Address Mapping, p.73" }
  # The BBPLL's analog gate. Undocumented: it is the AHB alias of 0x3FF4E000, which the table
  # marks Reserved, and it is not SYSCON, which sits at 0x3FF66000.
  analog:
    window: [0x6000E000, 0x1000]
    owner: kernel
    symbol: SYSCON_BASE
    ref: "Table 3.3-6 Peripheral Address Mapping and its Notice, p.72-73"

memory:
  iram:
    base: 0x40080000
    size: 0x20000
    link: { region: IRAM, access: rx }
    ref: "Table 3.3-2 Embedded Memory Address Mapping, p.68"
  dram:
    base: 0x3FFB0000
    size: 0x30000
    arena: true
    link: { region: DRAM, access: rw }
    ref: "Table 3.3-2 Embedded Memory Address Mapping, p.68"

# Pins are GPIOn. A selector other than `gpio` is the IO MUX function its MCU_SEL selects.
pins:
  GPIO1: { f0: uart0.tx, gpio: gpio.1 }
  GPIO2: { gpio: gpio.2 }
  GPIO3: { f0: uart0.rx, gpio: gpio.3 }
  GPIO6: { gpio: gpio.6 }
  GPIO7: { gpio: gpio.7 }
  GPIO8: { gpio: gpio.8 }
  GPIO9: { gpio: gpio.9 }
  GPIO10: { gpio: gpio.10 }
  GPIO11: { gpio: gpio.11 }
