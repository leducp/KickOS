# An ESP32-WROOM-32 DevKit. Values from docs/reference/boards.md.

version: 1
board: esp32-wroom
chip: esp32

# UART0 through the board's CH340 bridge.
console:
  device: /dev/uart0
  pins: { tx: GPIO1, rx: GPIO3 }

leds:
  d2: { pin: GPIO2, active: high, owner: kernel } # the DevKit v1 / NodeMCU-32S blue LED; the kernel's diagnostic LED

reserved_pins:
  GPIO6: flash
  GPIO7: flash
  GPIO8: flash
  GPIO9: flash
  GPIO10: flash
  GPIO11: flash
