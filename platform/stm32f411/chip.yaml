#
# Values from RM0383, the f411spi app, and arch_mpu_nocache_support in
# arch/arm/common/arch_mpu_nocache_support_default.cc.

version: 1
chip: stm32f411
manual: "RM0383 STM32F411xC/E Reference Manual, Rev 4 (May 2025)"
arch: armv7m
protection: { unit: pmsav7, covers_devices: true, memory_type: true }
data_cache: false

interrupts: { count: { value: 86, ref: "Table 37 Vector table, p.205" } }

devices:
  # Windows are the minimal PMSAv7 cover of the registers a driver uses, not the device's
  # whole 1 KiB bus slot.
  usart2:
    window: [0x40004400, 0x20]
    ref: "Table 1, p.39"
    lines: { global: { number: 38, symbol: USART2_IRQ, ref: "Table 37 Vector table, p.204" } }
  spi1: { window: [0x40013000, 0x20], lines: { global: 35 }, ref: "Table 1, p.39" }

  tim2:
    window: [0x40000000, 0x400]
    owner: kernel
    ref: "Table 1, p.39"
    lines: { global: { number: 28, symbol: TIM2_IRQ, ref: "Table 37 Vector table, p.204" } }
  rcc: { window: [0x40023800, 0x400], owner: kernel, ref: "Table 1, p.38" }
  # Every GPIO port. A pin is muxed through kos_pinmux_set, never through a granted window.
  gpio: { window: [0x40020000, 0x400], count: 5, stride: 0x400, owner: kernel, symbol: GPIOA_BASE, ref: "Table 1, p.38" }
  gpioh: { window: [0x40021C00, 0x400], owner: kernel, ref: "Table 1, p.38" } # F and G are not on this part
  # The flash interface: the wait states the kernel sets with the clock.
  flash: { window: [0x40023C00, 0x400], owner: kernel, ref: "Table 1, p.38" }

memory:
  main_flash: { base: 0x08000000, size: 0x80000, link: { region: FLASH, access: rx }, ref: "Table 4, p.44" }
  sram: { base: 0x20000000, size: 0x20000, arena: true, link: { region: RAM, access: rwx }, ref: "2.3.1, p.40" }

# Pins are PORT PIN. A selector other than `gpio` is the alternate-function number the pin's AFR
# selects.
pins:
  PA2: { af7: usart2.tx, gpio: gpio.0.2 }
  PA3: { af7: usart2.rx, gpio: gpio.0.3 }
  PA5: { af5: spi1.sck, gpio: gpio.0.5 }
  PA6: { af5: spi1.miso, gpio: gpio.0.6 }
  PA7: { af5: spi1.mosi, gpio: gpio.0.7 }
  PC13: { gpio: gpio.2.13 }
  PD12: { gpio: gpio.3.12 }
  PE3: { gpio: gpio.4.3 }
