# Values from docs/flashing.md. The crystal, which this file has no field for, is in
# boards/blackpill/include/kickos/board_wiring.h.

version: 1
board: blackpill
chip: stm32f411

console:
  device: /dev/usart2
  pins: { tx: PA2, rx: PA3 }

leds:
  led: { pin: PC13, active: low, owner: kernel } # the kernel's diagnostic LED
