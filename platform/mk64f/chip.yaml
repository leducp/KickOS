#
# Values from the K64 Sub-Family Reference Manual (K64P144M120SF5RM), the memory type and the
# data cache from arch_mpu_nocache_support in chip_mk64f.cc.

version: 1
chip: mk64f
manual: "K64P144M120SF5RM, K64 Sub-Family Reference Manual, Rev. 5 (01/2021)"
arch: armv7m

# The SYSMPU sits on the bus-slave side and never sees the peripheral bridge, so it isolates
# memory per thread and devices not at all. Devices are gated by the AIPS bridge instead: per
# 4 KiB slot, per privilege, and once a slot is opened every unprivileged thread reaches it.
# So a device grant here is a statement, not an enforcement, and admission must say so.
protection:
  unit: sysmpu
  covers_devices: false
  memory_type: false
  # The two bridges' slots. GPIO at 0x400FF000 is a crossbar slave behind neither.
  device_gate:
    kind: aips_slot
    size: 0x1000
    per_thread: false
    ranges: [[0x40000000, 0x80000], [0x40080000, 0x7F000]]

data_cache: false

interrupts: { count: 86, ref: "Table 3-5 Interrupt vector assignments, p.76" }

devices:
  # Windows are what a driver uses; the gate the kernel opens is the whole slot around it.
  uart0:
    window: [0x4006A000, 0x20]
    ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.178"
    lines:
      rxtx: { number: 31, symbol: UART0_RXTX_IRQ, ref: "Table 3-5 Interrupt vector assignments, p.74" }
      err: { number: 32, symbol: UART0_ERR_IRQ, ref: "Table 3-5 Interrupt vector assignments, p.74" }
  uart1: { window: [0x4006B000, 0x20], ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.178" }
  uart2: { window: [0x4006C000, 0x20], ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.178" }
  uart3: { window: [0x4006D000, 0x20], ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.178" }
  uart4: { window: [0x400EA000, 0x20], ref: "Table 4-3 Peripheral bridge 1 slot assignments, p.181" }
  dspi0: { window: [0x4002C000, 0x40], ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.176" } # its service polls, so no line is taken
  # A crossbar slave behind no AIPS slot: every unprivileged thread reaches it ungranted.
  gpio: { window: [0x400FF000, 0x40], count: 5, stride: 0x40, symbol: GPIOA_BASE, ref: "GPIO memory map, p.1799" } # A to E

  # MCR and channels 0 and 1. Channels 2 and 3 above them share the slot but not the owner.
  pit: { window: [0x40037000, 0x120], owner: kernel, ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.176" }
  sysmpu: { window: [0x4000D000, 0x1000], owner: kernel, ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.175" }
  aips0: { window: [0x40000000, 0x1000], owner: kernel, ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.175" } # the slot gates themselves
  aips1: { window: [0x40080000, 0x1000], owner: kernel, ref: "Table 4-3 Peripheral bridge 1 slot assignments, p.178" }
  mcg: { window: [0x40064000, 0x1000], owner: kernel, ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.177" }
  osc0: { window: [0x40065000, 0x1000], owner: kernel, ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.177" }
  # Disabled at boot, then grantable.
  wdog: { window: [0x40052000, 0x1000], ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.177" }
  # Clock gates and pin mux: reached through kos_periph_enable and kos_pinmux_set only. SOPT1
  # sits in the slot below the rest.
  sim:
    window: [0x40047000, 0x2000]
    owner: kernel
    symbol: SIM_SOPT1_BASE
    ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.177"
    blocks: { main: { offset: 0x1000, symbol: SIM_BASE, ref: "SIM memory map, p.300" } }
  port: { window: [0x40049000, 0x1000], count: 5, stride: 0x1000, owner: kernel, symbol: PORTA_BASE, ref: "Table 4-2 Peripheral bridge 0 slot assignments, p.177" } # A to E

memory:
  # SRAM_L below 0x20000000 and SRAM_U above: a misaligned access across the seam is not
  # supported.
  flash: { base: 0x00000000, size: 0x100000, link: { region: FLASH, access: rx }, ref: "3.5.1.2 Flash Memory Sizes, p.103" }
  sram: { base: 0x1FFF0000, size: 0x40000, arena: true, link: { region: RAM, access: rwx }, ref: "3.5.3.1 SRAM sizes, p.107" }

# Pins are PTxN. A selector other than `gpio` is the ALT number the pin's PCR selects.
pins:
  PTB16: { alt3: uart0.rx, gpio: gpio.1.16 }
  PTB17: { alt3: uart0.tx, gpio: gpio.1.17 }
  PTB21: { gpio: gpio.1.21 }
  PTB22: { gpio: gpio.1.22 }
  PTC4: { gpio: gpio.2.4 }
  PTD1: { alt2: dspi0.sck, gpio: gpio.3.1 }
  PTD2: { alt2: dspi0.sout, gpio: gpio.3.2 }
  PTD3: { alt2: dspi0.sin, gpio: gpio.3.3 }
