#
# The restart witness on QEMU `virt` with four A53 cores: examples/composition/systems/qemu-arm64.yaml
# with the test sensor as `sensor`'s entry and two restarts.

version: 1
board: qemu-arm64

stdout: kernel

ends: never
heap: 65536

shared:
  - name: /shm/history
    size: 64
    cache: cached

tasks:
  - name: sensor
    entry: restart_sensor_main
    stack: 4096
    priority: 9
    ceiling: 9
    core: 1
    devices: [/dev/rtc]
    serves: /svc/sensor
    maps: { /shm/history: rw }
    restart: { max: 2 }

  - name: app
    entry: app_main
    stack: 8192
    priority: 8
    ceiling: 8
    core: 2
    uses: [/svc/sensor]

  - name: health
    entry: health_main
    stack: 4096
    priority: 10
    ceiling: 10
    watches: [sensor]
    maps: { /shm/history: ro }
