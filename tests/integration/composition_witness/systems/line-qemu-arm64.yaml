#
# The line taker on QEMU `virt` with four A53 cores: a user task holding the PL031's window and
# its alarm line on core 1. Its end ends the system.

version: 1
board: qemu-arm64

stdout: kernel

ends: alarm
heap: 65536

tasks:
  - name: alarm
    entry: alarm_main
    stack: 8192
    priority: 9
    ceiling: 9
    core: 1
    devices: [/dev/rtc]
    lines: { alarm: /dev/rtc/alarm }
