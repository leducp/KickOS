#
# The init's priority on QEMU RV32 `virt`, one core: the init at 5 between a task at 6 and one
# at 4, each watching a pulse at 7 that ends twice. The task at 4 ends the system.

version: 1
board: qemu-riscv

stdout: kernel

ends: low
heap: 16384
init: { priority: 5 }

tasks:
  - name: pulse
    program: priority_pulse
    stack: 2048
    priority: 7
    ceiling: 7
    restart: { max: 1 }

  - name: high
    program: priority_high
    stack: 4096
    priority: 6
    ceiling: 6
    watches: [pulse]

  - name: low
    program: main
    stack: 4096
    priority: 4
    ceiling: 4
    watches: [pulse]
