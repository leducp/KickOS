#
# The restart witness on the XMC4800 Relax Kit: examples/composition/systems/xmc4800-relax.yaml
# with the test sensor as `sensor`'s entry and two restarts.

version: 1
board: xmc4800-relax

stdout: /svc/console

ends: never
heap: 16384

shared:
  - name: /shm/history
    size: 64
    cache: cached

tasks:
  - name: console
    driver: xmcuartirq
    devices: [/dev/usic0/ch0]
    lines: { irq: /dev/usic0/sr0 }
    serves: /svc/console
    priority: 12

  - name: spi0
    driver: xmcssc
    devices: [/dev/usic0/ch1]
    lines: { irq: /dev/usic0/sr1 }
    serves: /svc/spi0
    priority: 11
    restart: { max: 3 }

  - name: sensor
    entry: restart_sensor_main
    stack: 2048
    priority: 9
    ceiling: 9
    serves: /svc/sensor
    maps: { /shm/history: rw }
    restart: { max: 2 }

  - name: app
    entry: app_main
    stack: 4096
    priority: 8
    ceiling: 8
    uses: [/svc/sensor]

  - name: health
    entry: health_main
    stack: 2048
    priority: 10
    ceiling: 10
    watches: [spi0, sensor]
    maps: { /shm/history: ro }
