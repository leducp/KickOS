#
# fails and watcher share core 1, where testfails' START takes the init's thread before it fails.
# The clients of exits and traps share it below the watcher, which reads each death in time.

version: 1
board: qemu-arm64
stdout: kernel
ends: never
heap: 65536

tasks:
  - name: exits
    driver: testexits
    serves: /svc/exits
    priority: 10
    restart: { max: 1 }

  - name: traps
    driver: testtraps
    serves: /svc/traps
    priority: 10
    restart: { max: 1 }

  - name: fails
    driver: testfails
    serves: /svc/fails
    priority: 10
    core: 1
    restart: { max: 1 }

  - name: exits_client
    entry: exits_client_main
    stack: 12288
    priority: 8
    ceiling: 8
    core: 1
    uses: [/svc/exits]

  - name: traps_client
    entry: traps_client_main
    stack: 12288
    priority: 8
    ceiling: 8
    core: 1
    uses: [/svc/traps]

  - name: fails_client
    entry: fails_client_main
    stack: 12288
    priority: 8
    ceiling: 8
    uses: [/svc/fails]

  - name: watcher
    entry: watcher_main
    stack: 12288
    priority: 9
    ceiling: 9
    core: 1
    watches: [exits, traps, fails, fails_client]
