#
# The packaged-driver line witness on QEMU `virt` with four A53 cores: testline's line 0 bound to
# the PCIe bridge's third legacy interrupt, index 2 of its device, and its line 1 to the PL061's,
# neither the number nor the index its descriptor states. The client's end ends the system.

version: 1
board: qemu-arm64
stdout: kernel
ends: client
heap: 65536

tasks:
  - name: line
    driver: testline
    lines: { routed: /dev/pcie/intc, held: /dev/gpio/global }
    serves: /svc/line
    priority: 10
    core: 1

  - name: client
    entry: line_client_main
    stack: 12288
    priority: 8
    uses: [/svc/line]
