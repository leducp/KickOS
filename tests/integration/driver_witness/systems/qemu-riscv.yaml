version: 1
board: qemu-riscv
stdout: kernel
ends: never
heap: 16384

tasks:
  - name: exits
    driver: testexits
    serves: /svc/exits
    priority: 10
    restart: { max: 1 }

  - name: traps
    driver: testtraps
    serves: /svc/traps
    priority: 10
    restart: { max: 1 }

  - name: fails
    driver: testfails
    serves: /svc/fails
    priority: 10
    restart: { max: 1 }

  - name: exits_client
    entry: exits_client_main
    stack: 4096
    priority: 8
    uses: [/svc/exits]

  - name: traps_client
    entry: traps_client_main
    stack: 4096
    priority: 8
    uses: [/svc/traps]

  - name: fails_client
    entry: fails_client_main
    stack: 4096
    priority: 8
    uses: [/svc/fails]

  - name: watcher
    entry: watcher_main
    stack: 4096
    priority: 9
    watches: [exits, traps, fails, fails_client]
