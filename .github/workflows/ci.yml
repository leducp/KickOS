  # Boot PE32+ through OVMF, linked by the KickOS toolchain's x86_64-elf ld under i386pep.
  # Require firmware and mtools so image tests cannot silently skip.
  qemu-x86_64:
    needs: toolchain-x86_64-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++ qemu-system-x86 ovmf mtools
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: x86_64-elf
      - name: The OVMF firmware pair
        run: tests/ci/resolve_ovmf.sh >> "$GITHUB_ENV"
      - name: x86_64 (q35) UEFI handover gate
        run: |
          command -v qemu-system-x86_64 >/dev/null 2>&1 \
            || { echo "qemu-system-x86_64 is absent: every image gate below would SKIP and ctest would still exit 0"; exit 1; }
          # Report whether this linker needs -b elf64-x86-64 to extract ELF archive
          # members under i386pep. Both outcomes are supported; the real link tests the flag.
          tc=$(sed -n 's/^set(KICKOS_TOOLCHAIN_BIN_x86_64-elf "\(.*\)")$/\1/p' "$KICKOS_TOOLCHAIN/kickos-toolchain.cmake")
          "$tc/x86_64-elf-ld" --version | head -1
          probe=$(mktemp -d)
          printf 'int kickos_probe_member(void){return 0;}\n' > "$probe/m.c"
          printf 'extern int kickos_probe_member(void);\nint efi_main(void){return kickos_probe_member();}\n' > "$probe/r.c"
          "$tc/x86_64-elf-gcc" -c -ffreestanding -fno-pic -fno-ident "$probe/m.c" -o "$probe/m.o"
          "$tc/x86_64-elf-gcc" -c -ffreestanding -fno-pic -fno-ident "$probe/r.c" -o "$probe/r.o"
          "$tc/x86_64-elf-ar" rcs "$probe/libm.a" "$probe/m.o"
          if "$tc/x86_64-elf-ld" -m i386pep -e efi_main "$probe/r.o" "$probe/libm.a" -o "$probe/bare.efi" 2>/dev/null; then
            echo "this ld extracts an ELF archive member under i386pep with no -b: the flag is INERT here"
          else
            echo "this ld extracts no ELF archive member under i386pep with no -b: the flag is LOAD-BEARING here"
          fi
          rm -rf "$probe"
          cmake --preset qemu-x86_64
          cmake --build --preset qemu-x86_64
          out=$(ctest --preset qemu-x86_64 -LE tree --no-tests=error --output-on-failure 2>&1) \
            || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # No test in this single-core selection is expected to skip.
          case "$out" in
            *Skipped*) echo "a gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          # Require the architecture-specific boot checks.
          tests/ci/ctest_named.sh 'x86_64_no_vector|x86_64_entry_cld|x86_64_weak_undef_selftest' \
            --preset qemu-x86_64 --no-tests=error --output-on-failure
          # Require the default system's gates.
          out=$(tests/ci/ctest_named.sh '^qemu_x86_64_sysdefault$|qemu_x86_64_sysdefault_spin|qemu_x86_64_sysdefault_fault|qemu_x86_64_sysdefault_no_eh_runtime|qemu_x86_64_sysdefault_no_driver_path|^qemu_x86_64_cxxterm$|qemu_x86_64_cxxterm_eh_control|qemu_x86_64_system_link_none|qemu_x86_64_system_link_two|qemu_x86_64_system_link_entry|qemu_x86_64_system_link_refused|qemu_x86_64_system_link_notool|qemu_x86_64_system_link_nocc|qemu_x86_64_system_link_rerun|qemu_x86_64_system_link_noheap' \
            --preset qemu-x86_64 --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a default system gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          # Reuse this step's firmware paths. Override the shorter job timeout
          # with the benchmark gates' 240-second limit, at configure as at run.
          QEMU_TIMEOUT=240 cmake --preset qemu-x86_64-bench
          cmake --build --preset qemu-x86_64-bench
          # Run deterministic benchmark checks for counts, counter progress,
          # accumulator behavior, and parser controls. Measure IRQ latency manually
          # at rebaseline; shared-runner load makes it unsuitable for this gate.
          out=$(QEMU_TIMEOUT=240 tests/ci/ctest_named.sh 'x86_64_bench_lock|x86_64_bench_cyccnt|x86_64_bench_phase_table|x86_64_bench_saturate|x86_64_bench_irqspan_controls' \
            --test-dir build/qemu-x86_64-bench --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # Reject skipped image tests, including missing firmware or mtools.
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      - name: x86_64 (q35) two cores
        run: |
          cmake --preset qemu-x86_64-smp2
          cmake --build build/qemu-x86_64-smp2
          ctest --test-dir build/qemu-x86_64-smp2 -LE tree --no-tests=error --output-on-failure
          # Require the golden system, the default system's and the out-of-tree app's gates.
          out=$(tests/ci/ctest_named.sh 'qemu_x86_64_golden_system|qemu_x86_64_restart_witness|^qemu_x86_64_sysdefault$|qemu_x86_64_sysdefault_spin|qemu_x86_64_sysdefault_fault|qemu_x86_64_oot_mcu_app|qemu_x86_64_system_link_none|qemu_x86_64_system_link_two|qemu_x86_64_system_link_entry|qemu_x86_64_system_link_refused|qemu_x86_64_system_link_notool|qemu_x86_64_system_link_nocc|qemu_x86_64_system_link_rerun|qemu_x86_64_system_link_noheap' \
            --test-dir build/qemu-x86_64-smp2 --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a required two-core gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      - name: x86_64 (q35) four, eight and twelve cores, built with their host gates
        run: |
          for p in qemu-x86_64-smp4 qemu-x86_64-smp8 qemu-x86_64-smp12; do
            cmake --preset "$p"
            cmake --build --preset "$p"
            ctest --test-dir "build/$p" -L host -LE tree --no-tests=error --output-on-failure
          done

  # Root on core 1: an application processor enters it as its first thread, and errnoprobe's
  # arm F reads libc there before any switch.
  qemu-x86_64-ap:
    needs: toolchain-x86_64-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++ qemu-system-x86 ovmf mtools
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: x86_64-elf
      - name: The OVMF firmware pair
        run: tests/ci/resolve_ovmf.sh >> "$GITHUB_ENV"
      - name: x86_64 (q35) first thread on an application processor
        run: |
          qemu-system-x86_64 --version | head -1
          cmake --preset qemu-x86_64-smp2root1
          cmake --build --preset qemu-x86_64-smp2root1
          out=$(tests/ci/ctest_named.sh 'qemu_x86_64_errnoprobe' \
            --test-dir build/qemu-x86_64-smp2root1 --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "the AP first-thread gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Build LX6 application and selftest images. Run host checks for the
  # configuration, linker script and windowed ABI.
  xtensa:
    needs: toolchain-xtensa-esp32-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: xtensa-esp32-elf
      - name: xtensa lx6 (esp32-wroom) build gate
        run: |
          cmake --preset esp32-wroom
          cmake --build --preset esp32-wroom
          ctest --test-dir build/esp32-wroom -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'esp32_wroom_system_link_none|esp32_wroom_system_link_two|esp32_wroom_system_link_entry|esp32_wroom_system_link_refused|esp32_wroom_system_link_notool|esp32_wroom_system_link_nocc|esp32_wroom_system_link_rerun|esp32_wroom_system_link_noheap' --test-dir build/esp32-wroom --no-tests=error --output-on-failure
      - name: xtensa lx6 + selftest config
        run: |
          cmake --preset esp32-wroom-st
          cmake --build --preset esp32-wroom-st
          ctest --test-dir build/esp32-wroom-st -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'esp32_wroom_system_link_none|esp32_wroom_system_link_two|esp32_wroom_system_link_entry|esp32_wroom_system_link_refused|esp32_wroom_system_link_notool|esp32_wroom_system_link_nocc|esp32_wroom_system_link_rerun|esp32_wroom_system_link_noheap' --test-dir build/esp32-wroom-st --no-tests=error --output-on-failure
      - name: xtensa lx6 on both cores
        run: |
          cmake --preset esp32-wroom-smp
          cmake --build --preset esp32-wroom-smp
          ctest --test-dir build/esp32-wroom-smp -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'esp32_wroom_system_link_none|esp32_wroom_system_link_two|esp32_wroom_system_link_entry|esp32_wroom_system_link_refused|esp32_wroom_system_link_notool|esp32_wroom_system_link_nocc|esp32_wroom_system_link_rerun|esp32_wroom_system_link_noheap' --test-dir build/esp32-wroom-smp --no-tests=error --output-on-failure
      - name: xtensa lx6 + bench config
        run: |
          cmake --preset esp32-wroom-bench
          cmake --build --preset esp32-wroom-bench
          ctest --test-dir build/esp32-wroom-bench -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'esp32_wroom_system_link_none|esp32_wroom_system_link_two|esp32_wroom_system_link_entry|esp32_wroom_system_link_refused|esp32_wroom_system_link_notool|esp32_wroom_system_link_nocc|esp32_wroom_system_link_rerun|esp32_wroom_system_link_noheap' --test-dir build/esp32-wroom-bench --no-tests=error --output-on-failure
          cmake --preset esp32-wroom-benchsmp
          cmake --build --preset esp32-wroom-benchsmp
          ctest --test-dir build/esp32-wroom-benchsmp -L host -LE tree --no-tests=error --output-on-failure

  # Build RX72M images and run host checks for each configuration. No emulator models the part.
  rx:
    needs: toolchain-rx-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [rx72m, rx72m-st, rx72m-flat, rx72m-bench]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: rx-elf
      - name: ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --test-dir "build/$PRESET" -L host -LE tree --no-tests=error --output-on-failure
          names='rx72m_system_link_none|rx72m_system_link_two|rx72m_system_link_entry|rx72m_system_link_refused|rx72m_system_link_notool|rx72m_system_link_nocc|rx72m_system_link_rerun|rx72m_system_link_noheap'
          # The heap arm is an enforcing build's.
          if [ "$PRESET" != rx72m-flat ]; then
            names="$names|rx72m_system_link_heap"
          fi
          tests/ci/ctest_named.sh "$names" --test-dir "build/$PRESET" --no-tests=error --output-on-failure

  # Build remaining ARM boards and run host checks for each configuration.
  build-boards:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f-flat, f411disco-flat, blackpill-flat, bluepill-c8, picopi-flat,
                 f302nucleo, due, xmc4800-relax-flat, qemu-telem, teensy41-flat,
                 pizero2350-flat]
        # Build selftest variants in the same jobs. Enforcing boards are handled
        # in build-boards-mpu; qemu-telem has no selftest variant.
        include:
          - preset: bluepill-c8
            st: bluepill-c8-st
          - preset: f302nucleo
            st: f302nucleo-st
          - preset: due
            st: due-st
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          # qemu-telem needs the emulator for its image tests.
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      # Run host checks here; qemu-telem image tests are selected separately below. Require the
      # system link gates of each preset built.
      - name: host checks
        run: |
          # The system link gates <preset> registers: its default composition's refusals.
          links() { # <preset>
            case "$1" in
              frdmk64f-flat) printf '%s' 'frdmk64f_system_link_none|frdmk64f_system_link_two|frdmk64f_system_link_entry|frdmk64f_system_link_refused|frdmk64f_system_link_notool|frdmk64f_system_link_nocc|frdmk64f_system_link_rerun|frdmk64f_system_link_noheap' ;;
              f411disco-flat) printf '%s' 'f411disco_system_link_none|f411disco_system_link_two|f411disco_system_link_entry|f411disco_system_link_refused|f411disco_system_link_notool|f411disco_system_link_nocc|f411disco_system_link_rerun|f411disco_system_link_noheap' ;;
              xmc4800-relax-flat) printf '%s' 'xmc4800_relax_system_link_none|xmc4800_relax_system_link_two|xmc4800_relax_system_link_entry|xmc4800_relax_system_link_refused|xmc4800_relax_system_link_notool|xmc4800_relax_system_link_nocc|xmc4800_relax_system_link_rerun|xmc4800_relax_system_link_noheap' ;;
              qemu-telem) printf '%s' 'qemu_system_link_none|qemu_system_link_two|qemu_system_link_entry|qemu_system_link_refused|qemu_system_link_notool|qemu_system_link_nocc|qemu_system_link_rerun|qemu_system_link_noheap' ;;
              blackpill-flat) printf '%s' 'blackpill_system_link_none|blackpill_system_link_two|blackpill_system_link_entry|blackpill_system_link_refused|blackpill_system_link_notool|blackpill_system_link_nocc|blackpill_system_link_rerun|blackpill_system_link_noheap' ;;
              bluepill-c8|bluepill-c8-st) printf '%s' 'bluepill_c8_system_link_none|bluepill_c8_system_link_two|bluepill_c8_system_link_entry|bluepill_c8_system_link_refused|bluepill_c8_system_link_notool|bluepill_c8_system_link_nocc|bluepill_c8_system_link_rerun|bluepill_c8_system_link_noheap' ;;
              picopi-flat) printf '%s' 'picopi_system_link_none|picopi_system_link_two|picopi_system_link_entry|picopi_system_link_refused|picopi_system_link_notool|picopi_system_link_nocc|picopi_system_link_rerun|picopi_system_link_noheap' ;;
              f302nucleo|f302nucleo-st) printf '%s' 'f302nucleo_system_link_none|f302nucleo_system_link_two|f302nucleo_system_link_entry|f302nucleo_system_link_refused|f302nucleo_system_link_notool|f302nucleo_system_link_nocc|f302nucleo_system_link_rerun|f302nucleo_system_link_noheap' ;;
              due|due-st) printf '%s' 'due_system_link_none|due_system_link_two|due_system_link_entry|due_system_link_refused|due_system_link_notool|due_system_link_nocc|due_system_link_rerun|due_system_link_noheap' ;;
              teensy41-flat) printf '%s' 'teensy41_system_link_none|teensy41_system_link_two|teensy41_system_link_entry|teensy41_system_link_refused|teensy41_system_link_notool|teensy41_system_link_nocc|teensy41_system_link_rerun|teensy41_system_link_noheap' ;;
              pizero2350-flat) printf '%s' 'pizero2350_system_link_none|pizero2350_system_link_two|pizero2350_system_link_entry|pizero2350_system_link_refused|pizero2350_system_link_notool|pizero2350_system_link_nocc|pizero2350_system_link_rerun|pizero2350_system_link_noheap' ;;
              *) echo "no system link gates are listed for $1" >&2; return 1 ;;
            esac
          }
          ctest --test-dir build/${{ matrix.preset }} -L host -LE tree --no-tests=error --output-on-failure
          names=$(links ${{ matrix.preset }})
          tests/ci/ctest_named.sh "$names" --test-dir build/${{ matrix.preset }} --no-tests=error --output-on-failure
          # The larger selftest images also check flash capacity.
          if [ -n "${{ matrix.st }}" ]; then
            cmake --preset ${{ matrix.st }}
            cmake --build --preset ${{ matrix.st }}
            ctest --test-dir build/${{ matrix.st }} -L host -LE tree --no-tests=error --output-on-failure
            names=$(links ${{ matrix.st }})
            tests/ci/ctest_named.sh "$names" --test-dir build/${{ matrix.st }} --no-tests=error --output-on-failure
          fi
      # Run telemetry containment and PendSV-tail trace checks under QEMU.
      - if: matrix.preset == 'qemu-telem'
        name: telemetry image arms (-L host selects them away)
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: the arms below would SKIP and ctest would still exit 0"; exit 1; }
          out=$(tests/ci/ctest_named.sh 'telemetry_qemu_contained|telemetry_qemu_structural' \
            --test-dir build/qemu-telem --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a telemetry arm SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Build enforcing ARM variants to check app sections, grant symbols,
  # archive selectors, and arch_reserved_blocks.
  build-boards-mpu:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, pizero2350, teensy41,
                 xmc4800-relax, picopi]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      # Require the system link gates of each preset built; on xmc4800-relax also the golden
      # system and the restart witness linked against the package of a board no emulator runs,
      # and a default package that carries no test driver. Each board's larger selftest image is
      # built with the same memory protection layout.
      - name: checks
        run: |
          # The system link gates <preset> registers: its default composition's refusals.
          links() { # <preset>
            case "$1" in
              frdmk64f|frdmk64f-st) printf '%s' 'frdmk64f_system_link_none|frdmk64f_system_link_two|frdmk64f_system_link_entry|frdmk64f_system_link_refused|frdmk64f_system_link_notool|frdmk64f_system_link_nocc|frdmk64f_system_link_rerun|frdmk64f_system_link_noheap|frdmk64f_system_link_heap' ;;
              f411disco|f411disco-st) printf '%s' 'f411disco_system_link_none|f411disco_system_link_two|f411disco_system_link_entry|f411disco_system_link_refused|f411disco_system_link_notool|f411disco_system_link_nocc|f411disco_system_link_rerun|f411disco_system_link_noheap|f411disco_system_link_heap' ;;
              xmc4800-relax|xmc4800-relax-st) printf '%s' 'xmc4800_relax_system_link_none|xmc4800_relax_system_link_two|xmc4800_relax_system_link_entry|xmc4800_relax_system_link_refused|xmc4800_relax_system_link_notool|xmc4800_relax_system_link_nocc|xmc4800_relax_system_link_rerun|xmc4800_relax_system_link_noheap|xmc4800_relax_system_link_heap' ;;
              blackpill|blackpill-st) printf '%s' 'blackpill_system_link_none|blackpill_system_link_two|blackpill_system_link_entry|blackpill_system_link_refused|blackpill_system_link_notool|blackpill_system_link_nocc|blackpill_system_link_rerun|blackpill_system_link_noheap|blackpill_system_link_heap' ;;
              pizero2350|pizero2350-st) printf '%s' 'pizero2350_system_link_none|pizero2350_system_link_two|pizero2350_system_link_entry|pizero2350_system_link_refused|pizero2350_system_link_notool|pizero2350_system_link_nocc|pizero2350_system_link_rerun|pizero2350_system_link_noheap|pizero2350_system_link_heap' ;;
              teensy41|teensy41-st) printf '%s' 'teensy41_system_link_none|teensy41_system_link_two|teensy41_system_link_entry|teensy41_system_link_refused|teensy41_system_link_notool|teensy41_system_link_nocc|teensy41_system_link_rerun|teensy41_system_link_noheap|teensy41_system_link_heap' ;;
              picopi|picopi-st) printf '%s' 'picopi_system_link_none|picopi_system_link_two|picopi_system_link_entry|picopi_system_link_refused|picopi_system_link_notool|picopi_system_link_nocc|picopi_system_link_rerun|picopi_system_link_noheap|picopi_system_link_heap' ;;
              *) echo "no system link gates are listed for $1" >&2; return 1 ;;
            esac
          }
          ctest --test-dir build/${{ matrix.preset }} -LE tree --no-tests=error --output-on-failure
          names=$(links ${{ matrix.preset }})
          if [ "${{ matrix.preset }}" = xmc4800-relax ]; then
            names="$names|xmc4800_relax_golden_link|xmc4800_relax_restart_witness_link|test_drivers_absent"
          fi
          tests/ci/ctest_named.sh "$names" --test-dir build/${{ matrix.preset }} --no-tests=error --output-on-failure
          cmake --preset ${{ matrix.preset }}-st
          cmake --build --preset ${{ matrix.preset }}-st
          ctest --test-dir build/${{ matrix.preset }}-st -LE tree --no-tests=error --output-on-failure
          names=$(links ${{ matrix.preset }}-st)
          tests/ci/ctest_named.sh "$names" --test-dir build/${{ matrix.preset }}-st --no-tests=error --output-on-failure

  # Build RP2350 shared-image and separate-image configurations, including
  # a production build without selftests.
  pizero2350-amp:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - name: armv8-M shared-image AMP, the provisional scaffolding
        run: |
          # The shared image uses two cores but declares no AMP crossings, so amp-pin
          # does not apply. Separate-image nodes below each use one core.
          cmake --preset pizero2350-amp
          cmake --build --preset pizero2350-amp
          ctest --test-dir build/pizero2350-amp -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'pizero2350_system_link_none|pizero2350_system_link_two|pizero2350_system_link_entry|pizero2350_system_link_refused|pizero2350_system_link_notool|pizero2350_system_link_nocc|pizero2350_system_link_rerun|pizero2350_system_link_noheap|pizero2350_system_link_heap' \
            --test-dir build/pizero2350-amp --no-tests=error --output-on-failure
      - name: armv8-M own-image partition, both nodes, self-test on
        run: |
          for node in 0 1; do
            cmake --preset pizero2350-amp2-n$node
            cmake --build --preset pizero2350-amp2-n$node
            ctest --test-dir build/pizero2350-amp2-n$node -L host -LE tree --no-tests=error --output-on-failure
            tests/ci/ctest_named.sh 'pizero2350_system_link_none|pizero2350_system_link_two|pizero2350_system_link_entry|pizero2350_system_link_refused|pizero2350_system_link_notool|pizero2350_system_link_nocc|pizero2350_system_link_rerun|pizero2350_system_link_noheap|pizero2350_system_link_heap' \
              --test-dir build/pizero2350-amp2-n$node --no-tests=error --output-on-failure
          done
          # Merge this posture too: the merge compares every peer's .amp_shared with node 0's.
          cmake --build build/pizero2350-amp2-n0 --target amp_partition
      - name: armv8-M own-image partition, the PRODUCTION posture (self-test off)
        run: |
          # Disable shutdown-to-bootloader along with its self-test dependency.
          # Use a separate build directory to avoid cached options. Build only:
          # preset-based gates would rebuild the standard variant instead.
          for node in 0 1; do
            cmake --preset pizero2350-amp2-n$node -B build/pizero2350-amp2-prod-n$node \
              -DKICKOS_ENABLE_SELFTEST=OFF -DKICKOS_SHUTDOWN_TO_BOOTLOADER=OFF
            cmake --build build/pizero2350-amp2-prod-n$node
          done
      - name: armv8-M own-image partition, the MERGED artefact
        run: |
          # Build the flashable merged partition. This also builds the peer and checks
          # that the Kconfig fingerprints and the .amp_shared layouts agree.
          cmake --build build/pizero2350-amp2-prod-n0 --target amp_partition
          ls -l build/pizero2350-amp2-prod-n0/kickos-partition.elf

  # Run microbenchmark presets without a job-level QEMU_TIMEOUT: each gate
  # sets its own limit. Four-core runs need sufficient host CPU time.
  # Adjust a gate's limit if needed rather than overriding all limits here.
  bench:
    needs: [toolchain-arm-none-eabi, toolchain-aarch64-none-elf, toolchain-riscv64-none-elf]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm qemu-system-riscv curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - name: the emulators every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
          command -v qemu-system-riscv64 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a and rv64 microbench at one core
        run: |
          # Require every named benchmark check to remain registered.
          # IRQ timing distributions are measured manually at rebaseline because
          # shared-runner load is uncontrolled.
          cmake --preset qemu-arm64-bench
          cmake --build --preset qemu-arm64-bench
          out=$(tests/ci/ctest_named.sh 'qemu_arm64_bench_lock|qemu_arm64_bench_cyccnt|qemu_arm64_bench_saturate|qemu_arm64_bench_phase_table|qemu_arm64_benchauth|qemu_arm64_bench_irqspan_controls' \
            --test-dir build/qemu-arm64-bench --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          cmake --preset qemu-riscv64-bench
          cmake --build --preset qemu-riscv64-bench
          out=$(tests/ci/ctest_named.sh 'qemu_riscv64_bench_lock|qemu_riscv64_bench_cyccnt|qemu_riscv64_bench_saturate|qemu_riscv64_bench_phase_table|qemu_riscv64_benchauth|qemu_riscv64_bench_irqspan_controls' \
            --test-dir build/qemu-riscv64-bench --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      - name: four-core microbench, the deterministic arms
        run: |
          # The host label excludes image tests; the second command boots them.
          # Four-core checks cover per-core samples, doorbells, lock waits, phase
          # counts, saturation, and authority checks without latency thresholds.
          # IRQ timing is measured manually; parser controls run with the host tests.
          cmake --preset qemu-arm64-benchsmp
          cmake --build --preset qemu-arm64-benchsmp
          ctest --test-dir build/qemu-arm64-benchsmp -L host -LE tree --no-tests=error --output-on-failure
          out=$(tests/ci/ctest_named.sh 'qemu_arm64_system_link_none|qemu_arm64_system_link_two|qemu_arm64_system_link_entry|qemu_arm64_system_link_refused|qemu_arm64_system_link_notool|qemu_arm64_system_link_nocc|qemu_arm64_system_link_rerun|qemu_arm64_system_link_noheap|qemu_arm64_system_link_stack' \
            --test-dir build/qemu-arm64-benchsmp --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a system link gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          out=$(tests/ci/ctest_named.sh 'qemu_arm64_bench_percore|qemu_arm64_bench_doorbell|qemu_arm64_bench_lock|qemu_arm64_bench_cyccnt|qemu_arm64_bench_saturate|qemu_arm64_bench_phase_table|qemu_arm64_benchauth' \
            --test-dir build/qemu-arm64-benchsmp --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          cmake --preset qemu-riscv64-benchsmp
          cmake --build --preset qemu-riscv64-benchsmp
          ctest --test-dir build/qemu-riscv64-benchsmp -L host -LE tree --no-tests=error --output-on-failure
          out=$(tests/ci/ctest_named.sh 'qemu_riscv64_system_link_none|qemu_riscv64_system_link_two|qemu_riscv64_system_link_entry|qemu_riscv64_system_link_refused|qemu_riscv64_system_link_notool|qemu_riscv64_system_link_nocc|qemu_riscv64_system_link_rerun|qemu_riscv64_system_link_noheap' \
            --test-dir build/qemu-riscv64-benchsmp --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a system link gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          out=$(tests/ci/ctest_named.sh 'qemu_riscv64_bench_percore|qemu_riscv64_bench_doorbell|qemu_riscv64_bench_lock|qemu_riscv64_bench_cyccnt|qemu_riscv64_bench_saturate|qemu_riscv64_bench_phase_table|qemu_riscv64_benchauth' \
            --test-dir build/qemu-riscv64-benchsmp --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      - name: the other core counts and GICv3, built with their host gates
        run: |
          for p in qemu-arm64-benchsmp2 qemu-arm64-benchsmp12 qemu-arm64-benchgicv3 qemu-riscv64-benchsmp2; do
            cmake --preset "$p"
            cmake --build --preset "$p"
            ctest --test-dir "build/$p" -L host -LE tree --no-tests=error --output-on-failure
          done
      - name: armv7m microbench, link surface only
        run: |
          # F411 uses percentile histograms. Run host checks only; timing needs hardware.
          cmake --preset f411disco-bench
          cmake --build --preset f411disco-bench
          ctest --test-dir build/f411disco-bench -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'f411disco_system_link_none|f411disco_system_link_two|f411disco_system_link_entry|f411disco_system_link_refused|f411disco_system_link_notool|f411disco_system_link_nocc|f411disco_system_link_rerun|f411disco_system_link_noheap|f411disco_system_link_heap' \
            --test-dir build/f411disco-bench --no-tests=error --output-on-failure
          # XMC builds the min/avg/max variant without histograms.
          cmake --preset xmc4800-relax-bench
          cmake --build --preset xmc4800-relax-bench
          ctest --test-dir build/xmc4800-relax-bench -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'xmc4800_relax_system_link_none|xmc4800_relax_system_link_two|xmc4800_relax_system_link_entry|xmc4800_relax_system_link_refused|xmc4800_relax_system_link_notool|xmc4800_relax_system_link_nocc|xmc4800_relax_system_link_rerun|xmc4800_relax_system_link_noheap|xmc4800_relax_system_link_heap' \
            --test-dir build/xmc4800-relax-bench --no-tests=error --output-on-failure
