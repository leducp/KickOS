# SPDX-License-Identifier: CECILL-C
# KickOS CI: the deterministic, host-runnable green gates (docs/m2-readiness.md #6).
# Silicon RUN validation is NOT here -- it stays a manual/bench step per the HW-test
# deferral policy. Every job mirrors a `--preset` invocation.
#
# ISA coverage: sim (host), armv7m + armv6m (QEMU run), rv32imac (QEMU run, plain and
# under PMP), Xtensa LX6 (build-only). Renesas RX is the ONE ISA with no gate: RX72M
# needs -misa=v3 and -mdfpu, which exist only in the registration-gated Renesas GNURX
# build -- upstream rx-elf GCC rejects both -- so RX cannot be built on a hosted
# runner and remains bench-validated.
#
# MPU-enforcement coverage is deliberately asymmetric: it is exercised at RUNTIME on
# the sim (host mprotect) and on rv32imac (PMP, the qemu-riscv-mpu job), but on ARM it
# is a BUILD gate only (build-boards-mpu). QEMU models no enforcement-capable KickOS
# ARM chip -- the enforcing ports are all silicon parts, and the one runnable armv7m
# target (qemu/mps2) ships no enforcement block -- so ARM PMSA/SYSMPU trapping stays
# silicon-validated (docs/m2-readiness.md) and CI covers only its link surface.
#
# Toolchains are the SAME pinned vendor tarballs used locally (reproducibility): the
# official Arm GNU Toolchain (arm-none-eabi, newlib), the RISCstar toolchain
# (riscv32-none-elf, newlib, rv32imac soft-float multilib), and Espressif's
# crosstool-NG Xtensa build. All downloaded + cached; no apt gcc-arm-none-eabi /
# xPack. The sim job uses the host g++.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # These name the vendor tarballs, nothing in cmake/: no toolchain file carries a
  # default compiler path any more (all four seed KICKOS_*_TOOLCHAIN_BIN from the
  # environment), so only the variable NAMES have to agree.
  # CI uses 15.2.rel1 (the newest arm-none-eabi that developer.arm.com serves anonymously;
  # 15.3.rel1 is gitlab-only + login-gated). The dev/silicon toolchain is 15.3.rel1 -- no
  # preset pins a compiler path, so this CI-only minor skew is harmless for
  # build-regression coverage.
  ARM_TC_DIR: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi
  ARM_TC_URL: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
  RV_TC_DIR: riscstar-toolchain-16.1-r1-x86_64-riscv32-none-elf
  RV_TC_URL: https://releases.riscstar.com/toolchain/16.1-r1/riscstar-toolchain-16.1-r1-x86_64-riscv32-none-elf.tar.xz
  # Espressif's Xtensa toolchain: a PUBLIC GitHub release asset (anonymous, no
  # registration), unlike the RX vendor toolchain. The tarball is named
  # xtensa-esp-elf (the unified toolchain) but still installs the per-chip
  # xtensa-esp32-elf-* program names the toolchain file looks for, and unpacks to a
  # version-less xtensa-esp-elf/ -- hence the separate tag in the cache key.
  # Do NOT downgrade to esp-12.2.0 (the last release whose asset is literally named
  # xtensa-esp32-elf): its GCC 12.2 predates -nostdlib++, which the freestanding-C++
  # posture passes, so every compile dies on "unrecognized command-line option".
  # esp-16.1.0_20260609 is the version actually verified to build the fleet.
  XT_TC_DIR: xtensa-esp-elf
  XT_TC_TAG: esp-16.1.0_20260609
  XT_TC_URL: https://github.com/espressif/crosstool-NG/releases/download/esp-16.1.0_20260609/xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.xz

jobs:
  # Authoritative deterministic gate: full ctest on the host sim -- selftest, the
  # stress soak (incl. thread-reclaim churn), sched_exit, mpu_fault, telemetry
  # golden-vector, and the out-of-tree export check.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - run: cmake --preset sim
      - run: cmake --build --preset sim
      - run: ctest --preset sim --output-on-failure

  # armv7m (mps2-an386) + armv6m (microbit) under QEMU, on the pinned Arm GNU toolchain.
  qemu-arm:
    runs-on: ubuntu-latest
    # The mps2/nrf51 QEMU targets clock off semihosting SYS_CLOCK, which QEMU <= 10
    # (ubuntu-latest ships 8.2) freezes while the core is halted in WFI -- so a
    # timed sleep with every thread idle never wakes. The arch idle path spins on
    # these QEMU-only chips to keep the clock advancing (see arch_idle_wait). This
    # timeout is just failure headroom on a loaded runner; passing gates exit early.
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-system-arm curl xz-utils
      - name: Cache Arm GNU toolchain
        id: cache-arm
        uses: actions/cache@v4
        with:
          path: ~/tc/${{ env.ARM_TC_DIR }}
          key: ${{ env.ARM_TC_DIR }}
      - name: Download Arm GNU toolchain
        if: steps.cache-arm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc
          # developer.arm.com 302-redirects to an anonymous Azure blob; fail loud if not xz.
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/arm.tar.xz "$ARM_TC_URL"
          file /tmp/arm.tar.xz | grep -q XZ || { echo "arm toolchain: $ARM_TC_URL served non-xz (gated/redirect?)"; exit 1; }
          tar -C ~/tc -xf /tmp/arm.tar.xz
      - name: Put toolchain on PATH + bin
        # Two routes, and either one alone is sufficient. The toolchain files seed
        # KICKOS_*_TOOLCHAIN_BIN from the environment and re-export the resolved value,
        # so the hint now also reaches CMake's try_compile ABI check -- that child cmake
        # re-reads the toolchain file with a fresh cache, so it inherits the environment
        # and PATH but never a -D cache entry. Belt-and-braces is deliberate: PATH is
        # also what an empty hint falls back to.
        run: |
          echo "$HOME/tc/${ARM_TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "KICKOS_ARM_TOOLCHAIN_BIN=$HOME/tc/${ARM_TC_DIR}/bin" >> "$GITHUB_ENV"
      # --repeat until-pass:4: the mps2 QEMU timer is coarse (DWT frozen; ~100 Hz
      # semihosting clock), so the run gates can transiently miss their output
      # window under CI-host load. Retry rides that out; a real hang still fails
      # (each attempt is bounded by the gate's own timeout).
      - name: armv7m (mps2-an386)
        run: |
          cmake --preset qemu -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu
          ctest --preset qemu --output-on-failure --repeat until-pass:4
      - name: armv6m (microbit)
        run: |
          cmake --preset microbit -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset microbit
          ctest --preset microbit --output-on-failure --repeat until-pass:4

  # rv32imac (virt) under QEMU, plus build-only checks of the other two rv32 boards,
  # on the pinned RISCstar toolchain (newlib, soft-float rv32imac/ilp32 multilib).
  # No idle fix needed here: RISC-V clocks off the CLINT mtime, which keeps ticking
  # during WFI (unlike the ARM semihosting clock). QEMU_TIMEOUT is failure headroom.
  qemu-riscv:
    runs-on: ubuntu-latest
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-system-misc curl xz-utils
      - name: Cache RISCstar toolchain
        id: cache-rv
        uses: actions/cache@v4
        with:
          path: ~/tc/${{ env.RV_TC_DIR }}
          key: ${{ env.RV_TC_DIR }}
      - name: Download RISCstar toolchain
        if: steps.cache-rv.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/rv.tar.xz "$RV_TC_URL"
          file /tmp/rv.tar.xz | grep -q XZ || { echo "rv toolchain: $RV_TC_URL served non-xz (gated/redirect?)"; exit 1; }
          tar -C ~/tc -xf /tmp/rv.tar.xz
      - name: Put toolchain on PATH + bin
        # Env var and PATH; either alone is sufficient (see qemu-arm).
        run: |
          echo "$HOME/tc/${RV_TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "KICKOS_RISCV_TOOLCHAIN_BIN=$HOME/tc/${RV_TC_DIR}/bin" >> "$GITHUB_ENV"
      - name: rv32imac (virt) run gate
        run: |
          cmake --preset qemu-riscv -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv
          ctest --preset qemu-riscv --output-on-failure --repeat until-pass:4
      - name: build-only rv32 boards
        run: |
          cmake --preset esp32c6-wroom -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom
          cmake --preset qemu-riscv-bench -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-bench

  # rv32imac (virt) UNDER PMP ENFORCEMENT (-DKICKOS_HAVE_MPU=1): runs the full-C++
  # throw under PMP + the gp-in-appdata CI gates (riscv_no_smalldata, qemu_riscv_cxxtest,
  # qemu_riscv_mpu_fault -- docs/design-riscv-gp-split.md, docs/design-cxx-under-mpu.md).
  # Deterministic (~3s, no silicon). Same RISCstar toolchain as the non-enforcement job.
  qemu-riscv-mpu:
    runs-on: ubuntu-latest
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-system-misc curl xz-utils
      - name: Cache RISCstar toolchain
        id: cache-rv
        uses: actions/cache@v4
        with:
          path: ~/tc/${{ env.RV_TC_DIR }}
          key: ${{ env.RV_TC_DIR }}
      - name: Download RISCstar toolchain
        if: steps.cache-rv.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/rv.tar.xz "$RV_TC_URL"
          file /tmp/rv.tar.xz | grep -q XZ || { echo "rv toolchain: $RV_TC_URL served non-xz (gated/redirect?)"; exit 1; }
          tar -C ~/tc -xf /tmp/rv.tar.xz
      - name: Put toolchain on PATH + bin
        # Env var and PATH; either alone is sufficient (see qemu-arm).
        run: |
          echo "$HOME/tc/${RV_TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "KICKOS_RISCV_TOOLCHAIN_BIN=$HOME/tc/${RV_TC_DIR}/bin" >> "$GITHUB_ENV"
      - name: rv32imac (virt) enforcement gate
        run: |
          cmake --preset qemu-riscv -DKICKOS_HAVE_MPU=1 -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv
          ctest --preset qemu-riscv --output-on-failure --repeat until-pass:4

  # Xtensa LX6 (esp32-wroom) build-only gate. No run step: upstream QEMU ships no ESP32
  # machine model, so this catches build/link/linker-script + windowed-ABI asm
  # regressions only -- HW validation stays a bench step. Both the plain and the
  # selftest config are built (the latter pulls the full IRQ suite, which is what is
  # HW-validated). esptool is deliberately NOT installed: it is only needed for the
  # bootable .app.bin elf2image post-step, which CI cannot boot anyway -- the ELF link
  # is the regression signal, and CMake reports the skip without failing.
  xtensa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build curl xz-utils file
      - name: Cache Xtensa toolchain
        id: cache-xt
        uses: actions/cache@v4
        with:
          path: ~/tc/${{ env.XT_TC_DIR }}
          # Tag in the key: the extracted dir is version-less, so a tag bump must miss.
          key: ${{ env.XT_TC_DIR }}-${{ env.XT_TC_TAG }}
      - name: Download Xtensa toolchain
        if: steps.cache-xt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/xt.tar.xz "$XT_TC_URL"
          file /tmp/xt.tar.xz | grep -q XZ || { echo "xtensa toolchain: $XT_TC_URL served non-xz (gated/redirect?)"; exit 1; }
          tar -C ~/tc -xf /tmp/xt.tar.xz
      - name: Put toolchain on PATH + bin
        # Both, for the same reason as qemu-arm: either alone is sufficient. The env var
        # is what cmake/toolchain-xtensa-esp32-elf.cmake seeds KICKOS_XTENSA_BIN from,
        # and it re-exports the resolved value so try_compile inherits it too.
        run: |
          echo "$HOME/tc/${XT_TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "KICKOS_XTENSA_BIN=$HOME/tc/${XT_TC_DIR}/bin" >> "$GITHUB_ENV"
      - name: xtensa lx6 (esp32-wroom) build gate
        run: |
          cmake --preset esp32-wroom -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom
      - name: xtensa lx6 + selftest config
        run: |
          cmake --preset esp32-wroom-st -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom-st

  # Build-only sweep of the remaining ARM boards (catches build/link/linker-script
  # regressions). No run step -- these need silicon or a machine model CI does not
  # carry. RX omitted: RX72M needs -misa=v3/-mdfpu, which exist only in the
  # registration-gated Renesas GNURX build (upstream rx-elf GCC rejects both), so it
  # stays a bench step. Xtensa is the job above; RISC-V is the qemu-riscv job.
  build-boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, bluepill-c8, picopi,
                 f302nucleo, due, xmc4800-relax, qemu-telem, teensy41, pizero2350]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build curl xz-utils
      - name: Cache Arm GNU toolchain
        id: cache-arm
        uses: actions/cache@v4
        with:
          path: ~/tc/${{ env.ARM_TC_DIR }}
          key: ${{ env.ARM_TC_DIR }}
      - name: Download Arm GNU toolchain
        if: steps.cache-arm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc
          # developer.arm.com 302-redirects to an anonymous Azure blob; fail loud if not xz.
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/arm.tar.xz "$ARM_TC_URL"
          file /tmp/arm.tar.xz | grep -q XZ || { echo "arm toolchain: $ARM_TC_URL served non-xz (gated/redirect?)"; exit 1; }
          tar -C ~/tc -xf /tmp/arm.tar.xz
      - name: Put toolchain on PATH + bin
        # Env var and PATH; either alone is sufficient (see qemu-arm).
        run: |
          echo "$HOME/tc/${ARM_TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "KICKOS_ARM_TOOLCHAIN_BIN=$HOME/tc/${ARM_TC_DIR}/bin" >> "$GITHUB_ENV"
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}

  # ARM MPU-ENFORCEMENT build gate: the same ARM boards again, but configured with
  # -DKICKOS_HAVE_MPU=1. This is the ONLY job that builds the enforcement-only link
  # surface -- nothing else in this file compiles it, on any arch except rv32imac:
  # the pow2 .appdata/.appbss window plus its overflow/placement ASSERTs, the
  # `archive:member` closed-set selectors that split kernel-owned writable state from
  # app-owned, the app code/data grant symbols, and arch_reserved_blocks -- which has
  # NO weak default on purpose (arch/include/kickos/arch/arch.h), so an enforcing port
  # that forgets to declare its reserved set is a LINK error caught here instead of a
  # silent open hole. The matrix is exactly the enforcement-capable ARM set (the boards
  # shipping arch/arm/chip/<chip>/mpu.cmake); a board without one is rejected at
  # configure time by the fail-loud floor in the top CMakeLists.
  #
  # BUILD-ONLY, and it cannot be otherwise today: QEMU carries no machine model for any
  # of these chips, and the runnable armv7m target (qemu/mps2) cannot stand in because
  # it ships no enforcement block -- `--preset qemu -DKICKOS_HAVE_MPU=1` is a hard
  # configure error by design. So cross-domain TRAPPING is not proven here; that stays
  # silicon/bench-validated. Bringing mps2 up as a runnable enforcement target is the
  # follow-up that would give ARM a real runtime gate (the rv32imac PMP job's peer).
  #
  # Honest limitation, so this job is not read as proving more than it does: the one
  # ctest gate it registers, kernel_ctor_placement, currently passes VACUOUSLY on these
  # boards. Every app in this matrix links with an EMPTY .kickos_app_init_array window
  # (only the full-C++ cxxtest image has a non-empty one), so the check takes its
  # "window empty -> PASS" early-out and never inspects a pointer. What it does still
  # prove is that the enforced ctor-split section symbols EXIST -- it fails loudly when
  # they do not. Re-pointing it at a non-empty window is a separate follow-up.
  #
  # No `ctest --preset`: cmake/presets/arm.json defines test presets only for
  # qemu/qemu-telem/microbit, so these boards are driven by --test-dir on the preset's
  # binaryDir. picopi is armv6m -- it links under enforcement but registers no ctor
  # gate (that check is armv7m-only), so its ctest run is the build fixture alone.
  build-boards-mpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, pizero2350, teensy41,
                 xmc4800-relax, picopi]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build curl xz-utils
      - name: Cache Arm GNU toolchain
        id: cache-arm
        uses: actions/cache@v4
        with:
          path: ~/tc/${{ env.ARM_TC_DIR }}
          key: ${{ env.ARM_TC_DIR }}
      - name: Download Arm GNU toolchain
        if: steps.cache-arm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tc
          # developer.arm.com 302-redirects to an anonymous Azure blob; fail loud if not xz.
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/arm.tar.xz "$ARM_TC_URL"
          file /tmp/arm.tar.xz | grep -q XZ || { echo "arm toolchain: $ARM_TC_URL served non-xz (gated/redirect?)"; exit 1; }
          tar -C ~/tc -xf /tmp/arm.tar.xz
      - name: Put toolchain on PATH + bin
        # Env var and PATH; either alone is sufficient (see qemu-arm).
        run: |
          echo "$HOME/tc/${ARM_TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "KICKOS_ARM_TOOLCHAIN_BIN=$HOME/tc/${ARM_TC_DIR}/bin" >> "$GITHUB_ENV"
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_HAVE_MPU=1 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
