          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a required gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      - name: armv8a (virt) AMP, node 1 of a two-image partition
        run: |
          cmake --preset qemu-arm64-amp2-n1
          # Build node 1 to catch accidental reuse of node 0's configuration.
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp2-n1 1 own 2
          cmake --build --preset qemu-arm64-amp2-n1
          ctest --preset qemu-arm64-amp2-n1 -LE tree --no-tests=error --output-on-failure
          out=$(tests/ci/ctest_named.sh '^qemu_arm64_sysdefault$|qemu_arm64_sysdefault_spin|qemu_arm64_sysdefault_fault|qemu_arm64_system_link_none|qemu_arm64_system_link_two|qemu_arm64_system_link_entry|qemu_arm64_system_link_refused|qemu_arm64_system_link_notool|qemu_arm64_system_link_nocc|qemu_arm64_system_link_rerun|qemu_arm64_system_link_noheap|qemu_arm64_system_link_stack' \
