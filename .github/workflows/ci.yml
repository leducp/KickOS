# KickOS CI: the deterministic, host-runnable green gates.
# Every job mirrors a `--preset` invocation. Every gate here is host or QEMU: a job may not
# depend on a board, so nothing here states a port's hardware status.
#
# Warnings-as-errors rides every job with no flag (KICKOS_WERROR defaults ON in tree).
#
# Toolchains are the SAME pinned vendor tarballs used locally, downloaded and cached. The
# sim job uses the host g++.
#
# Each pin lives in the composite action that uses it, under .github/actions/<name>. A job
# asks for one by name and gets the cache, the fetch and the exported KICKOS_* variables.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual per-branch run: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates whose verdict is a function of the source tree alone: one configure answers
  # for every preset, and none of them opens the build directory. Every other job excludes
  # this label.
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      - run: cmake --preset sim
      - run: ctest --preset sim -L tree --no-tests=error --output-on-failure

  # Authoritative deterministic gate: the host sim suite, less the tree gates code-quality
  # already answered for every preset.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # Before the configure, and NOT optional: KICKOS_BUILD_UNIT_TESTS defaults to whether
      # find_package(GTest) succeeded, and a run with the host unit layer dropped is green.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build --preset sim
      - run: ctest --preset sim -LE tree --no-tests=error --output-on-failure

  # The sim gate rebuilt under UndefinedBehaviorSanitizer. -fno-sanitize-recover=all is what
  # makes it a GATE: UBSan's default is print-and-continue, exit status 0.
  #
  # Do NOT add -fsanitize=address: the sim switches threads with ucontext, and without
  # __sanitizer_start/finish_switch_fiber annotations ASan treats each new stack as a wild
  # region and the sim hangs.
  #
  # Flags go through the CFLAGS/CXXFLAGS ENVIRONMENT at JOB level, not -DCMAKE_C/CXX_FLAGS on
  # the configure step: the oot_export test's child cmake inherits the environment but never
  # a -D, and would otherwise link instrumented archives without the UBSan runtime.
  sim-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
      CXXFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # GTest itself is built by Conan WITHOUT the job's CFLAGS (Conan uses its own profile),
      # so the instrumented tree links an uninstrumented gtest.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -B build/sim-ubsan -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build build/sim-ubsan
      - run: ctest --test-dir build/sim-ubsan -LE tree --no-tests=error --output-on-failure

  # armv7m (mps2-an386) + armv6m (microbit) under QEMU, on the pinned Arm GNU toolchain.
  qemu-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The mps2/nrf51 QEMU targets clock off semihosting SYS_CLOCK, which QEMU <= 10
    # (ubuntu-latest ships 8.2) freezes while the core is halted in WFI, so a timed
    # sleep with every thread idle never wakes. The arch idle path spins on these
    # QEMU-only chips to keep the clock advancing (see arch_idle_wait). This timeout
    # is failure headroom on a loaded runner; passing gates exit early.
    env:
      QEMU_TIMEOUT: "30"
      # The gates whose image never exits, so they go through poll_image (tests/lib/gate.sh).
      POLLED: "hello|fp_switch|mpu_fault|rootfault|rootgone|reclaimwit_park"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      # A SKIP IS NOT A PASS. Every image gate in this job boots through need_qemu, which
      # exits 77 on a missing emulator; ctest reports that as Skipped and still exits 0, so an
      # absent qemu-system-arm greens a job that booted nothing.
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      # --repeat until-pass:2 rides the POLLED gates and NOTHING else. The mps2/nrf51
      # clock is the ~100 Hz semihosting SYS_CLOCK (chip_mps2.cc arch_clock_now, DWT
      # frozen), so every timed sleep before an awaited line is stretched to a 10 ms
      # granule and a loaded runner can push the last pattern past the poll bound. A real
      # hang still fails, each attempt being bounded by the gate's own timeout.
      - name: armv7m (mps2-an386)
        run: |
          cmake --preset qemu -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu
          ctest --preset qemu -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" --preset qemu --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin. Those two gates are REGISTERED only when the enforcing posture in
          # this board's base defconfig resolves on, so naming them is what turns a lost
          # registration into a failure.
          #
          # THROUGH ctest_named.sh AND NOT ctest, HERE AND AT EVERY OTHER NAME LIST IN THIS
          # FILE. --no-tests=error fires only on an ENTIRELY empty selection, so one name of
          # two going away leaves the step running the other and exiting 0. The helper asks
          # ctest for each name on its own and refuses the run when one selects nothing.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu --no-tests=error --output-on-failure --repeat until-pass:2
      # The M33 is armv8-M (PMSAv8, a different register layout), the M7 has 16 MPU regions
      # to the M4's 8, and the M3 is soft-float, so the soft-float switch path runs there.
      - name: armv8-m mainline (mps2-an505, Cortex-M33)
        run: |
          cmake --preset qemu-m33 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m33
          ctest --preset qemu-m33 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin, as on the an386: this board carries its own base defconfig.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:2
      - name: armv7m (mps2-an500, Cortex-M7)
        run: |
          cmake --preset qemu-m7 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m7
          ctest --preset qemu-m7 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin, as on the an386: this board carries its own base defconfig.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:2
      - name: armv7m soft-float (mps2-an385, Cortex-M3)
        run: |
          cmake --preset qemu-m3 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m3
          ctest --preset qemu-m3 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin, as on the an386: this board carries its own base defconfig.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:2
          # Pins the REGISTRATION, not just the result. The terse-column arm is keyed on this
          # board AND on this tree resolving KICKOS_DIAG_TERSE off, the arm itself forcing the
          # knob on in a tree of its own, so a variant that turned it on here would leave the
          # suite one test shorter and still green.
          tests/ci/ctest_named.sh '^qemu_m3_diag_terse$' --preset qemu-m3 --no-tests=error --output-on-failure
      # The ring-only posture of the same four boards, which is what ringpriv and
      # ringppb assert against: the privilege ring holds on its own.
      - name: ARM ring-only run gates (no PMSA enforcement)
        run: |
          for b in qemu qemu-m33 qemu-m7 qemu-m3; do
            cmake --preset "$b-flat" -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
            cmake --build --preset "$b-flat"
            ctest --preset "$b-flat" -E "$POLLED" -LE tree --no-tests=error --output-on-failure
            tests/ci/ctest_named.sh "$POLLED" \
              --preset "$b-flat" --no-tests=error --output-on-failure --repeat until-pass:2
            # The terse-column arm is keyed on the BOARD and the knob and not on the variant,
            # so this posture carries a registration of its own, which the pin in the step
            # above does not reach. qemu-m3 is the only one of the four that registers it.
            if [ "$b" = qemu-m3 ]; then
              tests/ci/ctest_named.sh '^qemu_m3_diag_terse$' --preset "$b-flat" --no-tests=error --output-on-failure
            fi
          done
      - name: armv6m (microbit)
        run: |
          cmake --preset microbit -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset microbit
          ctest --preset microbit -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset microbit --no-tests=error --output-on-failure --repeat until-pass:2
          # Pins the REGISTRATION, not just the result. microbit is the only CI board that
          # carves kernel blocks without enforcing, so it is the only one where the block
          # leg's room bound is reachable from a thread; a condition that stopped registering
          # this arm would leave the suite one test shorter and still green.
          tests/ci/ctest_named.sh '^microbit_pspguard_block$' --preset microbit --no-tests=error --output-on-failure

  # armv8a (virt) under QEMU: the first 64-bit ISA, a Cortex-A53 at EL1 with an unprivileged
  # EL0 and a 1:1 map. The generic timer keeps counting in WFI, so a timed sleep advances
  # with every thread idle and QEMU_TIMEOUT is failure headroom rather than a clock crutch.
  # qemu-system-aarch64 ships in the qemu-system-arm package on Ubuntu.
  qemu-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/aarch64-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt, Cortex-A53)
        run: |
          cmake --preset qemu-arm64 -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          cmake --build --preset qemu-arm64
          ctest --preset qemu-arm64 -LE tree --no-tests=error --output-on-failure
          # Capability pin, not just a result: armv8a selects both kernel-stack symbols and
          # TLS, and naming these three is what turns a lost registration into a failure.
          tests/ci/ctest_named.sh 'death_stack_seating|no_privileged_tls|qemu_arm64_tlsprobe' \
            --preset qemu-arm64 --no-tests=error --output-on-failure

  # armv8a (virt) at FOUR KERNEL CORES, in the two postures the placement work is written
  # against. The qemu-arm64 job above drives ONE core, where sched_admit_mask, the affinity
  # syscall and every placement arm compile out, so nothing there covers them.
  #
  # smp is the plain four-core posture; smpiso adds the isolation mask, which is what makes
  # three of the placement arms run instead of skip.
  #
  # THE EXPECTED-SKIP LIST CANNOT WITNESS THE MASK. It is DERIVED from the same knob, so a
  # variant that lost its mask moves the list with it and the selftest gate passes on a run
  # that covered the plain SMP posture twice. The configured value is read below instead.
  qemu-arm64-smp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/aarch64-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) four cores
        run: |
          cmake --preset qemu-arm64-smp -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          cmake --build --preset qemu-arm64-smp
          ctest --preset qemu-arm64-smp -LE tree --no-tests=error --output-on-failure
          # Posture pin, as in qemu-arm: the core count is a line in this variant's defconfig,
          # and dropping it de-registers these four instead of failing them.
          tests/ci/ctest_named.sh 'qemu_arm64_smp_arrival|qemu_arm64_smp_doorbell|qemu_arm64_smp_threads|qemu_arm64_slaypeer' \
            --preset qemu-arm64-smp --no-tests=error --output-on-failure
      - name: armv8a (virt) four cores, core 3 isolated
        run: |
          cmake --preset qemu-arm64-smpiso -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          # Posture pin, read from the RESOLVED configuration and not from anything the knob
          # also derives. A mask of zero here is the plain SMP posture under another name.
          iso=$(sed -n 's/^#define KICKOS_ISOLATED_CORES //p' \
                build/qemu-arm64-smpiso/generated/include/kickos/board_config.h)
          if [ -z "$iso" ] || [ "$((iso))" -eq 0 ]; then
            echo "smpiso resolved KICKOS_ISOLATED_CORES='$iso': this step would re-run the plain SMP posture"
            exit 1
          fi
          cmake --build --preset qemu-arm64-smpiso
          ctest --preset qemu-arm64-smpiso -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'isolated_cores|qemu_arm64_selftest' \
            --preset qemu-arm64-smpiso --no-tests=error --output-on-failure

  # armv8a (virt) at FOUR KERNEL CORES under a GICv3, which is the controller the i.MX8MP A53
  # cluster wires. The qemu-arm64-smp job drives the same four cores on the machine's default
  # GICv2, and every AMP variant below builds a GICv3 with KICKOS_KERNEL_CORES at 1, so the
  # shared-kernel doorbell over ICC_SGI1R_EL1 is reached by neither.
  qemu-arm64-gicv3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/aarch64-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) four cores under a GICv3
        run: |
          cmake --preset qemu-arm64-gicv3 -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          # Posture pin, read from the RESOLVED configuration. The controller is one line in
          # this variant's defconfig, and at version 2 the machine keeps its default GICv2 and
          # this step is the qemu-arm64-smp job again under another name.
          gic=$(sed -n 's/^#define KICKOS_ARM64_GIC_VERSION //p' \
                build/qemu-arm64-gicv3/generated/include/kickos/board_config.h)
          if [ -z "$gic" ] || [ "$((gic))" -ne 3 ]; then
            echo "gicv3 resolved KICKOS_ARM64_GIC_VERSION='$gic': this step would re-run the GICv2 posture"
            exit 1
          fi
          cmake --build --preset qemu-arm64-gicv3
          ctest --preset qemu-arm64-gicv3 -LE tree --no-tests=error --output-on-failure
          # Posture pin, as in qemu-arm64-smp: the kernel-core count is this variant's
          # defconfig, and dropping it de-registers these four instead of failing them.
          tests/ci/ctest_named.sh 'qemu_arm64_smp_arrival|qemu_arm64_smp_doorbell|qemu_arm64_smp_threads|qemu_arm64_slaypeer' \
            --preset qemu-arm64-gicv3 --no-tests=error --output-on-failure

  # armv8a (virt) as an AMP PARTITION, in BOTH halves of the instrument.
  # docs/design-multicore.md N6c states the three clauses: the shared image catches a keying
  # COLLAPSE, an own-image node catches a BOUND, and two kernels running at once catches what
  # neither can, both of those running one image at a time.
  #
  # NOT UNDER `--repeat until-pass`. That flag rides the POLLED gates above and nothing else: a
  # two-kernel gate draws fresh every run on the console interleaving and on which kernel
  # publishes first, so a retry would mask the class this vehicle exists to find.
  qemu-arm64-amp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/aarch64-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) AMP, one image over four cores
        run: |
          cmake --preset qemu-arm64-amp -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          # Posture pin, read from the RESOLVED partition and not from anything that derives
          # with it. A build that lost its AMP posture states no crossing, so the count is zero
          # and every arm below de-registers instead of failing.
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp 0 shared 4
          cmake --build --preset qemu-arm64-amp
          ctest --preset qemu-arm64-amp -LE tree --no-tests=error --output-on-failure
          # Naming them turns a lost registration into a failure, as the pins above do.
          tests/ci/ctest_named.sh 'ipi_fence|qemu_arm64_selftest' \
            --preset qemu-arm64-amp --no-tests=error --output-on-failure
      - name: armv8a (virt) AMP, node 0 of a two-image partition
        run: |
          cmake --preset qemu-arm64-amp2-n0 -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp2-n0 0 own 2
          cmake --build --preset qemu-arm64-amp2-n0
          # The two vehicle gates build the PEER and merge the partition themselves, so this
          # covers the merged artefact, the two-ELF agreement check and the arms that need a
          # peer that is running.
          ctest --preset qemu-arm64-amp2-n0 -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'amp_partition|amp_elf_agree|amp_peer_arms|ipi_fence' \
            --preset qemu-arm64-amp2-n0 --no-tests=error --output-on-failure
      - name: armv8a (virt) AMP, node 1 of a two-image partition
        run: |
          cmake --preset qemu-arm64-amp2-n1 -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          # Node ONE and not a second node zero: a pair built as two node zeros is N6c's
          # collapse, it links and boots, and every arm that runs on node 0 passes on it.
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp2-n1 1 own 2
          cmake --build --preset qemu-arm64-amp2-n1
          ctest --preset qemu-arm64-amp2-n1 -LE tree --no-tests=error --output-on-failure
      - name: armv8a (virt) AMP, a three-image partition, link geometry only
        run: |
          # The width's claim is a link-geometry claim, so this job boots nothing: the
          # two-kernel conversation is pinned by the node 0 job above.
          #
          # Every "each peer against node 0" shortcut is correct at two nodes, so a third node
          # is what separates a real bound from a collapse, and the comparator checks every
          # PAIR.
          for n in 0 1 2; do
            cmake --preset "qemu-arm64-amp3-n$n" -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
            . ./.github/scripts/amp-pin.sh "build/qemu-arm64-amp3-n$n" "$n" own 3
            cmake --build --preset "qemu-arm64-amp3-n$n"
          done
          # Node 0 owns the merge (N6h), so the comparator runs from its build and builds the
          # peers itself. Naming it turns a lost registration into a failure.
          tests/ci/ctest_named.sh 'amp_elf_agree' --preset qemu-arm64-amp3-n0 --no-tests=error --output-on-failure

  # rv32imac (virt) under QEMU, plus build-only checks of three more rv32 presets,
  # on the pinned RISCstar toolchain (newlib, soft-float rv32imac/ilp32 multilib).
  # RISC-V clocks off the CLINT mtime, which keeps ticking during WFI, so a timed sleep
  # advances with every thread idle. QEMU_TIMEOUT is failure headroom.
  qemu-riscv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-riscv32 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv32 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      # The ring-only posture: this board's flat variant is what the freestanding
      # PMP-less hello and cxxtest gates are registered on.
      - name: rv32imac (virt) run gate, no PMP enforcement
        run: |
          cmake --preset qemu-riscv-flat -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-flat
          ctest --preset qemu-riscv-flat -LE tree --no-tests=error --output-on-failure
      # -L host is the gate set that executes no image.
      - name: build-only rv32 boards
        run: |
          cmake --preset esp32c6-wroom -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom
          ctest --test-dir build/esp32c6-wroom -L host -LE tree --no-tests=error --output-on-failure
          cmake --preset esp32c6-wroom-flat -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom-flat
          ctest --test-dir build/esp32c6-wroom-flat -L host -LE tree --no-tests=error --output-on-failure
          cmake --preset qemu-riscv-bench -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-bench
          ctest --test-dir build/qemu-riscv-bench -L host -LE tree --no-tests=error --output-on-failure

  # rv32imac (virt) UNDER PMP ENFORCEMENT, which is this board's base variant: runs the full-C++
  # throw under PMP + the gp-in-appdata CI gates (riscv_no_smalldata, qemu_riscv_cxxtest,
  # qemu_riscv_mpu_fault): the global pointer is kept out of the app's window, and a C++
  # throw runs under enforcement.
  # Deterministic (~3s). Same RISCstar toolchain as the non-enforcement job.
  qemu-riscv-mpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-riscv32 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv32 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: rv32imac (virt) enforcement gate
        run: |
          cmake --preset qemu-riscv -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv
          ctest --preset qemu-riscv -LE tree --no-tests=error --output-on-failure
          # Posture pin, as in qemu-arm: PMP enforcement is a line in this board's base
          # defconfig, and dropping it de-registers these gates instead of failing them.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault|rootgone' \
            --preset qemu-riscv --no-tests=error --output-on-failure

  # rv64imac (virt) under QEMU: the base and sv48 postures, plus the FOUR-HART shared kernel.
  # No rv64 preset ran in CI before this job, while cmake/presets/riscv.json has carried all
  # three since the port landed, so what was missing was the job and not the coverage.
  # Same pinned RISCstar toolchain as the two rv32 jobs, whose multilib set includes the rv64
  # one; qemu-system-misc provides qemu-system-riscv64.
  #
  # The four-hart variant is where a shared kernel's address-space teardown is exposed: rv64
  # keeps the kernel's own top-level entries in each space's ROOT page, so a hart still
  # holding a destroyed space's root walks a frame the pool has reissued.
  qemu-riscv64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Above the rv32 jobs' 30: the four-hart gates sample until both channels complete
      # rather than waiting a fixed span, so this is headroom on a loaded runner.
      QEMU_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-riscv64 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: rv64imac (virt) sv39 gate
        run: |
          cmake --preset qemu-riscv64 -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv64
          ctest --preset qemu-riscv64 -LE tree --no-tests=error --output-on-failure
          # Posture pin: both are registered only where this board's base defconfig resolves
          # enforcement on, so naming them turns a lost registration into a failure.
          tests/ci/ctest_named.sh 'rootfault|rootgone' --preset qemu-riscv64 --no-tests=error --output-on-failure
      - name: rv64imac (virt) sv48 gate
        run: |
          cmake --preset qemu-riscv64-sv48 -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv64-sv48
          ctest --preset qemu-riscv64-sv48 -LE tree --no-tests=error --output-on-failure
      - name: rv64imac (virt) four harts
        run: |
          cmake --preset qemu-riscv64-smp -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv64-smp
          ctest --preset qemu-riscv64-smp -LE tree --no-tests=error --output-on-failure
          # Posture pin: the hart count and the selftest line are this variant's defconfig,
          # and dropping either de-registers these arms instead of failing them.
          tests/ci/ctest_named.sh 'smp_threads|taskleave|slaypeer' \
            --preset qemu-riscv64-smp --no-tests=error --output-on-failure

  # x86_64 (q35) under QEMU, over a UEFI handover. The ONE job with no toolchain action:
  # cmake/toolchain-x86_64-uefi.cmake finds the HOST gcc, ubuntu-latest being x86_64 itself, and
  # refuses the configure outright if ld carries no i386pep emulation for the PE32+ link.
  #
  # The firmware is not optional and no -kernel substitutes for it: the image is a PE32+
  # application -kernel cannot start at all, so gate.sh builds an EFI system partition and boots
  # OVMF. The pair is RESOLVED below rather than named: the ovmf package chooses those
  # filenames and the spelling differs across releases.
  #
  # gate.sh SKIPS every image gate when it finds no firmware, and skips them again when mtools
  # is absent, so both would report success. Resolving the pair here turns the first into a
  # named refusal, mtools is in the package list for the second, and the skip guard below is
  # what makes either of them red rather than green.
  #
  # Neither ovmf nor mtools ships a command of its own name, so build-tools cannot see either
  # as already present and apts both on every run of this job.
  qemu-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++ qemu-system-x86 ovmf mtools
      - name: x86_64 (q35) UEFI handover gate
        run: |
          command -v qemu-system-x86_64 >/dev/null 2>&1 \
            || { echo "qemu-system-x86_64 is absent: every image gate below would SKIP and ctest would still exit 0"; exit 1; }
          # The PE32+ link's `-b elf64-x86-64` is load-bearing on binutils 2.42 and inert above
          # it, so this line is the only record of whether a run could have caught the flag's
          # loss. The toolchain file's i386pep refusal says nothing about the version.
          ld --version | head -1
          # The variable store must be the CODE file's OWN spelling: a 4M image paired with a
          # store of another size is not a working pair, so the match is what selects both.
          ovmf_dirs="/usr/share/OVMF /usr/share/ovmf /usr/share/edk2/x64 /usr/share/edk2-ovmf/x64 /usr/share/qemu"
          ovmf_code=""
          ovmf_vars=""
          for d in $ovmf_dirs; do
            for c in "$d"/OVMF_CODE*.fd; do
              [ -f "$c" ] || continue
              v=$(printf '%s' "$c" | sed 's/OVMF_CODE/OVMF_VARS/')
              [ -f "$v" ] || continue
              # The SHORTEST match wins, which is the unqualified spelling: a .secboot or .ms
              # firmware refuses an unsigned image, and every such qualifier lengthens the
              # name. Glob order happens to deliver the same file and is not relied on.
              if [ -z "$ovmf_code" ] || [ "${#c}" -lt "${#ovmf_code}" ]; then
                ovmf_code="$c"
                ovmf_vars="$v"
              fi
            done
            [ -z "$ovmf_code" ] || break
          done
          if [ -z "$ovmf_code" ]; then
            echo "no OVMF_CODE*.fd beside a matching OVMF_VARS store under: $ovmf_dirs"
            echo "the ovmf package names those files, so a release that spells them otherwise"
            echo "needs its directory added above rather than a path corrected"
            exit 1
          fi
          echo "resolved firmware: $ovmf_code with $ovmf_vars"
          export KICKOS_OVMF_CODE="$ovmf_code"
          export KICKOS_OVMF_VARS="$ovmf_vars"
          cmake --preset qemu-x86_64
          cmake --build --preset qemu-x86_64
          out=$(ctest --preset qemu-x86_64 -LE tree --no-tests=error --output-on-failure 2>&1) \
            || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A SKIP IS NOT A PASS, and nothing in this selection is expected to skip: this board
          # is single-core, so cpu_id_fold takes its fold arm here and passes. This is the only
          # thing standing between a firmware or mtools gap and a green job that booted nothing.
          case "$out" in
            *Skipped*) echo "a gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          # Naming them turns a lost registration into a failure. All three are registered from
          # cmake/x86_64_boot.cmake, which CMakeLists.txt includes for this arch alone, so a
          # lost include de-registers them instead of failing them.
          tests/ci/ctest_named.sh 'x86_64_no_vector|x86_64_entry_cld|x86_64_no_got_selftest' \
            --preset qemu-x86_64 --no-tests=error --output-on-failure
          # The x86_64 microbench rides THIS job because the firmware pair resolved above is
          # what boots it, and that resolution is shell state of this step. QEMU_TIMEOUT is
          # restated per command: the job-level 30 above would override the bench gates' own
          # 240 DOWNWARD, and a bench image needs longer than any other gate here.
          cmake --preset qemu-x86_64-bench
          cmake --build --preset qemu-x86_64-bench
          # THE DETERMINISTIC ARMS OF THIS PRESET'S BENCH BLOCK AND NO OTHER. lock reads sample
          # counts and a nesting depth, cyccnt reads whether the counter moved, phase_table
          # counts the rows that arrived against the count the header declares, saturate feeds
          # the shipped accumulator fixed deltas and reads what each did, and irqspan_controls
          # is the IRQ gate's PARSER proven on planted reports with no image at all. None of
          # them reads a latency off this runner.
          #
          # `x86_64_bench_irqspan` is deliberately NOT here and the spelling above is why: as a
          # regex it would match the controls entry too, and the entry it names reads timing
          # distributions off a machine whose load nobody controls. That half is witnessed by
          # hand at each rebaseline.
          out=$(QEMU_TIMEOUT=240 tests/ci/ctest_named.sh 'x86_64_bench_lock|x86_64_bench_cyccnt|x86_64_bench_phase_table|x86_64_bench_saturate|x86_64_bench_irqspan_controls' \
            --test-dir build/qemu-x86_64-bench --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # Same reason as above, and it bites harder here: gate.sh skips an image gate when it
          # finds no firmware and again with no mtools, and ctest calls a skip a pass.
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Xtensa LX6 (esp32-wroom) gate: proves build/link/linker-script + windowed-ABI asm. It runs
  # the `host` label less the tree gates, which leaves the checks whose verdict is per-link or
  # per-preset. The selftest config is built too, for the wider link surface.
  xtensa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/xtensa-toolchain
      - name: xtensa lx6 (esp32-wroom) build gate
        run: |
          cmake --preset esp32-wroom -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom
          ctest --test-dir build/esp32-wroom -L host -LE tree --no-tests=error --output-on-failure
      - name: xtensa lx6 + selftest config
        run: |
          cmake --preset esp32-wroom-st -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom-st
          ctest --test-dir build/esp32-wroom-st -L host -LE tree --no-tests=error --output-on-failure
      - name: xtensa lx6 on both cores
        run: |
          cmake --preset esp32-wroom-smp -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom-smp
          ctest --test-dir build/esp32-wroom-smp -L host -LE tree --no-tests=error --output-on-failure
      - name: xtensa lx6 + bench config
        run: |
          cmake --preset esp32-wroom-bench -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom-bench
          ctest --test-dir build/esp32-wroom-bench -L host -LE tree --no-tests=error --output-on-failure

  # Build sweep of the remaining ARM boards (catches build/link/linker-script
  # regressions). The `host` label runs less the tree gates, which leaves every gate reading
  # this board's own configuration.
  build-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f-flat, f411disco-flat, blackpill-flat, bluepill-c8, picopi-flat,
                 f302nucleo, due, xmc4800-relax-flat, qemu-telem, teensy41-flat,
                 pizero2350-flat]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          # qemu-system-arm is here for the qemu-telem entry alone, and it is not optional:
          # without it the image arm below EXITS 77, ctest reports Skipped and returns 0, and
          # --no-tests=error does not fire because the test WAS found.
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      # -L host, not a bare ctest: qemu-telem registers the full QEMU boot suite, and a
      # suite whose every case skipped reads like a suite that ran.
      - run: ctest --test-dir build/${{ matrix.preset }} -L host -LE tree --no-tests=error --output-on-failure
      # And the one image arm -L host selects away. telemetry_qemu_contained is the only
      # witness that a contained refusal still emits its SWITCH record, and this job is the
      # only one that builds qemu-telem. ctest_named.sh stops a rename reading as a pass.
      - if: matrix.preset == 'qemu-telem'
        name: telemetry containment arm (-L host selects it away)
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: the arm below would SKIP and ctest would still exit 0"; exit 1; }
          out=$(tests/ci/ctest_named.sh telemetry_qemu_contained \
            --test-dir build/qemu-telem --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A SKIP IS NOT A PASS. ctest exits 0 on a skipped test, so the only thing that
          # separates "the witness ran" from "the witness was absent" is this.
          case "$out" in
            *Skipped*) echo "the containment arm SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # ARM MPU-ENFORCEMENT build gate: the enforcement-capable ARM boards (those shipping
  # arch/arm/chip/<chip>/mpu.cmake) on their base variant. The only job that builds the
  # enforcement-only link surface of the silicon boards: the .appdata/.appbss window and its
  # ASSERTs, the closed-set archive selectors, the grant symbols, and arch_reserved_blocks,
  # which an enforcing port must define itself or fail to link here.
  #
  # kernel_ctor_placement passes VACUOUSLY here: every app in this matrix links an empty
  # .kickos_app_init_array window, so the check takes its "window empty -> PASS" early-out.
  # It still proves the ctor-split section symbols EXIST.
  build-boards-mpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, pizero2350, teensy41,
                 xmc4800-relax, picopi]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} -LE tree --no-tests=error --output-on-failure

  # The RP2350 AMP presets, which nothing else in this file builds: the shared-image
  # scaffolding, then the own-image partition. The production step is that partition with the
  # self-test off, where the code the own-image paths call unconditionally must still compile.
  pizero2350-amp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - name: armv8-M shared-image AMP, the provisional scaffolding
        run: |
          # The tree's only rp2350 preset above one core, so rp_node_vectors is registered here
          # and nowhere else: each own-image node below is a one-core image.
          #
          # NO amp-pin.sh here. This variant states no AMP posture, so it names zero crossings
          # and the pin refuses it by design.
          cmake --preset pizero2350-amp -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset pizero2350-amp
          ctest --test-dir build/pizero2350-amp -L host -LE tree --no-tests=error --output-on-failure
          # Naming it turns a lost registration into a failure: the gate is keyed on the core count,
          # which a lost CORES_TWO de-registers instead of failing.
          tests/ci/ctest_named.sh '^rp_node_vectors$' \
            --test-dir build/pizero2350-amp --no-tests=error --output-on-failure
      - name: armv8-M own-image partition, both nodes, self-test on
        run: |
          for node in 0 1; do
            cmake --preset pizero2350-amp2-n$node -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
            cmake --build --preset pizero2350-amp2-n$node
            ctest --test-dir build/pizero2350-amp2-n$node -L host -LE tree --no-tests=error --output-on-failure
          done
      - name: armv8-M own-image partition, the PRODUCTION posture (self-test off)
        run: |
          # KICKOS_SHUTDOWN_TO_BOOTLOADER depends on the self-test, so with it off the amp2
          # defconfig's own line is refused and the request has to withdraw that knob too.
          #
          # Its own build directory: option() writes the cache once, so -D...=OFF into a tree
          # already configured with it ON changes nothing.
          #
          # Build only: a per-preset gate REBUILDS its preset name from board, variant and node
          # index, which this posture spells identically to the step above, so running the
          # gates here would measure that tree instead of this one.
          for node in 0 1; do
            cmake --preset pizero2350-amp2-n$node -B build/pizero2350-amp2-prod-n$node \
              -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN" \
              -DKICKOS_ENABLE_SELFTEST=OFF -DKICKOS_SHUTDOWN_TO_BOOTLOADER=OFF
            cmake --build build/pizero2350-amp2-prod-n$node
          done
      - name: armv8-M own-image partition, the MERGED artefact
        run: |
          # The thing a user flashes, and it is no ALL target: the step above builds two node
          # images and never the artefact that carries them, so nothing in CI linked the merge
          # until here. build-partition.sh configures and builds the peer out of node 0's own
          # tree, so this covers the peer configure, the Kconfig fingerprint agreement and the
          # merge in one step.
          cmake --build build/pizero2350-amp2-prod-n0 --target amp_partition
          ls -l build/pizero2350-amp2-prod-n0/kickos-partition.elf

  # The microbench presets. Nothing else in this file configures them apart from the rv32
  # qemu-riscv-bench line in the qemu-riscv job, and until this job existed not one bench arm
  # ran anywhere: the presets were built and their images never booted.
  #
  # THIS JOB SETS NO QEMU_TIMEOUT, unlike every other emulator job here. Each bench gate
  # carries its own bound (tests/integration/check_bench_*.sh: 150s for the per-core and
  # phase-table gates, 240s for the rest) because a bench image runs a quarter-million round
  # trips before the lines these gates read. A job-level value overrides those DOWNWARD and
  # the run then reads as an image that printed nothing.
  #
  # THE FOUR-CORE MARGIN IS THE RUNNER HAVING FOUR CORES TO ITSELF, and it is not large. A
  # four-hart sweep measures 32s to 85s per arm on a developer box against those bounds; the
  # same arms pinned to four host CPUs cost what they cost unpinned, and pinned to TWO they
  # overrun the bounds outright (per-core 156s against 150s, doorbell 246s against 240s). So an
  # arm of the four-core step below that starts failing on its bound rather than on its own
  # findings is the runner, and the answer is a longer bound in the gate, never a job-level
  # QEMU_TIMEOUT, which would cut every bound here DOWNWARD at once.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm qemu-system-misc curl xz-utils
      - uses: ./.github/actions/aarch64-toolchain
      - uses: ./.github/actions/riscv-toolchain
      - uses: ./.github/actions/arm-toolchain
      - name: the emulators every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
          command -v qemu-system-riscv64 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a and rv64 microbench at one core
        run: |
          # Naming them turns a lost registration into a failure. Each is needed: the switch line
          # comes from the bracket in the arch's switch.S, the phase table from
          # kernel/include/kickos/bench.h, the saturation column from the accumulator and the
          # authority arms from the bench syscalls, so no one of them shows another's failure.
          #
          # THE IRQ BLOCK IS DELIBERATELY ABSENT and is witnessed by hand at each rebaseline.
          # CI is a regression test, not a performance one: every arm of that gate reads a
          # timing distribution off a runner whose load it does not control, and the shared
          # runner is where an intermittent arm comes from.
          cmake --preset qemu-arm64-bench -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          cmake --build --preset qemu-arm64-bench
          tests/ci/ctest_named.sh 'qemu_arm64_bench_lock|qemu_arm64_bench_cyccnt|qemu_arm64_bench_saturate|qemu_arm64_bench_phase_table|qemu_arm64_benchauth|qemu_arm64_bench_a53_pmcr|qemu_arm64_bench_irqspan_controls' \
            --test-dir build/qemu-arm64-bench --no-tests=error --output-on-failure
          cmake --preset qemu-riscv64-bench -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv64-bench
          tests/ci/ctest_named.sh 'qemu_riscv64_bench_lock|qemu_riscv64_bench_cyccnt|qemu_riscv64_bench_saturate|qemu_riscv64_bench_phase_table|qemu_riscv64_benchauth|qemu_riscv64_bench_irqspan_controls' \
            --test-dir build/qemu-riscv64-bench --no-tests=error --output-on-failure
      - name: four-core microbench, the deterministic arms
        run: |
          # -L host SELECTS EVERY IMAGE GATE AWAY, so the second command of each pair is not a
          # refinement of the first: without it these presets boot nothing at all.
          # bench_percore and bench_doorbell are registered above one kernel core ONLY, so
          # until they were named here they ran nowhere in CI. The rest also run at one core in
          # the step above, and what four cores adds to them is what one core cannot spell: the
          # lock's WAIT slot, a phase row saturating on a bracket that closed against another
          # core's counter, and benchauth's doorbell arms reaching the real op instead of the
          # refusal a one-core build compiles in.
          #
          # NONE OF THEM READS A LATENCY. They count samples per core against the table's own
          # total, count arrived rows against the count the report's header declares, read two
          # fixed deltas back out of the shipped accumulator, ask whether the counter moved at
          # all, and assert the bench syscall's authority arms. Runner load moves no answer
          # any of that gives.
          #
          # THE IRQ BLOCK STAYS OUT at four cores as it does at one, and is witnessed by hand at
          # each rebaseline: every arm of it reads a timing distribution off a machine whose
          # load nobody controls. bench_irqspan_controls boots nothing and rides -L host above.
          cmake --preset qemu-arm64-benchsmp -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          cmake --build --preset qemu-arm64-benchsmp
          ctest --test-dir build/qemu-arm64-benchsmp -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'qemu_arm64_bench_percore|qemu_arm64_bench_doorbell|qemu_arm64_bench_lock|qemu_arm64_bench_cyccnt|qemu_arm64_bench_saturate|qemu_arm64_bench_phase_table|qemu_arm64_benchauth' \
            --test-dir build/qemu-arm64-benchsmp --no-tests=error --output-on-failure
          cmake --preset qemu-riscv64-benchsmp -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv64-benchsmp
          ctest --test-dir build/qemu-riscv64-benchsmp -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'qemu_riscv64_bench_percore|qemu_riscv64_bench_doorbell|qemu_riscv64_bench_lock|qemu_riscv64_bench_cyccnt|qemu_riscv64_bench_saturate|qemu_riscv64_bench_phase_table|qemu_riscv64_benchauth' \
            --test-dir build/qemu-riscv64-benchsmp --no-tests=error --output-on-failure
      - name: armv7m microbench, link surface only
        run: |
          # The only armv7m bench preset with percentiles: the other one, xmc4800-relax-bench,
          # declares KICKOS_CHIP_CYCCNT_GLITCHES and compiles the histogram out. No emulator
          # boots this board, so its figures come off the bench and never from here.
          cmake --preset f411disco-bench -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset f411disco-bench
          ctest --test-dir build/f411disco-bench -LE tree --no-tests=error --output-on-failure
