#
# Build, host and QEMU checks; hardware testing is separate.
# Use ctest_named.sh to require every named test to remain registered.
# CTest treats skipped tests as success, so image jobs check their prerequisites.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual per-branch run: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per KickOS toolchain family (conan/toolchain): when the cache, keyed on the recipe's
  # files, lacks the family, it restores it from the release toolchain-<version>, or else builds
  # it and uploads the archive as an artifact for that release. The jobs below restore it from
  # the cache rather than build it inside their own timeout. A job needs only the families it
  # builds with.
  #
  # Build or restore arm-none-eabi, the family every Cortex-M board builds with.
  toolchain-arm-none-eabi:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
          build: "true"

  # Build or restore aarch64-none-elf, the family the QEMU virt and i.MX 8M Plus boards build with.
  toolchain-aarch64-none-elf:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
          build: "true"

  # Build or restore riscv64-none-elf, whose multilibs every RV32 and RV64 board builds with.
  toolchain-riscv64-none-elf:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
          build: "true"

  # Build or restore x86_64-elf, the family the q35 board builds with.
  toolchain-x86_64-elf:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: x86_64-elf
          build: "true"

  # Build or restore xtensa-esp32-elf, the family the ESP32 builds with. Espressif's sources are
  # git snapshots, without the parsers a release tarball ships generated.
  toolchain-xtensa-esp32-elf:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2 flex bison
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: xtensa-esp32-elf
          build: "true"

  # Build or restore rx-elf, the family the RX72M builds with. The RX patches, in
  # conan/toolchain/patches, carry the parsers they change generated.
  toolchain-rx-elf:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: rx-elf
          build: "true"

  # Run source-only checks once. Other jobs exclude the tree label.
  code-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      - run: cmake --preset sim
      - run: ctest --preset sim -L tree --no-tests=error --output-on-failure
      - name: the description, composition and judge gates, by name
        run: |
          tests/ci/ctest_named.sh '^app_judges$|^amp_share$|^chip_kconfig$|^chip_protection$|^platform_descriptions$|^platform_compositions$|^platform_arms$|^platform_coverage$|^platform_tables$|^no_eh_runtime_controls$' \
            --preset sim -L tree --no-tests=error --output-on-failure

  # Run the host suite, excluding the source-only checks above.
  sim:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # Require GTest before configuration so unit tests cannot be silently disabled.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build --preset sim
      - run: ctest --preset sim -LE tree --no-tests=error --output-on-failure
      - name: the AMP share, partition gate, RAM owner and alias host units, by name
        run: |
          tests/ci/ctest_named.sh 'AmpShare\.|AmpShareWindow\.|AmpShareType\.|cached_AmpShareType\.|C6Apm\.|Rp2350Gate\.|OwnerInstances\.|AliasSync\.' \
            --preset sim --no-tests=error --output-on-failure
      # Build every unit test at the telemetry posture, so each one links there, and run only
      # the two additional telemetry checks. The main sim build runs the unit tests.
      - name: the ch1 trace decoder gates (sim-telem)
        run: |
          cmake --preset sim-telem -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
          cmake --build --preset sim-telem
          tests/ci/ctest_named.sh 'telemetry_ring_wrap|telemetry_structural' \
            --preset sim-telem --no-tests=error --output-on-failure

  # Run sim with UBSan and stop on the first error.
  # ASan needs fiber-switch annotations for the sim's ucontext stacks.
  # Set flags in the environment so oot_export's child CMake also links UBSan.
  sim-ubsan:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
      CXXFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # Conan builds GTest without this job's sanitizer flags.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -B build/sim-ubsan -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build build/sim-ubsan
      - run: ctest --test-dir build/sim-ubsan -LE tree --no-tests=error --output-on-failure

  # Build and boot the Cortex-M boards QEMU runs: the four MPS2 machines, enforcing and flat,
  # and the micro:bit.
  qemu-arm:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    # Allow timeout headroom for loaded runners. These QEMU targets use a coarse
    # semihosting clock; arch_idle_wait spins to keep it advancing.
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
      # These images run until poll_image stops them.
      POLLED: "hello|fp_switch|mpu_fault|reclaimwit_park"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      # Retry only polled ARM gates: the coarse clock and runner load can delay output.
      # Each attempt still has its own timeout.
      - name: armv7m (mps2-an386)
        run: |
          cmake --preset qemu
          cmake --build --preset qemu
          ctest --preset qemu -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" --preset qemu --no-tests=error --output-on-failure --repeat until-pass:2
          # Require both tests, which are registered only when MPU enforcement is enabled.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh '^qemu_sysdefault$|qemu_sysdefault_spin|qemu_sysdefault_fault|qemu_sysdefault_no_eh_runtime|qemu_sysdefault_no_driver_path|^qemu_cxxterm$|qemu_cxxterm_eh_control|qemu_nvic' --preset qemu --no-tests=error --output-on-failure
      # Cover PMSAv8 on M33, the larger M7 MPU, and the soft-float M3 switch path.
      - name: armv8-m mainline (mps2-an505, Cortex-M33)
        run: |
          cmake --preset qemu-m33
          cmake --build --preset qemu-m33
          ctest --preset qemu-m33 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh '^qemu_m33_sysdefault$|qemu_m33_sysdefault_spin|qemu_m33_sysdefault_fault|qemu_m33_sysdefault_no_eh_runtime|qemu_m33_sysdefault_no_driver_path|^qemu_m33_cxxterm$|qemu_m33_cxxterm_eh_control|qemu_m33_nvic' --preset qemu-m33 --no-tests=error --output-on-failure
      - name: armv7m (mps2-an500, Cortex-M7)
        run: |
          cmake --preset qemu-m7
          cmake --build --preset qemu-m7
          ctest --preset qemu-m7 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh '^qemu_m7_sysdefault$|qemu_m7_sysdefault_spin|qemu_m7_sysdefault_fault|qemu_m7_sysdefault_no_eh_runtime|qemu_m7_sysdefault_no_driver_path|^qemu_m7_cxxterm$|qemu_m7_cxxterm_eh_control|qemu_m7_nvic' --preset qemu-m7 --no-tests=error --output-on-failure
      - name: armv7m soft-float (mps2-an385, Cortex-M3)
        run: |
          cmake --preset qemu-m3
          cmake --build --preset qemu-m3
          ctest --preset qemu-m3 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          # The soft-float M3 does not register fp_switch.
          tests/ci/ctest_named.sh 'hello|mpu_fault|reclaimwit_park' \
            --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:2
          # Require the board-specific diagnostic-format test to remain registered.
          tests/ci/ctest_named.sh '^qemu_m3_diag_terse$|^qemu_m3_sysdefault$|qemu_m3_sysdefault_spin|qemu_m3_sysdefault_fault|qemu_m3_sysdefault_no_eh_runtime|qemu_m3_sysdefault_no_driver_path|^qemu_m3_cxxterm$|qemu_m3_cxxterm_eh_control|qemu_m3_nvic' --preset qemu-m3 --no-tests=error --output-on-failure
      # Test privilege rings with MPU enforcement disabled.
      - name: ARM ring-only run gates (no PMSA enforcement)
        run: |
          # Flat builds do not register mpu_fault or rootfault.
          for b in qemu qemu-m33 qemu-m7 qemu-m3; do
            if [ "$b" = qemu-m3 ]; then
              flat_polled='hello|reclaimwit_park'
            else
              flat_polled='hello|fp_switch|reclaimwit_park'
            fi
            cmake --preset "$b-flat"
            cmake --build --preset "$b-flat"
            ctest --preset "$b-flat" -E "$POLLED" -LE tree --no-tests=error --output-on-failure
            tests/ci/ctest_named.sh "$flat_polled" \
              --preset "$b-flat" --no-tests=error --output-on-failure --repeat until-pass:2
            t=$(printf '%s' "$b" | tr - _)
            tests/ci/ctest_named.sh "^${t}_sysdefault\$|${t}_sysdefault_spin|${t}_sysdefault_fault|${t}_sysdefault_no_eh_runtime|${t}_sysdefault_no_driver_path|^${t}_cxxterm\$|${t}_cxxterm_eh_control|${t}_nvic" \
              --preset "$b-flat" --no-tests=error --output-on-failure
            # The flat M3 build also registers the diagnostic-format test.
            if [ "$b" = qemu-m3 ]; then
              tests/ci/ctest_named.sh '^qemu_m3_diag_terse$' --preset "$b-flat" --no-tests=error --output-on-failure
            fi
          done
      - name: armv6m (microbit)
        run: |
          cmake --preset microbit
          cmake --build --preset microbit
          ctest --preset microbit -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          # The Cortex-M0 has no FPU or MPU, so those tests are absent.
          tests/ci/ctest_named.sh 'hello|reclaimwit_park' \
            --preset microbit --no-tests=error --output-on-failure --repeat until-pass:2
          # Require the stack-block test for this non-enforcing board, the default system's checks
          # and the emulated SRAM's.
          tests/ci/ctest_named.sh '^microbit_pspguard_block$|^microbit_sysdefault$|microbit_sysdefault_spin|microbit_sysdefault_no_eh_runtime|microbit_sysdefault_no_driver_path' --preset microbit --no-tests=error --output-on-failure

  # Ubuntu includes qemu-system-aarch64 in qemu-system-arm.
  qemu-arm64:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt, Cortex-A53)
        run: |
          cmake --preset qemu-arm64
          cmake --build --preset qemu-arm64
          ctest --preset qemu-arm64 -LE tree --no-tests=error --output-on-failure
          # Require the kernel-stack and TLS tests for this architecture, and the default system's.
          out=$(tests/ci/ctest_named.sh 'death_stack_seating|no_privileged_tls|qemu_arm64_tlsprobe|qemu_arm64_sysdefault_no_eh_runtime|qemu_arm64_sysdefault_no_driver_path|^qemu_arm64_sysdefault$|qemu_arm64_sysdefault_spin|qemu_arm64_sysdefault_fault|qemu_arm64_system_link_none|qemu_arm64_system_link_two|qemu_arm64_system_link_entry|qemu_arm64_system_link_refused|qemu_arm64_system_link_notool|qemu_arm64_system_link_nocc|qemu_arm64_system_link_rerun|qemu_arm64_system_link_noheap|qemu_arm64_system_link_stack' \
            --preset qemu-arm64 --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a required gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      # The runner has no i.MX 8M Plus emulator. Check the build and host tests only.
      - name: armv8a (NXP i.MX 8M Plus EVK) link surface
        run: |
          cmake --preset imx8mp-evk
          cmake --build --preset imx8mp-evk
          ctest --preset imx8mp-evk -L host -LE tree --no-tests=error --output-on-failure
          out=$(tests/ci/ctest_named.sh 'imx8mp_evk_sysdefault_no_eh_runtime|imx8mp_evk_sysdefault_no_driver_path|imx8mp_evk_system_link_none|imx8mp_evk_system_link_two' \
            --preset imx8mp-evk --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a system link gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Four-core AArch64 with and without core isolation. Check the configured
  # isolation mask directly: the expected-skip list is derived from it and
  # cannot detect its accidental removal. The four-core build also runs the golden
  # system, its restart witness with the init's stack depth, the line taker, the driver
  # restart witness and the console restart witness.
  qemu-arm64-smp:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) four cores
        run: |
          cmake --preset qemu-arm64-smp
          cmake --build --preset qemu-arm64-smp
          ctest --preset qemu-arm64-smp -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on the configured core count, and the default system's.
          out=$(tests/ci/ctest_named.sh 'qemu_arm64_smp_arrival|qemu_arm64_smp_doorbell|qemu_arm64_smp_threads|qemu_arm64_slaypeer|qemu_arm64_golden_system|qemu_arm64_restart_witness|qemu_arm64_line_taker|qemu_arm64_driver_restart|qemu_arm64_driver_line|qemu_arm64_console_restart|^qemu_arm64_sysdefault$|qemu_arm64_sysdefault_spin|qemu_arm64_sysdefault_fault|qemu_arm64_system_link_none|qemu_arm64_system_link_two|qemu_arm64_system_link_entry|qemu_arm64_system_link_refused|qemu_arm64_system_link_notool|qemu_arm64_system_link_nocc|qemu_arm64_system_link_rerun|qemu_arm64_system_link_noheap|qemu_arm64_system_link_stack' \
            --preset qemu-arm64-smp --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a required gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      - name: armv8a (virt) four cores, core 3 isolated
        run: |
          cmake --preset qemu-arm64-smpiso
          # Check the resolved isolation mask independently of the expected-skip list.
          iso=$(sed -n 's/^#define KICKOS_ISOLATED_CORES //p' \
                build/qemu-arm64-smpiso/generated/include/kickos/board_config.h)
          if [ -z "$iso" ] || [ "$((iso))" -eq 0 ]; then
            echo "smpiso resolved KICKOS_ISOLATED_CORES='$iso': this step would re-run the plain SMP posture"
            exit 1
          fi
          cmake --build --preset qemu-arm64-smpiso
          ctest --preset qemu-arm64-smpiso -LE tree --no-tests=error --output-on-failure
          out=$(tests/ci/ctest_named.sh 'isolated_cores|qemu_arm64_selftest|^qemu_arm64_sysdefault$|qemu_arm64_sysdefault_spin|qemu_arm64_sysdefault_fault|qemu_arm64_system_link_none|qemu_arm64_system_link_two|qemu_arm64_system_link_entry|qemu_arm64_system_link_refused|qemu_arm64_system_link_notool|qemu_arm64_system_link_nocc|qemu_arm64_system_link_rerun|qemu_arm64_system_link_noheap|qemu_arm64_system_link_stack' \
            --preset qemu-arm64-smpiso --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a required gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Exercise shared-kernel GICv3 doorbells. The other SMP job uses GICv2;
  # AMP builds use one kernel core and cannot cover this path.
  qemu-arm64-gicv3:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) four cores under a GICv3
        run: |
          cmake --preset qemu-arm64-gicv3
          # Require GICv3 so this cannot silently duplicate the GICv2 job.
          gic=$(sed -n 's/^#define KICKOS_ARM64_GIC_VERSION //p' \
                build/qemu-arm64-gicv3/generated/include/kickos/board_config.h)
          if [ -z "$gic" ] || [ "$((gic))" -ne 3 ]; then
            echo "gicv3 resolved KICKOS_ARM64_GIC_VERSION='$gic': this step would re-run the GICv2 posture"
            exit 1
          fi
          cmake --build --preset qemu-arm64-gicv3
          ctest --preset qemu-arm64-gicv3 -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on the configured kernel-core count, and the default system's.
          out=$(tests/ci/ctest_named.sh 'qemu_arm64_smp_arrival|qemu_arm64_smp_doorbell|qemu_arm64_smp_threads|qemu_arm64_slaypeer|^qemu_arm64_sysdefault$|qemu_arm64_sysdefault_spin|qemu_arm64_sysdefault_fault|qemu_arm64_system_link_none|qemu_arm64_system_link_two|qemu_arm64_system_link_entry|qemu_arm64_system_link_refused|qemu_arm64_system_link_notool|qemu_arm64_system_link_nocc|qemu_arm64_system_link_rerun|qemu_arm64_system_link_noheap|qemu_arm64_system_link_stack' \
            --preset qemu-arm64-gicv3 --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a required gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Test shared-image AMP indexing, separate-image bounds, two running kernels, and three running
  # kernels over a cached share.
  # Do not retry: console interleaving and publication races must remain visible.
  qemu-arm64-amp:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
