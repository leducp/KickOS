# Copyright (c) 2026 Philippe Leduc
# KickOS CI: the deterministic, host-runnable green gates (docs/m2-readiness.md #6).
# Every job mirrors a `--preset` invocation. Every gate here is host or QEMU; a port's
# hardware status has one home, docs/reference/boards.md.
#
# ISA coverage: sim (host), armv7m + armv6m + armv8m (QEMU run), armv8a (QEMU run, the
# qemu-arm64 job), rv32imac (QEMU run, plain and under PMP), Xtensa LX6 (build-only).
# NOT COVERED HERE: rv64imac has no job at all, so qemu-riscv64 and qemu-riscv64-sv48 run
# locally only; the riscv-toolchain action already supplies their compiler, so the gap is a
# decision nobody has taken (docs/reference/boards.md, "CI coverage").
#
# MPU enforcement runs at RUNTIME on all three ISA families: sim (host mprotect),
# rv32imac (PMP, qemu-riscv-mpu), ARM on both PMSA revisions (the four mps2 run gates
# in qemu-arm). It is the BASE variant of every board that can enforce, so a preset
# names it and no -D flips it; the non-enforcing posture has its own `-flat` presets,
# which is what the ring-only gates run on. build-boards-mpu covers the chip-specific
# backends (SYSMPU, the M7 anti-speculation wrap, PMSAv6) as link surface.
#
# Warnings-as-errors rides EVERY job with no flag (KICKOS_WERROR defaults ON for any
# in-tree build; see cmake/kickos.cmake, incl. the -DKICKOS_WERROR=OFF escape).
# UBSan rides the sim alone.
#
# Toolchains are the SAME pinned vendor tarballs used locally (reproducibility): the
# official Arm GNU Toolchain (arm-none-eabi, newlib), the RISCstar toolchain
# (riscv32-none-elf, newlib, rv32imac soft-float multilib), and Espressif's
# crosstool-NG Xtensa build. All downloaded + cached. The sim job uses the host g++.
#
# Each pin (and the reason for it) lives in the composite action that uses it, under
# .github/actions/<name>: arm-toolchain, riscv-toolchain, xtensa-toolchain, kconfiglib.
# A job asks for one by name and gets the cache, the fetch and the exported
# KICKOS_*_BIN / KICKOS_KCONFIG_PY; the version is stated in exactly one place.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual per-branch run: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Authoritative deterministic gate: the full ctest suite on the host sim.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # Before the configure, and NOT optional: KICKOS_BUILD_UNIT_TESTS defaults to whether
      # find_package(GTest) succeeded, and a run with the whole host unit layer dropped still
      # reports green.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build --preset sim
      - run: ctest --preset sim --no-tests=error --output-on-failure

  # The sim gate rebuilt under UndefinedBehaviorSanitizer. -fno-sanitize-recover=all
  # is what makes it a GATE: UBSan's default is print-and-continue, exit status 0.
  #
  # UBSan only. Do NOT add -fsanitize=address: the sim switches threads with
  # ucontext, and without __sanitizer_start/finish_switch_fiber annotations ASan
  # treats each new stack as a wild region and the sim hangs.
  #
  # Flags via the CFLAGS/CXXFLAGS ENVIRONMENT, at JOB level, not -DCMAKE_C/CXX_FLAGS
  # on the configure step: the oot_export test's child cmake (spawned by the CTEST
  # step) inherits the environment but never a -D, and would otherwise link
  # instrumented archives without the UBSan runtime (undefined __ubsan_handle_*).
  #
  # A separate binaryDir (-B) keeps the instrumented tree out of the plain `sim`
  # preset's build/sim.
  sim-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
      CXXFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # GTest itself is built by Conan WITHOUT the job's CFLAGS (Conan uses its own profile),
      # so the instrumented tree links an uninstrumented gtest.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -B build/sim-ubsan -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build build/sim-ubsan
      - run: ctest --test-dir build/sim-ubsan --no-tests=error --output-on-failure

  # armv7m (mps2-an386) + armv6m (microbit) under QEMU, on the pinned Arm GNU toolchain.
  qemu-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The mps2/nrf51 QEMU targets clock off semihosting SYS_CLOCK, which QEMU <= 10
    # (ubuntu-latest ships 8.2) freezes while the core is halted in WFI, so a timed
    # sleep with every thread idle never wakes. The arch idle path spins on these
    # QEMU-only chips to keep the clock advancing (see arch_idle_wait). This timeout
    # is failure headroom on a loaded runner; passing gates exit early.
    env:
      QEMU_TIMEOUT: "30"
      # The gates whose image never exits, so they go through poll_image (tests/lib/gate.sh).
      POLLED: "hello|fp_switch|mpu_fault|rootfault|reclaimwit_park"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      # --repeat until-pass:2 rides the POLLED gates and NOTHING else. The mps2/nrf51
      # clock is the ~100 Hz semihosting SYS_CLOCK (chip_mps2.cc arch_clock_now, DWT
      # frozen), so every timed sleep before an awaited line is stretched to a 10 ms
      # granule and a loaded runner can push the last pattern past the poll bound. A real
      # hang still fails, each attempt being bounded by the gate's own timeout.
      - name: armv7m (mps2-an386)
        run: |
          cmake --preset qemu -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu
          ctest --preset qemu -E "$POLLED" --no-tests=error --output-on-failure
          ctest --preset qemu -R "$POLLED" --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin. Those two gates are REGISTERED only when the enforcing posture in
          # this board's base defconfig resolves on, so naming them makes an empty selection
          # the failure (--no-tests=error); the -R "$POLLED" run above matches hello either
          # way and stays green.
          ctest --preset qemu -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:2
      # The M33 is armv8-M (PMSAv8, a different register layout), the M7 has 16 MPU regions
      # to the M4's 8, and the M3 is soft-float, so the soft-float switch path runs there.
      - name: armv8-m mainline (mps2-an505, Cortex-M33)
        run: |
          cmake --preset qemu-m33 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m33
          ctest --preset qemu-m33 -E "$POLLED" --no-tests=error --output-on-failure
          ctest --preset qemu-m33 -R "$POLLED" --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin, as on the an386: this board carries its own base defconfig, so it
          # needs its own pin.
          ctest --preset qemu-m33 -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:2
      - name: armv7m (mps2-an500, Cortex-M7)
        run: |
          cmake --preset qemu-m7 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m7
          ctest --preset qemu-m7 -E "$POLLED" --no-tests=error --output-on-failure
          ctest --preset qemu-m7 -R "$POLLED" --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin, as on the an386: this board carries its own base defconfig, so it
          # needs its own pin.
          ctest --preset qemu-m7 -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:2
      - name: armv7m soft-float (mps2-an385, Cortex-M3)
        run: |
          cmake --preset qemu-m3 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m3
          ctest --preset qemu-m3 -E "$POLLED" --no-tests=error --output-on-failure
          ctest --preset qemu-m3 -R "$POLLED" --no-tests=error --output-on-failure --repeat until-pass:2
          # Posture pin, as on the an386: this board carries its own base defconfig, so it
          # needs its own pin.
          ctest --preset qemu-m3 -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:2
      # The ring-only posture of the same four boards, which is what ringpriv and
      # ringppb assert against: the privilege ring holds on its own.
      - name: ARM ring-only run gates (no PMSA enforcement)
        run: |
          for b in qemu qemu-m33 qemu-m7 qemu-m3; do
            cmake --preset "$b-flat" -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
            cmake --build --preset "$b-flat"
            ctest --preset "$b-flat" -E "$POLLED" --no-tests=error --output-on-failure
            ctest --preset "$b-flat" -R "$POLLED" --no-tests=error --output-on-failure --repeat until-pass:2
          done
      - name: armv6m (microbit)
        run: |
          cmake --preset microbit -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset microbit
          ctest --preset microbit -E "$POLLED" --no-tests=error --output-on-failure
          ctest --preset microbit -R "$POLLED" --no-tests=error --output-on-failure --repeat until-pass:2
          # PINS THE REGISTRATION, not just the result. microbit is the only CI board that
          # carves kernel blocks WITHOUT enforcing, so it is the only one where the block
          # leg's room bound is reachable from a thread; a condition that stopped registering
          # this arm would leave the suite one test shorter and still green.
          ctest --preset microbit -R '^microbit_pspguard_block$' --no-tests=error --output-on-failure

  # armv8a (virt) under QEMU: the first 64-bit ISA, a Cortex-A53 at EL1 with an unprivileged
  # EL0 and a 1:1 map. The generic timer keeps counting in WFI, so a timed sleep advances
  # with every thread idle and QEMU_TIMEOUT is failure headroom rather than a clock crutch.
  # qemu-system-aarch64 ships in the qemu-system-arm package on Ubuntu.
  qemu-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/aarch64-toolchain
      - name: armv8a (virt, Cortex-A53)
        run: |
          cmake --preset qemu-arm64 -DKICKOS_AARCH64_TOOLCHAIN_BIN="$KICKOS_AARCH64_TOOLCHAIN_BIN"
          cmake --build --preset qemu-arm64
          ctest --preset qemu-arm64 --no-tests=error --output-on-failure
          # Capability pin, not just a result: armv8a selects both kernel-stack symbols and
          # TLS, so these three gates are what hold the backend to those promises. Naming
          # them makes an empty selection the failure rather than a silent de-registration.
          ctest --preset qemu-arm64 --no-tests=error --output-on-failure \
            -R 'death_stack_seating|no_privileged_tls|qemu_arm64_tlsprobe'

  # rv32imac (virt) under QEMU, plus build-only checks of three more rv32 presets,
  # on the pinned RISCstar toolchain (newlib, soft-float rv32imac/ilp32 multilib).
  # RISC-V clocks off the CLINT mtime, which keeps ticking during WFI, so a timed sleep
  # advances with every thread idle. QEMU_TIMEOUT is failure headroom.
  qemu-riscv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      # The ring-only posture: this board's flat variant is what the freestanding
      # PMP-less hello and cxxtest gates are registered on.
      - name: rv32imac (virt) run gate, no PMP enforcement
        run: |
          cmake --preset qemu-riscv-flat -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-flat
          ctest --preset qemu-riscv-flat --no-tests=error --output-on-failure
      # -L host is the gate set that executes no image (tests/static/test_classes.txt).
      - name: build-only rv32 boards
        run: |
          cmake --preset esp32c6-wroom -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom
          ctest --test-dir build/esp32c6-wroom -L host --no-tests=error --output-on-failure
          cmake --preset esp32c6-wroom-flat -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom-flat
          ctest --test-dir build/esp32c6-wroom-flat -L host --no-tests=error --output-on-failure
          cmake --preset qemu-riscv-bench -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-bench
          ctest --test-dir build/qemu-riscv-bench -L host --no-tests=error --output-on-failure

  # rv32imac (virt) UNDER PMP ENFORCEMENT, which is this board's base variant: runs the full-C++
  # throw under PMP + the gp-in-appdata CI gates (riscv_no_smalldata, qemu_riscv_cxxtest,
  # qemu_riscv_mpu_fault; see docs/design-riscv-gp-split.md and docs/design-cxx-under-mpu.md).
  # Deterministic (~3s). Same RISCstar toolchain as the non-enforcement job.
  qemu-riscv-mpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      - name: rv32imac (virt) enforcement gate
        run: |
          cmake --preset qemu-riscv -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv
          ctest --preset qemu-riscv --no-tests=error --output-on-failure
          # Posture pin, as in qemu-arm: PMP enforcement is a line in this board's base
          # defconfig, and dropping it de-registers these gates instead of failing them.
          ctest --preset qemu-riscv -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure

  # Xtensa LX6 (esp32-wroom) gate: proves build/link/linker-script + windowed-ABI asm.
  # It runs the `host` label: seam_defaults and class_backend, whose verdict is PER-LINK,
  # plus cpu_id_fold, c_headers and test_labels, which read THIS tree (the generated
  # board_config.h, this board's C compiler and include roots, this build's own test
  # registrations). The selftest config is built too, for the wider link surface.
  xtensa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/xtensa-toolchain
      - name: xtensa lx6 (esp32-wroom) build gate
        run: |
          cmake --preset esp32-wroom -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom
          ctest --test-dir build/esp32-wroom -L host --no-tests=error --output-on-failure
      - name: xtensa lx6 + selftest config
        run: |
          cmake --preset esp32-wroom-st -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom-st
          ctest --test-dir build/esp32-wroom-st -L host --no-tests=error --output-on-failure

  # Build sweep of the remaining ARM boards (catches build/link/linker-script
  # regressions). The `host` label runs, which is every gate reading this board's own tree.
  build-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f-flat, f411disco-flat, blackpill-flat, bluepill-c8, picopi-flat,
                 f302nucleo, due, xmc4800-relax-flat, qemu-telem, teensy41-flat,
                 pizero2350-flat]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          # qemu-system-arm is here for the qemu-telem entry alone, and it is not optional:
          # without it the image arm below EXITS 77, ctest reports Skipped and returns 0, and
          # --no-tests=error does not fire because the test WAS found.
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      # -L host, not a bare ctest: qemu-telem registers the full QEMU boot suite, and a
      # suite whose every case skipped reads like a suite that ran.
      - run: ctest --test-dir build/${{ matrix.preset }} -L host --no-tests=error --output-on-failure
      # AND THE ONE IMAGE ARM -L host SELECTS AWAY. telemetry_qemu_contained is the only
      # witness that a contained refusal still emits its SWITCH record, so the decoder's
      # chain check keeps covering it; -L host selects ZERO image tests and this job is the
      # only one that builds qemu-telem. --no-tests=error is what stops a rename from
      # reading as a pass.
      - if: matrix.preset == 'qemu-telem'
        name: telemetry containment arm (-L host selects it away)
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: the arm below would SKIP and ctest would still exit 0"; exit 1; }
          out=$(ctest --test-dir build/qemu-telem -R telemetry_qemu_contained \
                      --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A SKIP IS NOT A PASS. ctest exits 0 on a skipped test, so the only thing that
          # separates "the witness ran" from "the witness was absent" is this.
          case "$out" in
            *Skipped*) echo "the containment arm SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # ARM MPU-ENFORCEMENT build gate: the enforcement-capable ARM boards (those
  # shipping arch/arm/chip/<chip>/mpu.cmake) on their base variant, which states the
  # enforcing posture because that is the posture they ship. The only job
  # that builds the enforcement-only link surface of the silicon boards: the
  # .appdata/.appbss window and its ASSERTs, the closed-set archive selectors, the
  # grant symbols, and arch_reserved_blocks, which an enforcing port must define itself
  # or fail to link here.
  #
  # kernel_ctor_placement passes VACUOUSLY here: every app in this matrix links an
  # empty .kickos_app_init_array window, so the check takes its "window empty -> PASS"
  # early-out. It still proves the ctor-split section symbols EXIST, failing loudly
  # when they do not.
  #
  # The bare ctest (no -R) is what gives oot_export_mcu its teeth. It is registered on
  # pizero2350 as well as qemu, and only the pizero2350 run can catch a descriptor bake
  # that writes nothing: qemu is one of the four mps2 boards that state their own
  # KICKOS_MCPU, so its shipped board.cmake is complete either way, while pizero2350
  # leaves the core to the chip. The gate installs the package and cross-builds an
  # out-of-tree app with the shipped toolchain, which this job already has.
  build-boards-mpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, pizero2350, teensy41,
                 xmc4800-relax, picopi]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --no-tests=error --output-on-failure
