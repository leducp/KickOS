# SPDX-License-Identifier: CECILL-C
# KickOS CI: the deterministic, host-runnable green gates (docs/m2-readiness.md #6).
# Every job mirrors a `--preset` invocation. Nothing here runs on silicon; a port's
# hardware status has one home, docs/reference/boards.md.
#
# ISA coverage: sim (host), armv7m + armv6m + armv8m (QEMU run), rv32imac (QEMU run,
# plain and under PMP), Xtensa LX6 (build-only). Renesas RX has no gate: RX72M needs
# -misa=v3/-mdfpu, which exist only in the registration-gated Renesas GNURX build.
#
# MPU enforcement runs at RUNTIME on all three ISA families: sim (host mprotect),
# rv32imac (PMP, qemu-riscv-mpu), ARM on both PMSA revisions (the four mps2 run gates
# in qemu-arm). It is the BASE variant of every board that can enforce, so a preset
# names it and no -D flips it; the non-enforcing posture has its own `-flat` presets,
# which is what the ring-only gates run on. build-boards-mpu is the only coverage of
# the chip-specific backends QEMU has no model for (SYSMPU, the M7 anti-speculation
# wrap, PMSAv6): link surface only, never the trap.
#
# Warnings-as-errors rides EVERY job with no flag (KICKOS_WERROR defaults ON for any
# in-tree build; see cmake/kickos.cmake, incl. the -DKICKOS_WERROR=OFF escape).
# UBSan is the sim alone: there is no bare-metal sanitizer runtime to link against.
#
# Toolchains are the SAME pinned vendor tarballs used locally (reproducibility): the
# official Arm GNU Toolchain (arm-none-eabi, newlib), the RISCstar toolchain
# (riscv32-none-elf, newlib, rv32imac soft-float multilib), and Espressif's
# crosstool-NG Xtensa build. All downloaded + cached; no apt gcc-arm-none-eabi /
# xPack. The sim job uses the host g++.
#
# Each pin (and the reason for it) lives in the composite action that uses it, under
# .github/actions/<name>: arm-toolchain, riscv-toolchain, xtensa-toolchain, kconfiglib.
# A job asks for one by name and gets the cache, the fetch and the exported
# KICKOS_*_BIN / KICKOS_KCONFIG_PY; the version is stated in exactly one place.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual per-branch run (`gh workflow run ci.yml --ref <branch>`): push is
  # master-only and a feature branch fires nothing until a PR opens.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Authoritative deterministic gate: the full ctest suite on the host sim.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      # Before the configure, and NOT optional: KICKOS_BUILD_UNIT_TESTS defaults to whether
      # find_package(GTest) succeeded, so a runner without it drops the whole host unit layer
      # and still reports green.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build --preset sim
      - run: ctest --preset sim --no-tests=error --output-on-failure

  # The sim gate rebuilt under UndefinedBehaviorSanitizer. -fno-sanitize-recover=all
  # is what makes it a GATE: UBSan's default is print-and-continue, exit status 0.
  #
  # UBSan only. Do NOT add -fsanitize=address: the sim switches threads with
  # ucontext, and without __sanitizer_start/finish_switch_fiber annotations ASan
  # treats each new stack as a wild region and the sim hangs. UBSan intercepts no
  # stacks and needs nothing from the context switch.
  #
  # Flags via the CFLAGS/CXXFLAGS ENVIRONMENT, at JOB level, not -DCMAKE_C/CXX_FLAGS
  # on the configure step: the oot_export test's child cmake (spawned by the CTEST
  # step) inherits the environment but never a -D, and would otherwise link
  # instrumented archives without the UBSan runtime (undefined __ubsan_handle_*).
  #
  # A separate binaryDir (-B) keeps the instrumented tree out of the plain `sim`
  # preset's build/sim; ctest is driven by --test-dir (no sanitizer test preset).
  sim-ubsan:
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
      CXXFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      # GTest itself is built by Conan WITHOUT the job's CFLAGS (Conan uses its own profile),
      # so the instrumented tree links an uninstrumented gtest. That is the same arrangement
      # every UBSan build has with libstdc++ and it is what keeps the subject instrumented.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -B build/sim-ubsan -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build build/sim-ubsan
      - run: ctest --test-dir build/sim-ubsan --no-tests=error --output-on-failure

  # armv7m (mps2-an386) + armv6m (microbit) under QEMU, on the pinned Arm GNU toolchain.
  qemu-arm:
    runs-on: ubuntu-latest
    # The mps2/nrf51 QEMU targets clock off semihosting SYS_CLOCK, which QEMU <= 10
    # (ubuntu-latest ships 8.2) freezes while the core is halted in WFI, so a timed
    # sleep with every thread idle never wakes. The arch idle path spins on these
    # QEMU-only chips to keep the clock advancing (see arch_idle_wait). This timeout
    # is failure headroom on a loaded runner; passing gates exit early.
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install QEMU + build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      # --repeat until-pass:4: the mps2 QEMU timer is coarse (DWT frozen; ~100 Hz
      # semihosting clock), so the run gates can transiently miss their output
      # window under CI-host load. Retry rides that out; a real hang still fails
      # (each attempt is bounded by the gate's own timeout).
      # ARM MPU enforcement at RUNTIME, which is what the base variant of these four
      # boards states: the full TAP suite as unprivileged threads plus a real MemManage
      # denial in mpu_fault, over both PMSA revisions: v7 on the M4/M7/M3, v8 on the M33
      # (a different register layout, not the same code path).
      - name: armv7m (mps2-an386)
        run: |
          cmake --preset qemu -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu
          ctest --preset qemu --no-tests=error --output-on-failure --repeat until-pass:4
          # Posture pin. The enforcing posture is a line in this board's base defconfig
          # and those two gates are REGISTERED only when it resolves on, so deleting it
          # would shrink the suite above in silence and leave the run green. Naming them
          # makes an empty selection the failure (--no-tests=error). Same --repeat as the
          # suite: the coarse mps2 clock is why it is there.
          ctest --preset qemu -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:4
      # Coverage the an386 cannot buy: the M33 is armv8-M (PMSAv8), the M7 has 16 MPU
      # regions to the M4's 8, and the M3 has no FPU so the soft-float switch path runs.
      - name: armv8-m mainline (mps2-an505, Cortex-M33)
        run: |
          cmake --preset qemu-m33 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m33
          ctest --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:4
          # Posture pin, as on the an386: each mps2 board carries its own base
          # defconfig, so one pin does not cover the other three.
          ctest --preset qemu-m33 -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:4
      - name: armv7m (mps2-an500, Cortex-M7)
        run: |
          cmake --preset qemu-m7 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m7
          ctest --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:4
          # Posture pin, as on the an386: each mps2 board carries its own base
          # defconfig, so one pin does not cover the other three.
          ctest --preset qemu-m7 -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:4
      - name: armv7m soft-float (mps2-an385, Cortex-M3)
        run: |
          cmake --preset qemu-m3 -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset qemu-m3
          ctest --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:4
          # Posture pin, as on the an386: each mps2 board carries its own base
          # defconfig, so one pin does not cover the other three.
          ctest --preset qemu-m3 -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:4
      # The ring-only posture of the same four boards, which is what ringpriv and
      # ringppb assert against: the privilege ring holds with the MPU absent. Its own
      # preset and its own build directory, because the posture is a configuration
      # variant and not something a -D can flip in place.
      - name: ARM ring-only run gates (no PMSA enforcement)
        run: |
          for b in qemu qemu-m33 qemu-m7 qemu-m3; do
            cmake --preset "$b-flat" -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
            cmake --build --preset "$b-flat"
            ctest --preset "$b-flat" --no-tests=error --output-on-failure --repeat until-pass:4
          done
      - name: armv6m (microbit)
        run: |
          cmake --preset microbit -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
          cmake --build --preset microbit
          ctest --preset microbit --no-tests=error --output-on-failure --repeat until-pass:4

  # rv32imac (virt) under QEMU, plus build-only checks of the other two rv32 boards,
  # on the pinned RISCstar toolchain (newlib, soft-float rv32imac/ilp32 multilib).
  # No idle fix needed here: RISC-V clocks off the CLINT mtime, which keeps ticking
  # during WFI (unlike the ARM semihosting clock). QEMU_TIMEOUT is failure headroom.
  qemu-riscv:
    runs-on: ubuntu-latest
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install QEMU + build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      # The ring-only posture: this board's flat variant is what the freestanding
      # PMP-less hello and cxxtest gates are registered on.
      - name: rv32imac (virt) run gate, no PMP enforcement
        run: |
          cmake --preset qemu-riscv-flat -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-flat
          ctest --preset qemu-riscv-flat --no-tests=error --output-on-failure --repeat until-pass:4
      # seam_defaults is registered on every board and reads only nm/readelf output, so a
      # board with no machine model still gets it. Named explicitly rather than running a
      # bare ctest: qemu-riscv-bench also registers boot gates that belong to the run gate
      # above, and a suite whose every case skipped reads like a suite that ran.
      - name: build-only rv32 boards
        run: |
          cmake --preset esp32c6-wroom -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom
          ctest --test-dir build/esp32c6-wroom -R seam_defaults --no-tests=error --output-on-failure
          cmake --preset esp32c6-wroom-flat -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset esp32c6-wroom-flat
          cmake --preset qemu-riscv-bench -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv-bench
          ctest --test-dir build/qemu-riscv-bench -R seam_defaults --no-tests=error --output-on-failure

  # rv32imac (virt) UNDER PMP ENFORCEMENT, which is this board's base variant: runs the full-C++
  # throw under PMP + the gp-in-appdata CI gates (riscv_no_smalldata, qemu_riscv_cxxtest,
  # qemu_riscv_mpu_fault; see docs/design-riscv-gp-split.md and docs/design-cxx-under-mpu.md).
  # Deterministic (~3s, no silicon). Same RISCstar toolchain as the non-enforcement job.
  qemu-riscv-mpu:
    runs-on: ubuntu-latest
    env:
      QEMU_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install QEMU + build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/riscv-toolchain
      - name: rv32imac (virt) enforcement gate
        run: |
          cmake --preset qemu-riscv -DKICKOS_RISCV_TOOLCHAIN_BIN="$KICKOS_RISCV_TOOLCHAIN_BIN"
          cmake --build --preset qemu-riscv
          ctest --preset qemu-riscv --no-tests=error --output-on-failure --repeat until-pass:4
          # Posture pin, as in qemu-arm: PMP enforcement is a line in this board's base
          # defconfig, and dropping it de-registers these gates instead of failing them.
          ctest --preset qemu-riscv -R 'mpu_fault|rootfault' --no-tests=error --output-on-failure --repeat until-pass:4

  # Xtensa LX6 (esp32-wroom) gate: upstream QEMU ships no ESP32 machine model, so this
  # proves build/link/linker-script + windowed-ABI asm and never boots the image. It does
  # run the one registered gate that needs no machine model, seam_defaults, which is the
  # only CI execution of any gate on Xtensa.
  # The selftest config is built too (much more link surface). esptool is NOT
  # installed: it only serves the bootable .app.bin post-step, which CI cannot boot
  # anyway; CMake reports the skip without failing.
  xtensa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/xtensa-toolchain
      # seam_defaults reads nm/readelf output only, so it runs here despite there being no
      # machine model. This is the ONLY CI execution of a gate on Xtensa, and the archive
      # -extraction rule it enforces is per-link: no other job's tree can cover this one.
      - name: xtensa lx6 (esp32-wroom) build gate
        run: |
          cmake --preset esp32-wroom -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom
          ctest --test-dir build/esp32-wroom -R seam_defaults --no-tests=error --output-on-failure
      - name: xtensa lx6 + selftest config
        run: |
          cmake --preset esp32-wroom-st -DKICKOS_XTENSA_BIN="$KICKOS_XTENSA_BIN"
          cmake --build --preset esp32-wroom-st
          ctest --test-dir build/esp32-wroom-st -R seam_defaults --no-tests=error --output-on-failure

  # Build sweep of the remaining ARM boards (catches build/link/linker-script
  # regressions). No BOOT step: these need silicon or a machine model CI does not carry.
  # The machine-model-free gate they register, seam_defaults, does run. RX omitted (no
  # hosted-runner toolchain; see the header). Xtensa is the job above; RISC-V is the
  # qemu-riscv job.
  build-boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f-flat, f411disco-flat, blackpill-flat, bluepill-c8, picopi-flat,
                 f302nucleo, due, xmc4800-relax-flat, qemu-telem, teensy41-flat,
                 pizero2350-flat]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      # The one gate these boards register that needs neither silicon nor an emulator:
      # seam_defaults reads nm/readelf output, and the resolution it checks is per-link,
      # so a board is only covered by its OWN tree. Named explicitly, not a bare ctest:
      # qemu-telem registers the full QEMU boot suite and this job installs no emulator,
      # so those cases would report as skips and a green run would read as a suite that
      # ran. They stay unrun in CI; the qemu-arm job covers the an386 tree instead.
      - run: ctest --test-dir build/${{ matrix.preset }} -R seam_defaults --no-tests=error --output-on-failure

  # ARM MPU-ENFORCEMENT build gate: the enforcement-capable ARM boards (those
  # shipping arch/arm/chip/<chip>/mpu.cmake) on their base variant, which states the
  # enforcing posture because that is the posture they ship. The only job
  # that builds the enforcement-only link surface of the silicon boards: the
  # .appdata/.appbss window and its ASSERTs, the closed-set archive selectors, the
  # grant symbols, and arch_reserved_blocks, which has NO weak default on purpose,
  # so an enforcing port that forgets its reserved set is a LINK error here, not a
  # silent open hole.
  #
  # BUILD-ONLY, necessarily: QEMU has no machine model for these chips, and what is
  # unproven is chip-specific (SYSMPU is not PMSA, imxrt1062 needs the M7
  # anti-speculation wrap, picopi is PMSAv6 with no MemManage). Trapping stays
  # silicon-proven; see docs/reference/boards.md.
  #
  # kernel_ctor_placement passes VACUOUSLY here: every app in this matrix links an
  # empty .kickos_app_init_array window, so the check takes its "window empty -> PASS"
  # early-out. It still proves the ctor-split section symbols EXIST, failing loudly
  # when they do not.
  #
  # The bare ctest (no -R) is what gives oot_export_mcu its teeth. It is registered on
  # pizero2350 as well as qemu, and only the pizero2350 run can catch a descriptor bake
  # that writes nothing: qemu is one of the four mps2 boards that state their own
  # KICKOS_MCPU, so its shipped board.cmake is complete either way, while pizero2350
  # leaves the core to the chip. The gate installs the package and cross-builds an
  # out-of-tree app with the shipped toolchain, which this job already has.
  #
  # No `ctest --preset` (arm.json defines test presets only for qemu/qemu-telem/
  # microbit): --test-dir on the preset's binaryDir. picopi links under enforcement
  # but registers no ctor gate (armv7m-only check).
  build-boards-mpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, pizero2350, teensy41,
                 xmc4800-relax, picopi]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build curl xz-utils
      - uses: ./.github/actions/arm-toolchain
      - run: cmake --preset ${{ matrix.preset }} -DKICKOS_ARM_TOOLCHAIN_BIN="$KICKOS_ARM_TOOLCHAIN_BIN"
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --no-tests=error --output-on-failure
