# Copyright (c) 2026 Philippe Leduc
#
# Build, host and QEMU checks; hardware testing is separate.
# Use ctest_named.sh to require every named test to remain registered.
# CTest treats skipped tests as success, so image jobs check their prerequisites.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual per-branch run: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per KickOS toolchain family (conan/toolchain): when the cache, keyed on the recipe's
  # files, lacks the family, it restores it from the release toolchain-<version>, or else builds
  # it and uploads the archive as an artifact for that release. The jobs below restore it from
  # the cache rather than build it inside their own timeout. A job needs only the families it
  # builds with.
  toolchain-arm-none-eabi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
          build: "true"

  toolchain-aarch64-none-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
          build: "true"

  toolchain-riscv64-none-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
          build: "true"

  toolchain-x86_64-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: x86_64-elf
          build: "true"

  # Espressif's sources are git snapshots, without the parsers a release tarball ships generated.
  toolchain-xtensa-esp32-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2 flex bison
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: xtensa-esp32-elf
          build: "true"

  # The RX patches, in conan/toolchain/patches, carry the parsers they change generated.
  toolchain-rx-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: rx-elf
          build: "true"

  # Run source-only checks once. Other jobs exclude the tree label.
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      - run: cmake --preset sim
      - run: ctest --preset sim -L tree --no-tests=error --output-on-failure

  # Run the host suite, excluding the source-only checks above.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # Require GTest before configuration so unit tests cannot be silently disabled.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build --preset sim
      - run: ctest --preset sim -LE tree --no-tests=error --output-on-failure
      # Run only the two additional telemetry checks. The main sim build covers unit tests.
      - name: the ch1 trace decoder gates (sim-telem)
        run: |
          cmake --preset sim-telem
          cmake --build --preset sim-telem
          tests/ci/ctest_named.sh 'telemetry_ring_wrap|telemetry_structural' \
            --preset sim-telem --no-tests=error --output-on-failure

  # Run sim with UBSan and stop on the first error.
  # ASan needs fiber-switch annotations for the sim's ucontext stacks.
  # Set flags in the environment so oot_export's child CMake also links UBSan.
  sim-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
      CXXFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++
      # Conan builds GTest without this job's sanitizer flags.
      - uses: ./.github/actions/gtest
      - run: cmake --preset sim -B build/sim-ubsan -DCMAKE_PREFIX_PATH="$KICKOS_GTEST_PREFIX" -DKICKOS_BUILD_UNIT_TESTS=ON
      - run: cmake --build build/sim-ubsan
      - run: ctest --test-dir build/sim-ubsan -LE tree --no-tests=error --output-on-failure

  qemu-arm:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Allow timeout headroom for loaded runners. These QEMU targets use a coarse
    # semihosting clock; arch_idle_wait spins to keep it advancing.
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
      # These images run until poll_image stops them.
      POLLED: "hello|fp_switch|mpu_fault|rootfault|rootgone|reclaimwit_park"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      # Retry only polled ARM gates: the coarse clock and runner load can delay output.
      # Each attempt still has its own timeout.
      - name: armv7m (mps2-an386)
        run: |
          cmake --preset qemu
          cmake --build --preset qemu
          ctest --preset qemu -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" --preset qemu --no-tests=error --output-on-failure --repeat until-pass:2
          # Require both tests, which are registered only when MPU enforcement is enabled.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu --no-tests=error --output-on-failure --repeat until-pass:2
      # Cover PMSAv8 on M33, the larger M7 MPU, and the soft-float M3 switch path.
      - name: armv8-m mainline (mps2-an505, Cortex-M33)
        run: |
          cmake --preset qemu-m33
          cmake --build --preset qemu-m33
          ctest --preset qemu-m33 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m33 --no-tests=error --output-on-failure --repeat until-pass:2
      - name: armv7m (mps2-an500, Cortex-M7)
        run: |
          cmake --preset qemu-m7
          cmake --build --preset qemu-m7
          ctest --preset qemu-m7 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh "$POLLED" \
            --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m7 --no-tests=error --output-on-failure --repeat until-pass:2
      - name: armv7m soft-float (mps2-an385, Cortex-M3)
        run: |
          cmake --preset qemu-m3
          cmake --build --preset qemu-m3
          ctest --preset qemu-m3 -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          # The soft-float M3 does not register fp_switch.
          tests/ci/ctest_named.sh 'hello|mpu_fault|rootfault|rootgone|reclaimwit_park' \
            --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:2
          tests/ci/ctest_named.sh 'mpu_fault|rootfault' \
            --preset qemu-m3 --no-tests=error --output-on-failure --repeat until-pass:2
          # Require the board-specific diagnostic-format test to remain registered.
          tests/ci/ctest_named.sh '^qemu_m3_diag_terse$' --preset qemu-m3 --no-tests=error --output-on-failure
      # Test privilege rings with MPU enforcement disabled.
      - name: ARM ring-only run gates (no PMSA enforcement)
        run: |
          # Flat builds do not register mpu_fault, rootfault or rootgone.
          for b in qemu qemu-m33 qemu-m7 qemu-m3; do
            if [ "$b" = qemu-m3 ]; then
              flat_polled='hello|reclaimwit_park'
            else
              flat_polled='hello|fp_switch|reclaimwit_park'
            fi
            cmake --preset "$b-flat"
            cmake --build --preset "$b-flat"
            ctest --preset "$b-flat" -E "$POLLED" -LE tree --no-tests=error --output-on-failure
            tests/ci/ctest_named.sh "$flat_polled" \
              --preset "$b-flat" --no-tests=error --output-on-failure --repeat until-pass:2
            # The flat M3 build also registers the diagnostic-format test.
            if [ "$b" = qemu-m3 ]; then
              tests/ci/ctest_named.sh '^qemu_m3_diag_terse$' --preset "$b-flat" --no-tests=error --output-on-failure
            fi
          done
      - name: armv6m (microbit)
        run: |
          cmake --preset microbit
          cmake --build --preset microbit
          ctest --preset microbit -E "$POLLED" -LE tree --no-tests=error --output-on-failure
          # The Cortex-M0 has no FPU or MPU, so those tests are absent.
          tests/ci/ctest_named.sh 'hello|reclaimwit_park' \
            --preset microbit --no-tests=error --output-on-failure --repeat until-pass:2
          # Require the stack-block test for this non-enforcing board.
          tests/ci/ctest_named.sh '^microbit_pspguard_block$' --preset microbit --no-tests=error --output-on-failure

  # Ubuntu includes qemu-system-aarch64 in qemu-system-arm.
  qemu-arm64:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt, Cortex-A53)
        run: |
          cmake --preset qemu-arm64
          cmake --build --preset qemu-arm64
          ctest --preset qemu-arm64 -LE tree --no-tests=error --output-on-failure
          # Require the kernel-stack and TLS tests for this architecture.
          tests/ci/ctest_named.sh 'death_stack_seating|no_privileged_tls|qemu_arm64_tlsprobe' \
            --preset qemu-arm64 --no-tests=error --output-on-failure
      # The runner has no i.MX 8M Plus emulator. Check the build and host tests only.
      - name: armv8a (NXP i.MX 8M Plus EVK) link surface
        run: |
          cmake --preset imx8mp-evk
          cmake --build --preset imx8mp-evk
          ctest --preset imx8mp-evk -L host -LE tree --no-tests=error --output-on-failure

  # Four-core AArch64 with and without core isolation. Check the configured
  # isolation mask directly: the expected-skip list is derived from it and
  # cannot detect its accidental removal.
  qemu-arm64-smp:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) four cores
        run: |
          cmake --preset qemu-arm64-smp
          cmake --build --preset qemu-arm64-smp
          ctest --preset qemu-arm64-smp -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on the configured core count.
          tests/ci/ctest_named.sh 'qemu_arm64_smp_arrival|qemu_arm64_smp_doorbell|qemu_arm64_smp_threads|qemu_arm64_slaypeer' \
            --preset qemu-arm64-smp --no-tests=error --output-on-failure
      - name: armv8a (virt) four cores, core 3 isolated
        run: |
          cmake --preset qemu-arm64-smpiso
          # Check the resolved isolation mask independently of the expected-skip list.
          iso=$(sed -n 's/^#define KICKOS_ISOLATED_CORES //p' \
                build/qemu-arm64-smpiso/generated/include/kickos/board_config.h)
          if [ -z "$iso" ] || [ "$((iso))" -eq 0 ]; then
            echo "smpiso resolved KICKOS_ISOLATED_CORES='$iso': this step would re-run the plain SMP posture"
            exit 1
          fi
          cmake --build --preset qemu-arm64-smpiso
          ctest --preset qemu-arm64-smpiso -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'isolated_cores|qemu_arm64_selftest' \
            --preset qemu-arm64-smpiso --no-tests=error --output-on-failure

  # Exercise shared-kernel GICv3 doorbells. The other SMP job uses GICv2;
  # AMP builds use one kernel core and cannot cover this path.
  qemu-arm64-gicv3:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) four cores under a GICv3
        run: |
          cmake --preset qemu-arm64-gicv3
          # Require GICv3 so this cannot silently duplicate the GICv2 job.
          gic=$(sed -n 's/^#define KICKOS_ARM64_GIC_VERSION //p' \
                build/qemu-arm64-gicv3/generated/include/kickos/board_config.h)
          if [ -z "$gic" ] || [ "$((gic))" -ne 3 ]; then
            echo "gicv3 resolved KICKOS_ARM64_GIC_VERSION='$gic': this step would re-run the GICv2 posture"
            exit 1
          fi
          cmake --build --preset qemu-arm64-gicv3
          ctest --preset qemu-arm64-gicv3 -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on the configured kernel-core count.
          tests/ci/ctest_named.sh 'qemu_arm64_smp_arrival|qemu_arm64_smp_doorbell|qemu_arm64_smp_threads|qemu_arm64_slaypeer' \
            --preset qemu-arm64-gicv3 --no-tests=error --output-on-failure

  # Test shared-image AMP indexing, separate-image bounds and two running kernels.
  # Do not retry: console interleaving and publication races must remain visible.
  qemu-arm64-amp:
    needs: toolchain-aarch64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a (virt) AMP, one image over four cores
        run: |
          cmake --preset qemu-arm64-amp
          # Check the resolved AMP configuration before running its conditional tests.
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp 0 shared 4
          cmake --build --preset qemu-arm64-amp
          ctest --preset qemu-arm64-amp -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'ipi_fence|qemu_arm64_selftest' \
            --preset qemu-arm64-amp --no-tests=error --output-on-failure
      - name: armv8a (virt) AMP, node 0 of a two-image partition
        run: |
          cmake --preset qemu-arm64-amp2-n0
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp2-n0 0 own 2
          cmake --build --preset qemu-arm64-amp2-n0
          # These tests build the peer and merged partition, then run both kernels.
          ctest --preset qemu-arm64-amp2-n0 -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'amp_partition|amp_elf_agree|amp_peer_arms|ipi_fence' \
            --preset qemu-arm64-amp2-n0 --no-tests=error --output-on-failure
      - name: armv8a (virt) AMP, node 1 of a two-image partition
        run: |
          cmake --preset qemu-arm64-amp2-n1
          # Build node 1 to catch accidental reuse of node 0's configuration.
          . ./.github/scripts/amp-pin.sh build/qemu-arm64-amp2-n1 1 own 2
          cmake --build --preset qemu-arm64-amp2-n1
          ctest --preset qemu-arm64-amp2-n1 -LE tree --no-tests=error --output-on-failure
      - name: armv8a (virt) AMP, a three-image partition, link geometry only
        run: |
          # Three-node build-only checks compare every pair of images. Two-node checks
          # cannot detect code that assumes every peer is node 0.
          for n in 0 1 2; do
            cmake --preset "qemu-arm64-amp3-n$n"
            . ./.github/scripts/amp-pin.sh "build/qemu-arm64-amp3-n$n" "$n" own 3
            cmake --build --preset "qemu-arm64-amp3-n$n"
          done
          # Node 0 builds and compares the peer images.
          tests/ci/ctest_named.sh 'amp_elf_agree' --preset qemu-arm64-amp3-n0 --no-tests=error --output-on-failure

  # Use the pinned RISCstar newlib toolchain with rv32imac/ilp32 multilib.
  qemu-riscv:
    needs: toolchain-riscv64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-riscv32 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv32 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      # The flat variant registers freestanding tests without PMP enforcement.
      - name: rv32imac (virt) run gate, no PMP enforcement
        run: |
          cmake --preset qemu-riscv-flat
          cmake --build --preset qemu-riscv-flat
          ctest --preset qemu-riscv-flat -LE tree --no-tests=error --output-on-failure
      # The host label excludes image tests.
      - name: build-only rv32 boards
        run: |
          cmake --preset esp32c6-wroom
          cmake --build --preset esp32c6-wroom
          ctest --test-dir build/esp32c6-wroom -L host -LE tree --no-tests=error --output-on-failure
          cmake --preset esp32c6-wroom-flat
          cmake --build --preset esp32c6-wroom-flat
          ctest --test-dir build/esp32c6-wroom-flat -L host -LE tree --no-tests=error --output-on-failure
          # Build larger selftest and benchmark images to check flash capacity.
          cmake --preset esp32c6-wroom-st
          cmake --build --preset esp32c6-wroom-st
          ctest --test-dir build/esp32c6-wroom-st -L host -LE tree --no-tests=error --output-on-failure
          cmake --preset esp32c6-wroom-bench
          cmake --build --preset esp32c6-wroom-bench
          ctest --test-dir build/esp32c6-wroom-bench -L host -LE tree --no-tests=error --output-on-failure
          # Build both C6 AMP nodes and their one-flash partition; silicon capture stays on the bench.
          cmake --preset esp32c6-wroom-amp2-n0
          cmake --build --preset esp32c6-wroom-amp2-n0 --target amp_partition kickos_default_composition
          ctest --test-dir build/esp32c6-wroom-amp2-n0 -L host -LE tree --no-tests=error --output-on-failure
          cmake --preset esp32c6-wroom-amp2-n1
          cmake --build --preset esp32c6-wroom-amp2-n1
          ctest --test-dir build/esp32c6-wroom-amp2-n1 -L host -LE tree --no-tests=error --output-on-failure
          cmake --preset qemu-riscv-bench
          cmake --build --preset qemu-riscv-bench
          ctest --test-dir build/qemu-riscv-bench -L host -LE tree --no-tests=error --output-on-failure

  # Check C++ exceptions and global-pointer placement under PMP enforcement.
  qemu-riscv-mpu:
    needs: toolchain-riscv64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-riscv32 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv32 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: rv32imac (virt) enforcement gate
        run: |
          cmake --preset qemu-riscv
          cmake --build --preset qemu-riscv
          ctest --preset qemu-riscv -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on PMP enforcement.
          tests/ci/ctest_named.sh 'mpu_fault|rootfault|rootgone' \
            --preset qemu-riscv --no-tests=error --output-on-failure

  # RV64 base, Sv48, and four-core shared-kernel tests. Use the pinned
  # RISCstar multilib toolchain and qemu-system-riscv64 from qemu-system-misc.
  # The SMP variant exercises address-space teardown while peers may still
  # hold a root page containing kernel mappings.
  qemu-riscv64:
    needs: toolchain-riscv64-none-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-misc curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
      - name: the emulator every image gate in this job boots on
        run: |
          command -v qemu-system-riscv64 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: rv64imac (virt) sv39 gate
        run: |
          cmake --preset qemu-riscv64
          cmake --build --preset qemu-riscv64
          ctest --preset qemu-riscv64 -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on memory enforcement.
          tests/ci/ctest_named.sh 'rootfault|rootgone' --preset qemu-riscv64 --no-tests=error --output-on-failure
      - name: rv64imac (virt) sv48 gate
        run: |
          cmake --preset qemu-riscv64-sv48
          cmake --build --preset qemu-riscv64-sv48
          ctest --preset qemu-riscv64-sv48 -LE tree --no-tests=error --output-on-failure
      - name: rv64imac (virt) four harts
        run: |
          cmake --preset qemu-riscv64-smp
          cmake --build --preset qemu-riscv64-smp
          ctest --preset qemu-riscv64-smp -LE tree --no-tests=error --output-on-failure
          # Require tests that depend on the hart count and selftest configuration.
          tests/ci/ctest_named.sh 'smp_threads|taskleave|slaypeer' \
            --preset qemu-riscv64-smp --no-tests=error --output-on-failure

  # Boot PE32+ through OVMF, linked by the KickOS toolchain's x86_64-elf ld under i386pep.
  # Require firmware and mtools so image tests cannot silently skip.
  qemu-x86_64:
    needs: toolchain-x86_64-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Match the selftest timeout and provide a default for other scripts.
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++ qemu-system-x86 ovmf mtools
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: x86_64-elf
      - name: The OVMF firmware pair
        run: tests/ci/resolve_ovmf.sh >> "$GITHUB_ENV"
      - name: x86_64 (q35) UEFI handover gate
        run: |
          command -v qemu-system-x86_64 >/dev/null 2>&1 \
            || { echo "qemu-system-x86_64 is absent: every image gate below would SKIP and ctest would still exit 0"; exit 1; }
          # Report whether this linker needs -b elf64-x86-64 to extract ELF archive
          # members under i386pep. Both outcomes are supported; the real link tests the flag.
          tc=$(sed -n 's/^set(KICKOS_TOOLCHAIN_BIN_x86_64-elf "\(.*\)")$/\1/p' "$KICKOS_TOOLCHAIN/kickos-toolchain.cmake")
          "$tc/x86_64-elf-ld" --version | head -1
          probe=$(mktemp -d)
          printf 'int kickos_probe_member(void){return 0;}\n' > "$probe/m.c"
          printf 'extern int kickos_probe_member(void);\nint efi_main(void){return kickos_probe_member();}\n' > "$probe/r.c"
          "$tc/x86_64-elf-gcc" -c -ffreestanding -fno-pic -fno-ident "$probe/m.c" -o "$probe/m.o"
          "$tc/x86_64-elf-gcc" -c -ffreestanding -fno-pic -fno-ident "$probe/r.c" -o "$probe/r.o"
          "$tc/x86_64-elf-ar" rcs "$probe/libm.a" "$probe/m.o"
          if "$tc/x86_64-elf-ld" -m i386pep -e efi_main "$probe/r.o" "$probe/libm.a" -o "$probe/bare.efi" 2>/dev/null; then
            echo "this ld extracts an ELF archive member under i386pep with no -b: the flag is INERT here"
          else
            echo "this ld extracts no ELF archive member under i386pep with no -b: the flag is LOAD-BEARING here"
          fi
          rm -rf "$probe"
          cmake --preset qemu-x86_64
          cmake --build --preset qemu-x86_64
          out=$(ctest --preset qemu-x86_64 -LE tree --no-tests=error --output-on-failure 2>&1) \
            || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # No test in this single-core selection is expected to skip.
          case "$out" in
            *Skipped*) echo "a gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
          # Require the architecture-specific boot checks.
          tests/ci/ctest_named.sh 'x86_64_no_vector|x86_64_entry_cld|x86_64_no_got_selftest|x86_64_weak_undef_selftest' \
            --preset qemu-x86_64 --no-tests=error --output-on-failure
          # Reuse this step's firmware paths. Override the shorter job timeout
          # with the benchmark gates' 240-second limit.
          cmake --preset qemu-x86_64-bench
          cmake --build --preset qemu-x86_64-bench
          # Run deterministic benchmark checks for counts, counter progress,
          # accumulator behavior, and parser controls. Measure IRQ latency manually
          # at rebaseline; shared-runner load makes it unsuitable for this gate.
          out=$(QEMU_TIMEOUT=240 tests/ci/ctest_named.sh 'x86_64_bench_lock|x86_64_bench_cyccnt|x86_64_bench_phase_table|x86_64_bench_saturate|x86_64_bench_irqspan_controls' \
            --test-dir build/qemu-x86_64-bench --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # Reject skipped image tests, including missing firmware or mtools.
          case "$out" in
            *Skipped*) echo "a bench gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac
      # Host gates only: a two-core image does not boot on this runner's QEMU, see qemu-x86_64-ap.
      - name: x86_64 (q35) two-core host gates
        run: |
          cmake --preset qemu-x86_64-smp2
          cmake --build build/qemu-x86_64-smp2
          ctest --test-dir build/qemu-x86_64-smp2 -L host -LE tree --no-tests=error --output-on-failure

  # Root on core 1: an application processor enters it as its first thread, and errnoprobe's
  # arm F reads libc there before any switch. q35 SMP refuses to start without x2APIC, which
  # the QEMU 8.2 of Ubuntu 24.04 does not emulate under TCG, so this job runs on 26.04.
  qemu-x86_64-ap:
    needs: toolchain-x86_64-elf
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      QEMU_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build g++ qemu-system-x86 ovmf mtools
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: x86_64-elf
      - name: The OVMF firmware pair
        run: tests/ci/resolve_ovmf.sh >> "$GITHUB_ENV"
      - name: x86_64 (q35) first thread on an application processor
        run: |
          qemu-system-x86_64 --version | head -1
          cmake --preset qemu-x86_64-smp2root1
          cmake --build --preset qemu-x86_64-smp2root1
          out=$(tests/ci/ctest_named.sh 'qemu_x86_64_errnoprobe' \
            --test-dir build/qemu-x86_64-smp2root1 --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "the AP first-thread gate SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Build LX6 application and selftest images. Run host checks for the
  # configuration, linker script and windowed ABI.
  xtensa:
    needs: toolchain-xtensa-esp32-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: xtensa-esp32-elf
      - name: xtensa lx6 (esp32-wroom) build gate
        run: |
          cmake --preset esp32-wroom
          cmake --build --preset esp32-wroom
          ctest --test-dir build/esp32-wroom -L host -LE tree --no-tests=error --output-on-failure
      - name: xtensa lx6 + selftest config
        run: |
          cmake --preset esp32-wroom-st
          cmake --build --preset esp32-wroom-st
          ctest --test-dir build/esp32-wroom-st -L host -LE tree --no-tests=error --output-on-failure
      - name: xtensa lx6 on both cores
        run: |
          cmake --preset esp32-wroom-smp
          cmake --build --preset esp32-wroom-smp
          ctest --test-dir build/esp32-wroom-smp -L host -LE tree --no-tests=error --output-on-failure
      - name: xtensa lx6 + bench config
        run: |
          cmake --preset esp32-wroom-bench
          cmake --build --preset esp32-wroom-bench
          ctest --test-dir build/esp32-wroom-bench -L host -LE tree --no-tests=error --output-on-failure

  # Build RX72M images and run host checks for each configuration. No emulator models the part.
  rx:
    needs: toolchain-rx-elf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [rx72m, rx72m-st, rx72m-flat, rx72m-bench]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils file
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: rx-elf
      - name: ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --test-dir "build/$PRESET" -L host -LE tree --no-tests=error --output-on-failure

  # Build remaining ARM boards and run host checks for each configuration.
  build-boards:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f-flat, f411disco-flat, blackpill-flat, bluepill-c8, picopi-flat,
                 f302nucleo, due, xmc4800-relax-flat, qemu-telem, teensy41-flat,
                 pizero2350-flat]
        # Build selftest variants in the same jobs. Enforcing boards are handled
        # in build-boards-mpu; qemu-telem has no selftest variant.
        include:
          - preset: bluepill-c8
            st: bluepill-c8-st
          - preset: f302nucleo
            st: f302nucleo-st
          - preset: due
            st: due-st
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          # qemu-telem needs the emulator for its image tests.
          packages: cmake ninja-build qemu-system-arm curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      # Run host checks here; qemu-telem image tests are selected separately below.
      - run: ctest --test-dir build/${{ matrix.preset }} -L host -LE tree --no-tests=error --output-on-failure
      # The larger selftest images also check flash capacity.
      - if: matrix.st
        name: the selftest provisioning of the same board
        run: |
          cmake --preset ${{ matrix.st }}
          cmake --build --preset ${{ matrix.st }}
          ctest --test-dir build/${{ matrix.st }} -L host -LE tree --no-tests=error --output-on-failure
      # Run telemetry containment and PendSV-tail trace checks under QEMU.
      - if: matrix.preset == 'qemu-telem'
        name: telemetry image arms (-L host selects them away)
        run: |
          command -v qemu-system-arm >/dev/null 2>&1 \
            || { echo "qemu-system-arm is absent: the arms below would SKIP and ctest would still exit 0"; exit 1; }
          out=$(tests/ci/ctest_named.sh 'telemetry_qemu_contained|telemetry_qemu_structural' \
            --test-dir build/qemu-telem --no-tests=error --output-on-failure 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          case "$out" in
            *Skipped*) echo "a telemetry arm SKIPPED, which ctest reports as success"; exit 1 ;;
          esac

  # Build enforcing ARM variants to check app sections, grant symbols,
  # archive selectors, and arch_reserved_blocks.
  # These apps have empty constructor sections: kernel_ctor_placement checks
  # that the section symbols exist, but not placement of actual constructors.
  build-boards-mpu:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [frdmk64f, f411disco, blackpill, pizero2350, teensy41,
                 xmc4800-relax, picopi]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} -LE tree --no-tests=error --output-on-failure
      # Build each board's larger selftest image with the same memory protection layout.
      - run: cmake --preset ${{ matrix.preset }}-st
      - run: cmake --build --preset ${{ matrix.preset }}-st
      - run: ctest --test-dir build/${{ matrix.preset }}-st -LE tree --no-tests=error --output-on-failure

  # Build RP2350 shared-image and separate-image configurations, including
  # a production build without selftests.
  pizero2350-amp:
    needs: toolchain-arm-none-eabi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - name: armv8-M shared-image AMP, the provisional scaffolding
        run: |
          # The shared image uses two cores but declares no AMP crossings, so amp-pin
          # does not apply. Separate-image nodes below each use one core.
          cmake --preset pizero2350-amp
          cmake --build --preset pizero2350-amp
          ctest --test-dir build/pizero2350-amp -L host -LE tree --no-tests=error --output-on-failure
          # Require the vector test, which depends on the two-core configuration.
          tests/ci/ctest_named.sh '^rp_node_vectors$' \
            --test-dir build/pizero2350-amp --no-tests=error --output-on-failure
      - name: armv8-M own-image partition, both nodes, self-test on
        run: |
          for node in 0 1; do
            cmake --preset pizero2350-amp2-n$node
            cmake --build --preset pizero2350-amp2-n$node
            ctest --test-dir build/pizero2350-amp2-n$node -L host -LE tree --no-tests=error --output-on-failure
          done
      - name: armv8-M own-image partition, the PRODUCTION posture (self-test off)
        run: |
          # Disable shutdown-to-bootloader along with its self-test dependency.
          # Use a separate build directory to avoid cached options. Build only:
          # preset-based gates would rebuild the standard variant instead.
          for node in 0 1; do
            cmake --preset pizero2350-amp2-n$node -B build/pizero2350-amp2-prod-n$node \
              -DKICKOS_ENABLE_SELFTEST=OFF -DKICKOS_SHUTDOWN_TO_BOOTLOADER=OFF
            cmake --build build/pizero2350-amp2-prod-n$node
          done
      - name: armv8-M own-image partition, the MERGED artefact
        run: |
          # Build the flashable merged partition. This also builds the peer and checks
          # that the Kconfig fingerprints agree.
          cmake --build build/pizero2350-amp2-prod-n0 --target amp_partition
          ls -l build/pizero2350-amp2-prod-n0/kickos-partition.elf

  # Run microbenchmark presets without a job-level QEMU_TIMEOUT: each gate
  # sets its own limit. Four-core runs need sufficient host CPU time.
  # Adjust a gate's limit if needed rather than overriding all limits here.
  bench:
    needs: [toolchain-arm-none-eabi, toolchain-aarch64-none-elf, toolchain-riscv64-none-elf]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kconfiglib
      - uses: ./.github/actions/build-tools
        with:
          packages: cmake ninja-build qemu-system-arm qemu-system-misc curl xz-utils
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: aarch64-none-elf
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: riscv64-none-elf
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: arm-none-eabi
      - name: the emulators every image gate in this job boots on
        run: |
          command -v qemu-system-aarch64 >/dev/null 2>&1 \
            || { echo "qemu-system-aarch64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
          command -v qemu-system-riscv64 >/dev/null 2>&1 \
            || { echo "qemu-system-riscv64 is absent: every image arm below would SKIP and ctest would still exit 0"; exit 1; }
      - name: armv8a and rv64 microbench at one core
        run: |
          # Require every named benchmark check to remain registered.
          # IRQ timing distributions are measured manually at rebaseline because
          # shared-runner load is uncontrolled.
          cmake --preset qemu-arm64-bench
          cmake --build --preset qemu-arm64-bench
          tests/ci/ctest_named.sh 'qemu_arm64_bench_lock|qemu_arm64_bench_cyccnt|qemu_arm64_bench_saturate|qemu_arm64_bench_phase_table|qemu_arm64_benchauth|qemu_arm64_bench_a53_pmcr|qemu_arm64_bench_irqspan_controls' \
            --test-dir build/qemu-arm64-bench --no-tests=error --output-on-failure
          cmake --preset qemu-riscv64-bench
          cmake --build --preset qemu-riscv64-bench
          tests/ci/ctest_named.sh 'qemu_riscv64_bench_lock|qemu_riscv64_bench_cyccnt|qemu_riscv64_bench_saturate|qemu_riscv64_bench_phase_table|qemu_riscv64_benchauth|qemu_riscv64_bench_irqspan_controls' \
            --test-dir build/qemu-riscv64-bench --no-tests=error --output-on-failure
      - name: four-core microbench, the deterministic arms
        run: |
          # The host label excludes image tests; the second command boots them.
          # Four-core checks cover per-core samples, doorbells, lock waits, phase
          # counts, saturation, and authority checks without latency thresholds.
          # IRQ timing is measured manually; parser controls run with the host tests.
          cmake --preset qemu-arm64-benchsmp
          cmake --build --preset qemu-arm64-benchsmp
          ctest --test-dir build/qemu-arm64-benchsmp -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'qemu_arm64_bench_percore|qemu_arm64_bench_doorbell|qemu_arm64_bench_lock|qemu_arm64_bench_cyccnt|qemu_arm64_bench_saturate|qemu_arm64_bench_phase_table|qemu_arm64_benchauth' \
            --test-dir build/qemu-arm64-benchsmp --no-tests=error --output-on-failure
          cmake --preset qemu-riscv64-benchsmp
          cmake --build --preset qemu-riscv64-benchsmp
          ctest --test-dir build/qemu-riscv64-benchsmp -L host -LE tree --no-tests=error --output-on-failure
          tests/ci/ctest_named.sh 'qemu_riscv64_bench_percore|qemu_riscv64_bench_doorbell|qemu_riscv64_bench_lock|qemu_riscv64_bench_cyccnt|qemu_riscv64_bench_saturate|qemu_riscv64_bench_phase_table|qemu_riscv64_benchauth' \
            --test-dir build/qemu-riscv64-benchsmp --no-tests=error --output-on-failure
      - name: armv7m microbench, link surface only
        run: |
          # F411 uses percentile histograms. Run host checks only; timing needs hardware.
          cmake --preset f411disco-bench
          cmake --build --preset f411disco-bench
          ctest --test-dir build/f411disco-bench -LE tree --no-tests=error --output-on-failure
          # XMC builds the min/avg/max variant without histograms.
          cmake --preset xmc4800-relax-bench
          cmake --build --preset xmc4800-relax-bench
          ctest --test-dir build/xmc4800-relax-bench -LE tree --no-tests=error --output-on-failure
