#
# The KickOS toolchain's release files (docs/design-m10-toolchain.md section 1): every family
# built on each host CI publishes for, then every pinned source beside them and their sha256
# list, as one artifact the maintainer uploads under the tag toolchain-<version>. The patches
# among them are this repository's own, from conan/toolchain/patches.

name: Toolchain release

on:
  # `gh workflow run toolchain-release.yml --ref <branch>`.
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # The macOS label is pinned, not -latest, so the host a release is built on moves only
        # when this line does.
        runner: [ubuntu-latest, macos-15]
        family: [arm-none-eabi, aarch64-none-elf, riscv64-none-elf, x86_64-elf,
                 xtensa-esp32-elf, rx-elf]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2 flex bison
      # macOS ships GNU make 3.81 and bison 2.3; the builds take Homebrew's.
      - if: runner.os == 'macOS'
        name: Homebrew's make, bison and flex
        run: |
          brew install make bison flex
          prefix=$(brew --prefix)
          echo "$prefix/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$prefix/opt/bison/bin" >> "$GITHUB_PATH"
          echo "$prefix/opt/flex/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: ${{ matrix.family }}
          build: "true"
      # A copy: the cache the action filled saves the original when the job ends.
      - name: The family's archive under its release name
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p release
          cp ~/kickos-toolchain-archive/"$FAMILY".tgz \
            release/kickos-toolchain-"$FAMILY"-"$(uname -s)"-"$(uname -m)".tgz
      - uses: actions/upload-artifact@v4
        with:
          name: kickos-toolchain-${{ matrix.family }}-${{ runner.os }}-${{ runner.arch }}
          path: release/

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Every source beside the packages, and their sha256 list
        run: tools/kickos-toolchain-release.sh release ""
      - uses: actions/upload-artifact@v4
        with:
          name: kickos-toolchain-release
          path: release/
