#
# Builds the KickOS toolchain release (docs/design-m10-toolchain.md section 1) and publishes it
# when a tag toolchain-<version>-<revision> is pushed. The tag must match the version and
# PACKAGE_REVISION in conan/toolchain.
# Each family and host gets one artifact with one file, kickos-toolchain-<family>-<os>-<arch>.tgz,
# where <os> and <arch> are what uname prints. One more artifact holds the archive of sources and
# patches, and SHA256SUMS. The release gets every file of every artifact.

name: Toolchain release

on:
  push:
    tags:
      - "toolchain-*"
  # A manual run builds every artifact but publishes nothing:
  # `gh workflow run toolchain-release.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the recipe version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^    version = "\(.*\)"$/\1/p' conan/toolchain/conanfile.py)
          revision=$(sed -n 's/^PACKAGE_REVISION = \([0-9]*\)$/\1/p' conan/toolchain/conanfile.py)
          expected="toolchain-$version-$revision"
          pattern='^toolchain-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'
          if ! [[ "$expected" =~ $pattern ]]; then
            echo "conan/toolchain/conanfile.py gives $expected; expected toolchain-x.y.z-n" >&2
            exit 1
          fi
          if [ "$EVENT" != push ]; then
            exit 0
          fi
          if ! [[ "$TAG" =~ $pattern ]]; then
            echo "$TAG is not a release tag; expected toolchain-x.y.z-n" >&2
            exit 1
          fi
          if [ "$TAG" != "$expected" ]; then
            echo "$TAG does not match conan/toolchain/conanfile.py, which expects $expected" >&2
            exit 1
          fi

  package:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        # The macOS label is pinned, not -latest, so the build host changes only when this line
        # changes.
        runner: [ubuntu-latest, macos-15]
        family: [arm-none-eabi, aarch64-none-elf, riscv64-none-elf, x86_64-elf,
                 xtensa-esp32-elf, rx-elf]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2 flex bison
      # Keep the selected Xcode: its clang is the host compiler.
      - if: runner.os == 'macOS'
        name: Free disk space on macOS
        run: |
          df -h "$RUNNER_TEMP"
          developer=$(xcode-select -p)
          keep=$(cd "$developer/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            if [ -d "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then
              sudo rm -rf "$app" || true
            fi
          done
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            sudo rm -rf "$ANDROID_HOME" || true
          fi
          df -h "$RUNNER_TEMP"
      # macOS ships GNU make 3.81 and bison 2.3, which are too old for the builds.
      - if: runner.os == 'macOS'
        name: Install make, bison and flex from Homebrew
        run: |
          brew install make bison flex
          prefix=$(brew --prefix)
          echo "$prefix/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$prefix/opt/bison/bin" >> "$GITHUB_PATH"
          echo "$prefix/opt/flex/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: ${{ matrix.family }}
          build: "true"
          upload: "false"
      # Copy the archive, do not move it: the action's cache saves the original when the job ends.
      - name: Copy the archive to its release name
        id: archive
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          name="kickos-toolchain-$FAMILY-$(uname -s)-$(uname -m).tgz"
          mkdir -p release
          cp ~/kickos-toolchain-archive/"$FAMILY".tgz release/"$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: release/${{ steps.archive.outputs.name }}
          compression-level: 0

  sources:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Download the packages so SHA256SUMS lists them. The sources artifact does not include them.
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Archive the sources and patches, and write SHA256SUMS
        run: tools/kickos-toolchain-release.sh release ""
      - uses: actions/upload-artifact@v4
        with:
          name: kickos-toolchain-sources
          path: |
            release/kickos-toolchain-sources-*.tar.xz
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [package, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum -c --strict SHA256SUMS)
          rest="${TAG#toolchain-}"
          notes="KickOS toolchain ${rest%-*}, packaging revision ${rest##*-}."
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "$notes"
