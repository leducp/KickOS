#
# The KickOS toolchain's release (docs/design-m10-toolchain.md section 1), published on the push
# of its tag toolchain-<version>-<revision>, which must name conan/toolchain's version and
# PACKAGE_REVISION. One artifact per toolchain, a family on a host, holding the one file of the
# release it is named for: kickos-toolchain-<family>-<os>-<arch>.tgz, the uname spelling. One
# artifact of the sources, which holds the sources and patches archive and the sha256 list of
# every file. The release holds every file of every artifact.

name: Toolchain release

on:
  push:
    tags:
      - "toolchain-*"
  # Builds every artifact and publishes nothing:
  # `gh workflow run toolchain-release.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag the recipe names
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^    version = "\(.*\)"$/\1/p' conan/toolchain/conanfile.py)
          revision=$(sed -n 's/^PACKAGE_REVISION = \([0-9]*\)$/\1/p' conan/toolchain/conanfile.py)
          expected="toolchain-$version-$revision"
          pattern='^toolchain-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'
          if ! [[ "$expected" =~ $pattern ]]; then
            echo "conan/toolchain names the release $expected, not toolchain-x.y.z-n" >&2
            exit 1
          fi
          if [ "$EVENT" != push ]; then
            exit 0
          fi
          if ! [[ "$TAG" =~ $pattern ]]; then
            echo "$TAG is not a release tag toolchain-x.y.z-n" >&2
            exit 1
          fi
          if [ "$TAG" != "$expected" ]; then
            echo "$TAG is not the release conan/toolchain names, $expected" >&2
            exit 1
          fi

  package:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        # The macOS label is pinned, not -latest, so the host a release is built on moves only
        # when this line does.
        runner: [ubuntu-latest, macos-15]
        family: [arm-none-eabi, aarch64-none-elf, riscv64-none-elf, x86_64-elf,
                 xtensa-esp32-elf, rx-elf]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/build-tools
        with:
          packages: build-essential m4 curl xz-utils bzip2 flex bison
      # The selected Xcode stays: its clang is the host compiler.
      - if: runner.os == 'macOS'
        name: Disk for the build, from every other Xcode and the Android SDK
        run: |
          df -h "$RUNNER_TEMP"
          developer=$(xcode-select -p)
          keep=$(cd "$developer/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            if [ -d "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then
              sudo rm -rf "$app" || true
            fi
          done
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            sudo rm -rf "$ANDROID_HOME" || true
          fi
          df -h "$RUNNER_TEMP"
      # macOS ships GNU make 3.81 and bison 2.3; the builds take Homebrew's.
      - if: runner.os == 'macOS'
        name: Homebrew's make, bison and flex
        run: |
          brew install make bison flex
          prefix=$(brew --prefix)
          echo "$prefix/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$prefix/opt/bison/bin" >> "$GITHUB_PATH"
          echo "$prefix/opt/flex/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/kickos-toolchain
        with:
          family: ${{ matrix.family }}
          build: "true"
          upload: "false"
      # A copy: the cache the action filled saves the original when the job ends.
      - name: The family's archive under its release name
        id: archive
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          name="kickos-toolchain-$FAMILY-$(uname -s)-$(uname -m).tgz"
          mkdir -p release
          cp ~/kickos-toolchain-archive/"$FAMILY".tgz release/"$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: release/${{ steps.archive.outputs.name }}
          compression-level: 0

  sources:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Only for the sha256 list to cover them: they stay in their own artifacts.
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Every source and patch in one archive, and the sha256 list
        run: tools/kickos-toolchain-release.sh release ""
      - uses: actions/upload-artifact@v4
        with:
          name: kickos-toolchain-sources
          path: |
            release/kickos-toolchain-sources-*.tar.xz
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [package, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: The release, with every file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum -c --strict SHA256SUMS)
          rest="${TAG#toolchain-}"
          notes="KickOS toolchain ${rest%-*}, packaging revision ${rest##*-}: one package per
          family and host, and the archive of every pinned source and patch. SHA256SUMS lists
          every file; docs/design-m10-toolchain.md describes them."
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "$notes"
