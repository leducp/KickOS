# The SAME pinned vendor tarball used locally (reproducibility): the official Arm GNU
# Toolchain for BARE-METAL AARCH64 (aarch64-none-elf, newlib, ships libstdc++/libsupc++).
# A DIFFERENT compiler from the arm-none-eabi one the M-profile boards use, not a multilib
# of it, which is why this is its own action and its own environment variable.
name: Arm GNU toolchain (aarch64-none-elf)
description: Fetch (cached) the pinned aarch64-none-elf toolchain and export its bin/.

inputs:
  dir:
    description: >
      Directory the tarball unpacks to; also the cache key. CI uses 15.2.rel1, the newest
      aarch64-none-elf developer.arm.com serves anonymously; the desk toolchain is
      15.3.rel1, the same harmless minor skew the arm-none-eabi action carries.
    required: false
    default: arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-elf
  url:
    description: Tarball URL; must name the same release as `dir`.
    required: false
    default: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-elf.tar.xz

runs:
  using: composite
  steps:
    - name: Cache Arm GNU toolchain (aarch64)
      id: cache-a64
      uses: actions/cache@v4
      with:
        path: ~/tc/${{ inputs.dir }}
        key: ${{ inputs.dir }}

    - name: Download Arm GNU toolchain (aarch64)
      if: steps.cache-a64.outputs.cache-hit != 'true'
      shell: bash
      env:
        A64_TC_URL: ${{ inputs.url }}
      run: |
        mkdir -p ~/tc
        # developer.arm.com 302-redirects to an anonymous Azure blob; fail loud if not xz.
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/a64.tar.xz "$A64_TC_URL"
        file /tmp/a64.tar.xz | grep -q XZ || { echo "aarch64 toolchain: $A64_TC_URL served non-xz (gated/redirect?)"; exit 1; }
        tar -C ~/tc -xf /tmp/a64.tar.xz

    - name: Put toolchain on PATH + bin
      shell: bash
      env:
        A64_TC_DIR: ${{ inputs.dir }}
      # Env var and PATH; either alone is sufficient (see the arm-toolchain action).
      # Only the variable NAME must agree with cmake/toolchain-aarch64-none-elf.cmake.
      run: |
        echo "$HOME/tc/${A64_TC_DIR}/bin" >> "$GITHUB_PATH"
        echo "KICKOS_AARCH64_TOOLCHAIN_BIN=$HOME/tc/${A64_TC_DIR}/bin" >> "$GITHUB_ENV"
