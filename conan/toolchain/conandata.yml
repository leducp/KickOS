# The pinned sources of the KickOS toolchain (docs/design-m10-toolchain.md section 1). GMP, MPFR,
# MPC and ISL are the releases GCC 16.2's contrib/download_prerequisites names. `filename` names
# an archive GitHub serves under its commit alone, or a patch in patches/ beside this file.
# `tar_sha256` is the sha256 of a gzip source's uncompressed tar, and `stored` the name the
# release's sources archive holds it under, as xz.
