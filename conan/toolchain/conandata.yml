  # KickOS's own fix to Renesas's double-precision compare branch, which takes ORDERED for
  # UNORDERED, so that isnan and printf read a double right under -mdfpu (design section 1).
  kickos-rx-dfpu-compare:
    filename: "kickos-rx-dfpu-compare.patch"
    sha256: "4f7fb1d821867aa2bdc96b5c27cf17395a56363594770b70ad1d30bdab4edfde"
  # KickOS's own change to the x86_64-elf GCC, which binds every symbol but a weak one locally
  # under -fpie, so neither the libraries nor an image reach a global offset table PE32+ cannot
  # hold (design section 5.5).
  kickos-x86_64-binds-local:
    filename: "kickos-x86_64-binds-local.patch"
    sha256: "e5ccf5397c6820e8766b7bc0c4d4a2f19f440e0d02af183a30b3ecd14b75e23e"
  # KickOS's own change to the x86_64-elf binutils, which gives an absolute word naming a weak
  # definition the PE base relocation the boot moves it by (design section 5.5).
  kickos-x86_64-pe-defweak-reloc:
    filename: "kickos-x86_64-pe-defweak-reloc.patch"
    sha256: "d26b92b35f6265a5dc46c4732de6cb65aa46a1e754a5205d9bfd59c5d9d169d1"
