  # Renesas's GNURX 14.2 changes ported onto the sources above, which the RX family applies,
  # and the trim of its multilibs to the four RX libraries (design section 1). Patches, not
  # archives: the recipe exports them, and the sources archive holds them.
  gnurx-gcc:
    filename: "gnurx-gcc-16.2.0.patch"
    sha256: "a62b716bc1eafcfe64447e20d904a6e28c88246b6f0d3303fd253d99e3000467"
  gnurx-binutils:
    filename: "gnurx-binutils-2.47.patch"
    sha256: "c1f573378da4bc424547a53958d7a10b353186acfd2575e2a771dd4ad031bf6a"
