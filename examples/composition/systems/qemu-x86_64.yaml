#
# The golden system on QEMU q35: the app and health checker of xmc4800-relax.yaml beside a
# sensor reading the CMOS clock, a device reached through PORTS rather than memory and granted
# with the same `devices` field. The task's I/O permission bitmap opens the clock's data port,
# and the kernel writes its index port for it.

version: 1
board: qemu-x86_64

# COM1 stays the kernel's console on this board.
stdout: kernel

ends: never

# The libc heap the image carves.
heap: 16384

shared:
  - name: /shm/history
    size: 64
    cache: cached # shared by tasks of this image only, on coherent memory

tasks:
  - name: sensor
    entry: sensor_main
    stack: 4096
    priority: 9
    core: 1
    devices: [/dev/cmos_rtc]
    serves: /svc/sensor
    maps: { /shm/history: rw }
    restart: { max: 3 }

  - name: app
    entry: app_main
    stack: 8192
    priority: 8
    uses: [/svc/sensor]

  - name: health
    entry: health_main
    stack: 4096
    priority: 10
    watches: [sensor]
    maps: { /shm/history: ro }
