#
# The golden system on QEMU `virt` with four A53 cores: the app and health checker of
# xmc4800-relax.yaml beside a sensor reading the PL031 clock, on a translating SMP board. Each
# task runs in its own address space, a device window is a whole page reached at the address
# the task's space maps it at, and tasks are placed on cores.
#
# Admission refuses what it refuses for xmc4800-relax.yaml, and on this board also:
#   * a device window that is not whole pages, unless its page holds another device's window
#     and the task accepts `coarse_gate`;
#   * a `core` the kernel build lacks, and a task taking a line without one `core`.

version: 1
board: qemu-arm64

# No userspace console driver on this board: stdout stays on the kernel's console, stated
# explicitly rather than left out.
stdout: kernel

ends: never

# The libc heap the image carves.
heap: 65536

# Shared memory, declared once and mapped by the init into each task that lists it under
# `maps`. Never mapped by hand: user code looks it up by name. On this translating board the
# 64 bytes round up to one page: the rest of the page is fresh memory nobody else holds, so
# rounding shared memory over-grants nothing, where rounding a device window would.
shared:
  - name: /shm/history
    size: 64
    cache: cached # shared by tasks of this image only, on coherent memory

tasks:
  - name: sensor
    entry: sensor_main
    stack: 4096
    priority: 9
    ceiling: 9
    core: 1
    devices: [/dev/rtc]
    serves: /svc/sensor
    maps: { /shm/history: rw }
    restart: { max: 3 }

  # Another core than its server: a call crosses cores, and the task declaring it does not
  # have to know.
  - name: app
    entry: app_main
    stack: 8192
    priority: 8
    ceiling: 8
    core: 2
    uses: [/svc/sensor]

  # No core: it runs on whichever core the kernel places it.
  - name: health
    entry: health_main
    stack: 4096
    priority: 10
    ceiling: 10
    watches: [sensor]
    maps: { /shm/history: ro }
