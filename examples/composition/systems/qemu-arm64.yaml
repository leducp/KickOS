#
# M10 GOLDEN EXAMPLE: the same app and health checker as xmc4800-relax.yaml, on QEMU `virt`
# with four A53 cores, to exercise what a translating SMP board adds: each task in its own
# address space, a device window that is a whole page and reached at the address the task's
# space maps it at, and tasks placed on cores. M10 is done on this board when it is admitted,
# builds, and runs under the four-core preset.
#
# Checked against the same rules as xmc4800-relax.yaml, plus:
#   * a window is a whole number of pages;
#   * a `core` exists in the kernel build, and a task that claims a line is on one core.

version: 1
board: qemu-arm64

# No userspace console driver on this board: stdout stays on the kernel's console, and
# saying so is explicit rather than a missing entry.
stdout: kernel

ends: never

# Shared memory, declared once and mapped by the init into each task that lists it under
# `maps`. Never mapped by hand: user code looks it up by name. On this translating board the
# 64 bytes round up to one page: the rest of the page is fresh memory nobody else holds, so
# rounding shared memory over-grants nothing, where rounding a device window would.
shared:
  - name: /shm/history
    size: 64
    cache: cached # shared by tasks of this image only, on coherent memory

tasks:
  - name: sensor
    entry: sensor_main
    stack: 4096
    priority: 9
    core: 1
    devices: [/dev/rtc]
    serves: /svc/sensor
    maps: { /shm/history: rw }
    restart: { max: 3 }

  # Another core than its server: a call crosses cores, and the task declaring it does not
  # have to know.
  - name: app
    entry: app_main
    stack: 8192
    priority: 8
    core: 2
    uses: [/svc/sensor]

  # No core: it runs on whichever core the kernel places it.
  - name: health
    entry: health_main
    stack: 4096
    priority: 10
    watches: [sensor]
    maps: { /shm/history: ro }
