#
# The golden system on the XMC4800 Relax Kit, with no jumper and no external part: a sensor
# whose measurement is a counter echoed through the SPI bus service's internal loopback, an app
# that polls it and reports when it freezes, and a health checker told of each death. Every task
# runs unprivileged and the user tasks hold no authority: everything privileged happens in the
# init, from these declarations.
#
# Admission refuses, each refusal naming its rule:
#   * a field the schema does not know, and a required one missing;
#   * a path in `uses` that no task declared above it serves, and a `watches` naming a task not
#     declared above it, so references point backward and nothing is solved; ready tasks start
#     in file order, and one waiting on a server is skipped and revisited;
#   * a device window or interrupt line held by two tasks, and the board's console device
#     granted to any task but the one `stdout` names;
#   * `restart` on the task `ends` names, whose one exit ends the system;
#   * a grant the platform cannot enforce, unless the limitation the chip file names is listed
#     under `accepts` (none is needed on the XMC4800);
#   * a task writing stdout above the console's priority, the console rendezvous having no
#     priority inheritance, or declared before the task `stdout` names;
#   * a priority outside the kernel build's range, an `entry` task stating no `ceiling` or one
#     below its `priority`, and counts and sizes past what the kernel build exports, a supply
#     refusal naming the Kconfig knob that would have to grow.

version: 1
board: xmc4800-relax

# Where every task's stdout goes. Explicit, so no task is special because of its position.
stdout: /svc/console

# What ends the system. `never`: it runs until reset, and the init stays resident.
ends: never

# The libc heap the image carves.
heap: 16384

# Shared memory, declared once and mapped by the init into each task that lists it under
# `maps`. Never mapped by hand: user code looks it up by name. The size rounds up to what the
# protection unit grants, a power of two of at least 32 bytes on this MPU.
shared:
  - name: /shm/history
    size: 64
    cache: cached # shared by tasks of this image only, on coherent memory

# Restart is a counter and nothing more. `restart: { max: N }` starts a dead task again from
# its entry with the same grants, at most N times in the system's life; without it a task is
# never restarted. Once the count is spent the task stays dead and the system carries on:
# whether to stop is the user's call, made by a task that watches it. A restarted task's
# stack is fresh and its globals are not, every app task sharing the image's data section.

tasks:
  # A driver shipped with the kernel package. `devices` grants the channel's register window.
  # `lines` binds each line role the driver's exported metadata declares, `irq` alone for both
  # drivers here, to the line it takes. The chip lets either USIC0 channel raise either module
  # line, so nothing else says which is whose; admission refuses an unbound role and a line
  # two tasks take.
  - name: console
    driver: xmcuartirq
    devices: [/dev/usic0/ch0]
    lines: { irq: /dev/usic0/sr0 }
    serves: /svc/console
    priority: 12

  - name: spi0
    driver: xmcssc
    devices: [/dev/usic0/ch1]
    lines: { irq: /dev/usic0/sr1 }
    serves: /svc/spi0
    priority: 11
    restart: { max: 3 }

  # User code from here on. `entry` is a symbol in this project's sources, and `ceiling` the
  # highest priority the task's threads may take, here the task's own.
  - name: sensor
    entry: sensor_main
    stack: 2048
    priority: 9
    ceiling: 9
    uses: [/svc/spi0]
    serves: /svc/sensor
    maps: { /shm/history: rw }
    restart: { max: 3 }

  - name: app
    entry: app_main
    stack: 4096
    priority: 8
    ceiling: 8
    uses: [/svc/sensor]

  # A user task told of every death among the tasks it watches, after the init has applied
  # their restart counters, and allowed to ask how many restarts each has left.
  - name: health
    entry: health_main
    stack: 2048
    priority: 10
    ceiling: 10
    watches: [spi0, sensor]
    maps: { /shm/history: ro }
