# M10 GOLDEN EXAMPLE: the board half for QEMU `virt` with A53 cores. Nothing reads it yet;
# its home once something does is platform/virt_arm64/qemu-arm64.yaml. An emulated board decides little: its
# console, and nothing soldered on.

version: 1
board: qemu-arm64
chip: virt_arm64

# The kernel's console. No userspace driver takes it over on this board.
console:
  device: /dev/uart0
