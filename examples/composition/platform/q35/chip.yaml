# M10 GOLDEN EXAMPLE: the chip half for QEMU's q35 PC. Nothing reads it yet; its home once
# something does is platform/q35/. Values are the ones the tree uses (chip_q35.cc,
# com1_q35.cc, chip_limits.h) and the fixed PC assignments they rely on. No port parses ACPI
# or the MADT, so this file is the description here too.

version: 1
chip: q35
arch: x86_64

# A translating unit, as on the other big cores. And a second address space the others do
# not have: port I/O. A port range is a resource of its own, `ports` below, granted by the
# same `device:` a composition uses for a window. A ring-3 port access needs the task's I/O
# permission bitmap, which M10 adds: the kernel loads each task's bitmap into the core's
# task-state segment on every switch.
protection: { unit: mmu, page: 0x1000, covers_devices: true, io_ports: true }

cores: { count: [1, 12], smp: true } # two to twelve on the SMP presets

devices:
  # I/O APIC redirection entries, 24 on the ICH9. A line here is the entry number.
  com1: { ports: [0x3F8, 8], lines: { global: 4 } } # 16550, the kernel console
  # The CMOS clock: an index port and a data port. Writing the index port also sets the
  # NMI mask in its top bit, so the index is a privileged register inside the range: the
  # task's bitmap opens only the data port, and the index is written through
  # kos_port_reg_write, a byte-wide write that withholds that bit.
  cmos_rtc:
    ports: [0x70, 2]
    privileged_registers: { index: 0x0 }
    lines: { global: 8 }

  lapic: { owner: kernel } # MMIO on the xAPIC path, MSRs under x2APIC
  ioapic: { owner: kernel }
  pic: { owner: kernel }   # the legacy pair, remapped and masked at boot
  pit: { owner: kernel }   # calibrates the TSC
  acpi_pm: { owner: kernel } # the power-off register
