#
# M10 GOLDEN EXAMPLE: the board half of a board description. Nothing reads it yet; its home
# once something does is platform/xmc4800/xmc4800-relax.yaml. Only what this BOARD decides: its chip, how
# the chip is wired here, and what is soldered on. Chip facts live in chip.yaml beside it.
#
# The paths a composition uses come from here and from the chip: /dev/<device>/<channel>.

version: 1
board: xmc4800-relax
chip: xmc4800

# The kernel console until a userspace driver takes it over: USIC0 channel 0 on the debug
# probe's virtual COM port.
console:
  device: /dev/usic0/ch0
  pins: { tx: P1.5, rx: P1.4 }

leds:
  led1: { pin: P5.9, active: high, owner: kernel } # the kernel's diagnostic LED
  led2: { pin: P5.8, active: high }
