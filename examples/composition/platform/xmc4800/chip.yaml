#
# M10 GOLDEN EXAMPLE: the chip half of a board description. Nothing reads it yet; its home
# once something does is platform/xmc4800/. Chip facts only,
# shared by every board built on this part. Values are the ones the tree already uses
# (chip_mmap.h, irq.h, chip_xmc4800.cc), from the XMC4700/XMC4800 Reference Manual V1.3.
#
# Extending it is adding an entry: a device the chip has and nothing here names yet is
# simply absent, and a composition naming it is refused.

version: 1
chip: xmc4800
arch: armv7m
# The per-thread unit sits on the CPU's access path, so it sees device addresses too: a
# device window granted to a task is enforced for that task alone. The window encoding and
# the region budget are the unit's, exported by the kernel build for admission to check.
protection: { unit: pmsav7, covers_devices: true }

devices:
  # USIC0 is a MODULE of two channels. Each channel is its own register window, but the
  # module's service-request lines are shared: a channel raises whichever line its INPR
  # register points at. So the lines belong to the module, named /dev/usic0/sr0 and so on,
  # and a composition binds one to a driver explicitly; admission refuses a line bound twice.
  # The driver learns which line it was given from its lookup and programs INPR to match.
  # The module clock gate and reset sit in the SCU, which the kernel owns.
  usic0:
    lines: { sr0: 84, sr1: 85 }
    channels:
      ch0: { window: [0x40030000, 0x200] }
      ch1: { window: [0x40030200, 0x200] }
    # Inside each channel window, and Write = PV: an unprivileged store is discarded with no
    # fault, so a driver writes them through kos_periph_reg_write. Which channel may write
    # which bits is kernel policy and stays in the kernel.
    privileged_registers: { fdr: 0x010, brg: 0x014, ccr: 0x040 }

  # The monotonic time base.
  ccu40: { owner: kernel }
  scu: { owner: kernel }

# Pins are PORT.PIN. A function is what the pin's IOCR selects; `in:` names an input path.
pins:
  P1.5: { alt2: usic0.ch0.dout0 }
  P1.4: { in: usic0.ch0.dx0b }
