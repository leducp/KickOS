# M10 GOLDEN EXAMPLE: the board half for the FRDM-K64F. Nothing reads it yet; its home once
# something does is platform/mk64f/frdmk64f.yaml. Chip facts live in chip.yaml beside it.

version: 1
board: frdmk64f
chip: mk64f

console:
  device: /dev/uart0
  pins: { tx: PTB17, rx: PTB16 } # the OpenSDA virtual COM port

leds:
  blue: { pin: PTB21, active: low }
  red: { pin: PTB22, active: low, owner: kernel } # the kernel's diagnostic LED

# The SPI bus as this board wires it for the KickCAT slave: DSPI0 with a GPIO chip select.
buses:
  spi0:
    device: /dev/dspi0
    pins: [PTD1, PTD2, PTD3]
    chip_selects: [PTC4]
