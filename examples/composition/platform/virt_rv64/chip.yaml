# M10 GOLDEN EXAMPLE: the chip half for QEMU's RV64 `virt` machine. Nothing reads it yet; its
# home once something does is platform/virt_rv64/. Values are the ones the tree uses
# (chip_virt_rv64.cc) and, for devices it does not drive yet, the ones QEMU publishes:
# `-M virt -machine dumpdtb=`.

version: 1
chip: virt_rv64
arch: rv64imac

# Sv39 or Sv48 by preset; the page is 4 KiB either way. Same consequences as virt_arm64.
protection: { unit: mmu, page: 0x1000, covers_devices: true }

cores: { count: [1, 4], smp: true }

devices:
  # PLIC source numbers.
  uart0: { window: [0x10000000, 0x100], lines: { global: 10 } } # ns16550a, the kernel console
  # A free-running nanosecond clock: a measurement that always moves.
  rtc: { window: [0x00101000, 0x1000], lines: { alarm: 11 } }   # goldfish RTC

  clint: { owner: kernel } # machine-mode timer and software interrupts
  # The whole aperture up to the UART, whose register file grows with the hart count. The
  # kernel does not reserve it yet (chip_virt_rv64.cc names that as a gap); this file does.
  plic: { owner: kernel }
