# M10 GOLDEN EXAMPLE: the board half for the ESP32-C6 WROOM module board. Nothing reads it
# yet; its home once something does is platform/esp32c6/esp32c6-wroom.yaml. Chip facts live in
# chip.yaml beside it.

version: 1
board: esp32c6-wroom
chip: esp32c6

console:
  device: /dev/uart0
  pins: { tx: GPIO16, rx: GPIO17 } # the USB bridge

# Pins the board has already spent, which no composition may mux.
reserved_pins:
  GPIO8: strapping
  GPIO9: strapping
  GPIO15: strapping
  GPIO12: usb_jtag
  GPIO13: usb_jtag
